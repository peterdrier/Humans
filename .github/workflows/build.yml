name: Build and Test

on:
  push:
    branches: [ main ]
  # Deliberately NO base-branch filter. `branches: [ main ]` on pull_request
  # filters on the PR's *base*, so a stacked PR — one targeting another feature
  # branch rather than main — silently got no build, no tests, no code-quality
  # and no migration checks. That is how #1113-#1119 (the #858 per-section
  # DbContext split, ~50k lines across seven PRs) sat for two weeks with
  # `check-migrations` and `report` as their only checks; those two come from
  # label-db.yml / pr-surface-report.yml, which never had a base filter.
  # Preview-DB provisioning stays main-only — see preview-db.yml.
  pull_request:

# Cancel superseded runs on the same PR — agent-driven PRs push in bursts and
# the stale runs just burn runner time and queue depth. Pushes to main are
# never cancelled and never coalesced: each gets a unique group via run_id,
# because every main commit deploys to QA and e2e-qa waits on its exact sha.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  # The per-section DbContexts (nobodies-collective/Humans#858) in one
  # place, as `context:project` pairs — a section that moves into its own
  # project (nobodies-collective/Humans#866, G5) owns its migrations, so
  # `--project` is no longer the same for every context. There is no main
  # pile since peel 15 deleted HumansDbContext and its historical chain;
  # every context is a section context. detect-migration-changes maps the
  # run's changed files against this list; the `has-pending-model-changes`
  # loops and the from-scratch baseline apply iterate only the affected
  # pairs. A new section adds its pair here and nowhere else in this file;
  # a G5 move edits its pair's project here.
  SECTION_DB_CONTEXTS: >-
    UsersDbContext:src/Sections/Humans.Users
    SystemSettingsDbContext:src/Sections/Humans.SystemSettings
    ContainersDbContext:src/Sections/Humans.Containers
    AgentDbContext:src/Sections/Humans.Agent
    ExpensesDbContext:src/Sections/Humans.Expenses
    FinanceDbContext:src/Sections/Humans.Finance
    HoldedDbContext:src/Sections/Humans.Holded
    SurveysDbContext:src/Sections/Humans.Surveys
    EventGuideDbContext:src/Sections/Humans.Events
    AuthDbContext:src/Sections/Humans.Auth
    EmailDbContext:src/Sections/Humans.Email
    CalendarDbContext:src/Sections/Humans.Calendar
    NotificationsDbContext:src/Sections/Humans.Notifications
    IssuesDbContext:src/Sections/Humans.Issues
    GovernanceDbContext:src/Sections/Humans.Governance
    CampaignsDbContext:src/Sections/Humans.Campaigns
    GoogleIntegrationDbContext:src/Sections/Humans.GoogleIntegration
    TicketsDbContext:src/Sections/Humans.Tickets
    FeedbackDbContext:src/Sections/Humans.Feedback
    CityPlanningDbContext:src/Sections/Humans.CityPlanning
    BudgetDbContext:src/Sections/Humans.Budget
    CampsDbContext:src/Sections/Humans.Camps
    GateDbContext:src/Sections/Humans.Gate
    SystemDbContext:src/Humans.Web
    LegalDbContext:src/Sections/Humans.Consent
    AuditLogDbContext:src/Sections/Humans.AuditLog
    ShiftsDbContext:src/Sections/Humans.Shifts
    TeamsDbContext:src/Sections/Humans.Teams
    StoreDbContext:src/Sections/Humans.Store

jobs:
  build:
    # needs the cheap detect job (~15s) so the EF chain verify below can skip
    # entirely — or check only the affected contexts — instead of spending
    # ~80s spawning `dotnet ef` once per context on every run.
    needs: detect-migration-changes
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore Humans.slnx

    - name: Build
      run: dotnet build Humans.slnx --no-restore --configuration Release

    - name: Test
      # --blame-hang-timeout 2m is the CI hang guard: if the test host stalls
      # for 2+ minutes we dump and fail the run rather than burning the whole
      # job budget on a silent hang. See nobodies-collective/Humans#586 — PR
      # peterdrier/Humans#306 shipped a DI cycle that silently stalled the
      # test host for 8+ minutes before this guard existed.
      # The filter names Humans.Integration.Tests in full, not a bare "Integration":
      # that assembly needs Docker/Testcontainers, which is noisy on ubuntu-latest
      # (3e91df5c7). A bare substring also matched Humans.GoogleIntegration.Tests once
      # that section got its own test project, silently skipping 248 unit and
      # architecture tests — including the ones guarding the section boundary —
      # and it matched test METHOD names too, which is how
      # Humans.Monitor.Tests.IGoogleDriveActivityClient_LivesOnGoogleIntegrationsLeaf
      # was being skipped from an unrelated assembly.
      run: dotnet test Humans.slnx --no-build --configuration Release --verbosity quiet --blame-hang-timeout 2m --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=minimal" --filter "FullyQualifiedName!~Humans.Integration.Tests"

    - name: Verify EF migration chain is linear
      # Catches migration forks (two migrations claiming the same parent) and
      # snapshot drift (a *ModelSnapshot.cs out of sync with its DbContext
      # model). Exits non-zero if a snapshot doesn't match the live model —
      # which is exactly what happens when two branches each add a migration
      # off the same tip and one merges before the other. One check per
      # AFFECTED context since the per-section split (#858): each `dotnet ef`
      # spawn costs ~2.5s, so checking all 29 contexts on every run cost ~80s
      # when ~99% of runs touch no migration-relevant path at all.
      if: needs.detect-migration-changes.outputs.contexts != ''
      run: |
        dotnet tool install --global dotnet-ef --version 10.0.*
        for pair in ${{ needs.detect-migration-changes.outputs.contexts }}; do
          dotnet ef migrations has-pending-model-changes \
            --context "${pair%%:*}" \
            --project "${pair#*:}" \
            --startup-project src/Humans.Web \
            --no-build --configuration Release
        done

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'
        retention-days: 5

  detect-migration-changes:
    # Maps the run's changed files to the affected `context:project` pairs.
    # An empty `contexts` output skips both EF check layers: the chain verify
    # in the build job and the self-hosted verify-migrations-apply job. Cheap
    # GitHub-hosted job so the heavy work stays idle on runs that don't touch
    # migration-relevant code.
    runs-on: ubuntu-latest
    outputs:
      contexts: ${{ steps.affected.outputs.contexts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            migrations:
              - 'src/Humans.Web/Migrations/**'
              # SystemDbContext + its factory live here (not under Migrations/**);
              # a DbSet added there must trigger the System checks.
              - 'src/Humans.Web/Data/**'
              - 'src/Humans.Domain/**'
              # Shared leaf: enums here are EF-mapped by section configurations
              # (e.g. Teams maps SystemTeamType with HasConversion<string> and
              # seeds rows via HasData keyed on the member names), so a rename
              # is real model drift in any context -> maps to ALL pairs below.
              - 'src/Humans.Base/**'
              # A G5 section owns its migrations, DbContext, EF configurations and
              # entities (nobodies-collective/Humans#866). Globbed, not listed per
              # section, so a section that moves is covered without a workflow edit —
              # Store's Data/Migrations/** had been unwatched since the pilot.
              - 'src/Sections/*/Data/**'
              - 'src/Sections/*/Domain/**'
              # Contracts leaves hold EF-mapped types too: Users' entities sit
              # public on its leaf (#866, G5 lane 2 — User : IdentityUser<Guid>
              # is named by Base), and any leaf enum consumed by its section's
              # entities with HasConversion<string> + HasData is model-relevant.
              # Each leaf maps to its owning section's pair below.
              - 'src/Sections/*.Contracts/**'
              # Central package manifest: an EF Core / Npgsql / Identity /
              # DataProtection bump can change model-building conventions or
              # framework-owned schema, which is snapshot drift no source path
              # reflects -> maps to ALL pairs. Over-triggers on non-EF bumps,
              # but the file only changes when package versions do.
              - 'Directory.Packages.props'
              - '.github/workflows/build.yml'

      - name: Map changed files to affected DB contexts
        id: affected
        if: steps.filter.outputs.migrations == 'true'
        run: |
          # Changed file -> owning project dir -> pair from SECTION_DB_CONTEXTS.
          # A .Contracts leaf maps to its owning section; the shared leaves
          # (Humans.Domain, Humans.Base) and this workflow can affect
          # any context -> all pairs.
          all=false
          declare -A hit
          for f in ${{ steps.filter.outputs.migrations_files }}; do
            case "$f" in
              src/Humans.Domain/*|src/Humans.Base/*|Directory.Packages.props|.github/workflows/build.yml) all=true ;;
              src/Sections/*) proj="$(echo "$f" | cut -d/ -f3)"; hit["src/Sections/${proj%.Contracts}"]=1 ;;
              src/Humans.Web/*) hit[src/Humans.Web]=1 ;;
            esac
          done
          contexts=""
          for pair in $SECTION_DB_CONTEXTS; do
            if [ "$all" = true ] || [ -n "${hit[${pair#*:}]:-}" ]; then
              contexts="$contexts $pair"
            fi
          done
          echo "Affected contexts:${contexts:- (none)}"
          echo "contexts=$contexts" >> "$GITHUB_OUTPUT"

  verify-migrations-apply:
    # Layer 2 EF migration check (nobodies-collective/Humans#590): apply every
    # migration from scratch against a real Postgres and assert exit 0. Catches
    # failures that pass `has-pending-model-changes` (Layer 1, in the build job
    # above) but break at apply time — FK to a column that no longer exists,
    # index on a column with the wrong type, ordering bugs.
    #
    # Runner pinning: `devbox` is a custom label registered on humans-runner-1
    # and humans-runner-2 (Linux containers running on Peter's Windows dev box
    # via Docker). The job is intentionally NOT eligible for nuc-runner
    # (different physical machine) or GitHub-hosted runners — keeps Layer 2
    # work on the dev box rather than burning NUC cycles. If both devbox
    # runners are offline the job queues until one comes back — the rest of CI
    # is unaffected because this job only `needs:` the cheap
    # detect-migration-changes job, not the main build/test job.
    needs: detect-migration-changes
    if: needs.detect-migration-changes.outputs.contexts != ''
    runs-on: [self-hosted, devbox]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start ephemeral Postgres
        id: pg
        run: |
          set -euo pipefail
          # The runner is itself a container; create a job-scoped Docker
          # network and attach both the runner and a fresh Postgres container
          # to it so dotnet-ef can reach Postgres by container name.
          NETWORK="humans-mig-net-${{ github.run_id }}-${{ github.run_attempt }}"
          PG_CONTAINER="humans-mig-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          RUNNER_CONTAINER="$(hostname)"

          docker network create "$NETWORK"
          docker network connect "$NETWORK" "$RUNNER_CONTAINER"

          docker run -d \
            --name "$PG_CONTAINER" \
            --network "$NETWORK" \
            -e POSTGRES_USER=humans \
            -e POSTGRES_PASSWORD=humans \
            -e POSTGRES_DB=humans \
            postgres:16-alpine

          for i in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U humans -d humans >/dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Postgres did not become ready within 30s"
              docker logs "$PG_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done

          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "container=$PG_CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore src/Humans.Web

      - name: Build (Release)
        # `dotnet ef database update --no-build` only needs the startup project
        # and the migration projects built; Humans.Web's transitive closure
        # covers every section project and skips the ~50 test projects.
        # Analyzers off: the GitHub-hosted build job already enforces them on
        # the same commit. -maxcpucount:4 caps MSBuild's node count so this
        # job doesn't peg the dev box the runners live on.
        run: dotnet build src/Humans.Web --no-restore --configuration Release -p:RunAnalyzersDuringBuild=false -maxcpucount:4

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          # GitHub-hosted ubuntu has the global tools dir on PATH by default;
          # this self-hosted Linux runner does not. Persist for later steps.
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply per-section baselines from scratch
        run: |
          # Each affected context against its own empty database — the real-up
          # baselines execute for real via the CLI (nobodies-collective/Humans#858).
          # No main-pile replay: the historical chain was deleted at peel 15.
          set -euo pipefail
          for pair in ${{ needs.detect-migration-changes.outputs.contexts }}; do
            ctx="${pair%%:*}"
            db="humans_$(echo "$ctx" | tr '[:upper:]' '[:lower:]')"
            docker exec "${{ steps.pg.outputs.container }}" \
              psql -U humans -d postgres -c "CREATE DATABASE $db"
            ConnectionStrings__DefaultConnection="Host=${{ steps.pg.outputs.container }};Port=5432;Database=$db;Username=humans;Password=humans" \
              dotnet ef database update \
                --context "${pair%%:*}" \
                --project "${pair#*:}" \
                --startup-project src/Humans.Web \
                --no-build --configuration Release
          done

      - name: Verify model snapshots are in sync (post-apply)
        env:
          ConnectionStrings__DefaultConnection: "Host=${{ steps.pg.outputs.container }};Port=5432;Database=humans;Username=humans;Password=humans"
        run: |
          # Belt-and-suspenders: Layer 1 already runs this in the build job,
          # but re-checking after a real apply guards against any state the
          # apply step might have observed differently from a static check.
          for pair in ${{ needs.detect-migration-changes.outputs.contexts }}; do
            dotnet ef migrations has-pending-model-changes \
              --context "${pair%%:*}" \
              --project "${pair#*:}" \
              --startup-project src/Humans.Web \
              --no-build --configuration Release
          done

      - name: Tear down ephemeral Postgres
        if: always() && steps.pg.outputs.container != ''
        run: |
          docker rm -f "${{ steps.pg.outputs.container }}" || true
          docker network disconnect "${{ steps.pg.outputs.network }}" "$(hostname)" || true
          docker network rm "${{ steps.pg.outputs.network }}" || true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore Humans.slnx

    - name: Check formatting
      # Whitespace only. The style and analyzer passes `dotnet format` would
      # also run are already enforced by the build job: EnforceCodeStyleInBuild
      # + TreatWarningsAsErrors surface every warning-or-higher rule as a build
      # error there, and the full three-pass format check spent ~200s per run
      # re-running the same analysis for no additional signal.
      run: dotnet format whitespace Humans.slnx --verify-no-changes --no-restore --exclude src/Humans.Web/Migrations/

    - name: Forbid RS0030 suppressions in test code
      # The BannedApiAnalyzers rule RS0030 enforces "no bare [Fact] / [Theory]
      # in tests — use HumansFact / HumansTheory". The only legitimate
      # suppression site is tests/Humans.Testing/ where HumansFactAttribute
      # itself is declared. Anywhere else is a policy escape hatch and is
      # forbidden — set a higher Timeout on [HumansFact] instead.
      run: |
        if grep -rn --include='*.cs' --exclude-dir=Humans.Testing 'RS0030' tests/; then
          echo "::error::RS0030 suppressions in test code are forbidden. Use [HumansFact] / [HumansTheory] (or set Timeout = N) instead of suppressing the analyzer."
          exit 1
        fi
