name: Build and Test

on:
  push:
    branches: [ main ]
  # Deliberately NO base-branch filter. `branches: [ main ]` on pull_request
  # filters on the PR's *base*, so a stacked PR — one targeting another feature
  # branch rather than main — silently got no build, no tests, no code-quality
  # and no migration checks. That is how #1113-#1119 (the #858 per-section
  # DbContext split, ~50k lines across seven PRs) sat for two weeks with
  # `check-migrations` and `report` as their only checks; those two come from
  # label-db.yml / pr-surface-report.yml, which never had a base filter.
  # Preview-DB provisioning stays main-only — see preview-db.yml.
  pull_request:

env:
  DOTNET_VERSION: '10.0.x'
  # The peeled per-section DbContexts (nobodies-collective/Humans#858) in one
  # place, as `context:project` pairs — a section that moves into its own
  # project (nobodies-collective/Humans#866, G5) owns its migrations, so
  # `--project` is no longer the same for every context. Both
  # `has-pending-model-changes` loops below iterate
  # `$MAIN_DB_CONTEXT $SECTION_DB_CONTEXTS`; the from-scratch baseline apply
  # iterates the section list alone, because HumansDbContext replays its full
  # historical chain in the step before it. A new peel adds its pair here and
  # nowhere else in this file; a G5 move edits its pair's project here.
  MAIN_DB_CONTEXT: 'HumansDbContext:src/Humans.Infrastructure'
  SECTION_DB_CONTEXTS: >-
    SystemSettingsDbContext:src/Sections/Humans.SystemSettings
    ContainersDbContext:src/Sections/Humans.Containers
    AgentDbContext:src/Sections/Humans.Agent
    ExpensesDbContext:src/Sections/Humans.Expenses
    FinanceDbContext:src/Sections/Humans.Finance
    HoldedDbContext:src/Sections/Humans.Holded
    SurveysDbContext:src/Sections/Humans.Surveys
    EventGuideDbContext:src/Sections/Humans.Events
    AuthDbContext:src/Humans.Infrastructure
    EmailDbContext:src/Humans.Infrastructure
    CalendarDbContext:src/Sections/Humans.Calendar
    NotificationsDbContext:src/Sections/Humans.Notifications
    IssuesDbContext:src/Sections/Humans.Issues
    GovernanceDbContext:src/Sections/Humans.Governance
    CampaignsDbContext:src/Sections/Humans.Campaigns
    GoogleIntegrationDbContext:src/Humans.Infrastructure
    TicketsDbContext:src/Humans.Infrastructure
    FeedbackDbContext:src/Sections/Humans.Feedback
    CityPlanningDbContext:src/Sections/Humans.CityPlanning
    BudgetDbContext:src/Sections/Humans.Budget
    CampsDbContext:src/Humans.Infrastructure
    GateDbContext:src/Sections/Humans.Gate
    SystemDbContext:src/Humans.Infrastructure
    LegalDbContext:src/Humans.Infrastructure
    AuditLogDbContext:src/Humans.Infrastructure
    ShiftsDbContext:src/Humans.Infrastructure
    TeamsDbContext:src/Humans.Infrastructure
    StoreDbContext:src/Sections/Humans.Store

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Humans.slnx

    - name: Build
      run: dotnet build Humans.slnx --no-restore --configuration Release

    - name: Test
      # --blame-hang-timeout 2m is the CI hang guard: if the test host stalls
      # for 2+ minutes we dump and fail the run rather than burning the whole
      # job budget on a silent hang. See nobodies-collective/Humans#586 — PR
      # peterdrier/Humans#306 shipped a DI cycle that silently stalled the
      # test host for 8+ minutes before this guard existed.
      run: dotnet test Humans.slnx --no-build --configuration Release --verbosity quiet --blame-hang-timeout 2m --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=minimal" --filter "FullyQualifiedName!~Integration"

    - name: Verify EF migration chain is linear
      # Catches migration forks (two migrations claiming the same parent) and
      # snapshot drift (a *ModelSnapshot.cs out of sync with its DbContext
      # model). Exits non-zero if a snapshot doesn't match the live model —
      # which is exactly what happens when two branches each add a migration
      # off the same tip and one merges before the other. One check per
      # context since the per-section split (nobodies-collective/Humans#858).
      run: |
        dotnet tool install --global dotnet-ef --version 10.0.*
        for pair in $MAIN_DB_CONTEXT $SECTION_DB_CONTEXTS; do
          dotnet ef migrations has-pending-model-changes \
            --context "${pair%%:*}" \
            --project "${pair#*:}" \
            --startup-project src/Humans.Web \
            --no-build --configuration Release
        done

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'
        retention-days: 5

  detect-migration-changes:
    # Decides whether the Layer 2 verify-migrations-apply job runs. Cheap
    # GitHub-hosted job so the heavy self-hosted job stays idle on PRs that
    # don't touch migration-relevant code.
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'src/Humans.Infrastructure/Migrations/**'
              - 'src/Humans.Domain/**'
              # A G5 section owns its migrations, DbContext, EF configurations and
              # entities (nobodies-collective/Humans#866). Globbed, not listed per
              # section, so a section that moves is covered without a workflow edit —
              # Store's Data/Migrations/** had been unwatched since the pilot.
              - 'src/Sections/*/Data/**'
              - 'src/Sections/*/Domain/**'
              - '.github/workflows/build.yml'

  verify-migrations-apply:
    # Layer 2 EF migration check (nobodies-collective/Humans#590): apply every
    # migration from scratch against a real Postgres and assert exit 0. Catches
    # failures that pass `has-pending-model-changes` (Layer 1, in the build job
    # above) but break at apply time — FK to a column that no longer exists,
    # index on a column with the wrong type, ordering bugs.
    #
    # Runner pinning: `devbox` is a custom label registered on humans-runner-1
    # and humans-runner-2 (Linux containers running on Peter's Windows dev box
    # via Docker). The job is intentionally NOT eligible for nuc-runner
    # (different physical machine) or GitHub-hosted runners — keeps Layer 2
    # work on the dev box rather than burning NUC cycles. If both devbox
    # runners are offline the job queues until one comes back — the rest of CI
    # is unaffected because this job only `needs:` the cheap
    # detect-migration-changes job, not the main build/test job.
    needs: detect-migration-changes
    if: needs.detect-migration-changes.outputs.migrations == 'true'
    runs-on: [self-hosted, devbox]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start ephemeral Postgres
        id: pg
        run: |
          set -euo pipefail
          # The runner is itself a container; create a job-scoped Docker
          # network and attach both the runner and a fresh Postgres container
          # to it so dotnet-ef can reach Postgres by container name.
          NETWORK="humans-mig-net-${{ github.run_id }}-${{ github.run_attempt }}"
          PG_CONTAINER="humans-mig-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          RUNNER_CONTAINER="$(hostname)"

          docker network create "$NETWORK"
          docker network connect "$NETWORK" "$RUNNER_CONTAINER"

          docker run -d \
            --name "$PG_CONTAINER" \
            --network "$NETWORK" \
            -e POSTGRES_USER=humans \
            -e POSTGRES_PASSWORD=humans \
            -e POSTGRES_DB=humans \
            postgres:16-alpine

          for i in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U humans -d humans >/dev/null 2>&1; then
              echo "Postgres ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Postgres did not become ready within 30s"
              docker logs "$PG_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done

          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "container=$PG_CONTAINER" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore Humans.slnx

      - name: Build (Release)
        run: dotnet build Humans.slnx --no-restore --configuration Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          # GitHub-hosted ubuntu has the global tools dir on PATH by default;
          # this self-hosted Linux runner does not. Persist for later steps.
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply migrations from scratch
        env:
          ConnectionStrings__DefaultConnection: "Host=${{ steps.pg.outputs.container }};Port=5432;Database=humans;Username=humans;Password=humans"
        run: |
          # Main pile: full historical-chain replay. The old chain still
          # creates every peeled section's tables on a fresh database, so the
          # section contexts are exercised separately below against their own
          # empty databases (nobodies-collective/Humans#858) — that is the only
          # place the real-up baselines execute for real via the CLI.
          dotnet ef database update \
            --context "${MAIN_DB_CONTEXT%%:*}" \
            --project "${MAIN_DB_CONTEXT#*:}" \
            --startup-project src/Humans.Web \
            --no-build --configuration Release

      - name: Apply per-section baselines from scratch
        run: |
          set -euo pipefail
          for pair in $SECTION_DB_CONTEXTS; do
            ctx="${pair%%:*}"
            db="humans_$(echo "$ctx" | tr '[:upper:]' '[:lower:]')"
            docker exec "${{ steps.pg.outputs.container }}" \
              psql -U humans -d postgres -c "CREATE DATABASE $db"
            ConnectionStrings__DefaultConnection="Host=${{ steps.pg.outputs.container }};Port=5432;Database=$db;Username=humans;Password=humans" \
              dotnet ef database update \
                --context "${pair%%:*}" \
                --project "${pair#*:}" \
                --startup-project src/Humans.Web \
                --no-build --configuration Release
          done

      - name: Verify model snapshots are in sync (post-apply)
        env:
          ConnectionStrings__DefaultConnection: "Host=${{ steps.pg.outputs.container }};Port=5432;Database=humans;Username=humans;Password=humans"
        run: |
          # Belt-and-suspenders: Layer 1 already runs this in the build job,
          # but re-checking after a real apply guards against any state the
          # apply step might have observed differently from a static check.
          for pair in $MAIN_DB_CONTEXT $SECTION_DB_CONTEXTS; do
            dotnet ef migrations has-pending-model-changes \
              --context "${pair%%:*}" \
              --project "${pair#*:}" \
              --startup-project src/Humans.Web \
              --no-build --configuration Release
          done

      - name: Tear down ephemeral Postgres
        if: always() && steps.pg.outputs.container != ''
        run: |
          docker rm -f "${{ steps.pg.outputs.container }}" || true
          docker network disconnect "${{ steps.pg.outputs.network }}" "$(hostname)" || true
          docker network rm "${{ steps.pg.outputs.network }}" || true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore Humans.slnx

    - name: Check formatting
      run: dotnet format Humans.slnx --verify-no-changes --verbosity diagnostic --exclude src/Humans.Infrastructure/Migrations/

    - name: Enforce google_resources ownership
      run: bash scripts/check-google-resource-ownership.sh

    - name: Forbid RS0030 suppressions in test code
      # The BannedApiAnalyzers rule RS0030 enforces "no bare [Fact] / [Theory]
      # in tests — use HumansFact / HumansTheory". The only legitimate
      # suppression site is tests/Humans.Testing/ where HumansFactAttribute
      # itself is declared. Anywhere else is a policy escape hatch and is
      # forbidden — set a higher Timeout on [HumansFact] instead.
      run: |
        if grep -rn --include='*.cs' --exclude-dir=Humans.Testing 'RS0030' tests/; then
          echo "::error::RS0030 suppressions in test code are forbidden. Use [HumansFact] / [HumansTheory] (or set Timeout = N) instead of suppressing the analyzer."
          exit 1
        fi
