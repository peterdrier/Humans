name: claude-review

# Auto-review PRs using the official Anthropic claude-code-action.
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token` against a Pro/Max
# subscription) bills review runs against the subscription rather than
# the API. Posts inline comments + a top-level summary, like Codex.
#
# This file is identical in peterdrier/Humans and nobodies-collective/Humans;
# behavior diverges via the `if:` guard below so the file promotes cleanly
# between the two repos:
#
#   peterdrier/Humans
#     Trigger: pull_request_target for same-repo PRs and for fork PRs from
#              trusted authors (OWNER/MEMBER/COLLABORATOR per GitHub's
#              author_association). Random external forks are skipped.
#
#   nobodies-collective/Humans
#     Trigger: pull_request_target, only when the head is peterdrier/Humans
#              (the QA-promotion path). Random external forks are skipped.
#
#   Auth (both): workflow GITHUB_TOKEN; comments post as github-actions[bot].
#     Anthropic's OIDC → App-token exchange 401s on pull_request_target
#     (anthropics/claude-code-action#713) and passing github_token skips it,
#     so the job needs no `id-token: write`.
#
# Why never `pull_request` (2026-09-30): on `pull_request` GitHub takes the
# whole workflow file from the PR head, and same-repo branch PRs get
# secrets. Any pushed branch — including an agent's, steered by whatever it
# last read — could rewrite these steps or the prompt, exfiltrate
# CLAUDE_CODE_OAUTH_TOKEN, or tell the reviewer to find nothing.
# pull_request_target and issue_comment both run this file from the base
# branch, so nothing a PR contains changes what this job does.
#
# Trust boundary: the workspace is the BASE branch on every trigger
# (actions/checkout's default for both events; with a `prompt:` the action
# runs in agent mode and does not check out the PR head). So the review
# prompt (.claude/claude-review-prompt.md, read by the `review-prompt`
# step), the tool allow-list below, and the rule documents the reviewer
# reads all come from base. The PR enters only as data: `.claude/pr-diff.sh`
# (a wrapper pinned to the two fetched commits — raw `git diff` is not
# allowed, since `--no-index` reads any file on the runner) and
# `git show <sha>:<path>` on the commits the `fetch-pr` step fetches.
# Nothing from the PR executes. Do NOT add build/test/install steps, do NOT
# check out the PR head, and keep the prompt out of any PR-supplied path.
# The prompt also declares all PR content untrusted and makes a steering
# attempt a finding.
#
# Run cadence:
#   Auto: on PR open (non-draft) and draft → ready_for_review. 'synchronize'
#         (every push) is intentionally OFF — review-every-push burns budget
#         and re-flags suppressed findings churns reviewer attention. Enable
#         by adding 'synchronize' to the trigger 'types' if quota allows.
#   On-demand: any OWNER/MEMBER/COLLABORATOR posting a comment starting with
#              `/review` on the PR triggers a fresh run. The docs-only skip
#              does NOT apply to comment-triggered runs (explicit ask wins).
#   Docs-only: the `review` job reports as SKIPPED, not passed — a green
#              check next to no review would read as review signal.
#   Dependabot: PRs opened by dependabot[bot] are skipped (actor guard in the
#               `if:` below). Dependabot-triggered runs use the isolated
#               Dependabot secret store, so CLAUDE_CODE_OAUTH_TOKEN is empty
#               and the action fails fast — a spurious red check on every bump.
#
# What a green check means: the review ran, nothing more. It passes whether
# or not findings were posted, and "no issues found" can mean the reviewer
# missed them. It gates nothing; findings are triaged per
# memory/process/review-finding-triage.md.
#
# Model: pinned in `claude_args` so a change in the action's default never
# silently changes review quality or cost. Opus-class matches what the
# unpinned default ran before the pin. The `run-report` step logs turns and
# the SDK's API-equivalent cost per run — measure before changing the pin.
# Subagents the reviewer spawns run on .claude/settings.json's
# CLAUDE_CODE_SUBAGENT_MODEL: the base checkout's project settings and
# hooks load here too, and block-inherited-subagent-model.sh passes a
# model-less spawn only under GITHUB_ACTIONS for that reason.
#
# Reviewer tools: Read/Grep/Glob inside the checkout plus the read-only
# `gh` and `git show` sub-commands in `claude_args` below. The file tools
# are deliberately NOT in the allow-list: Claude Code permits them within
# the working directory without a rule, and a bare `Read` rule would lift
# that fence and let the reviewer read /proc/self/environ (the OAuth token)
# or the runner's temp files. Nothing here can write: the workspace is
# read-only to the reviewer and no build or test step runs.
#
# Run report: the `run-report` step after the action prints turns, cost,
# every permission denial and every errored tool result from the SDK
# execution file, so a review that did nothing is diagnosable from the run
# log without `show_full_output`.
#
# Concurrency: per-PR group with cancel-in-progress. A new push or `/review`
# during an in-flight review cancels the stale run instead of stacking.
#
# Setup (one-time, per repo):
#   1. `claude setup-token` locally → copy the OAuth token.
#   2. Add as repo secret CLAUDE_CODE_OAUTH_TOKEN
#      (Settings → Secrets and variables → Actions).
#   3. Token is valid ~1 year; rotate by re-running setup-token.

on:
  # Never add `pull_request` here — see "Why never `pull_request`" above.
  pull_request_target:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  # Note: do NOT use trigger-level paths-ignore here. For pull_request_target,
  # GitHub evaluates path filters against the PR's cumulative diff vs base,
  # not the push delta — and a filtered-out trigger reports as a missing
  # check rather than a skipped one. The docs-only skip is enforced by the
  # `skip-if-docs-only` step below, which compares base...head via the
  # compare API.

concurrency:
  # Include event_name so pull_request_target and issue_comment events get
  # separate slots per PR. Workflow-level concurrency is evaluated BEFORE
  # job-level `if:`, so without this split, every PR comment (which queues
  # an issue_comment run that then skips) would cancel an in-flight review
  # via cancel-in-progress. Trade-off: a `/review` comment posted while an
  # automatic review is still running won't cancel that review — both run
  # to completion. Cancel-in-progress still consolidates repeats within the
  # same event type.
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Resolves the PR and decides whether to review it. A separate job so a
  # docs-only skip shows `review` as skipped rather than passed.
  preflight:
    if: |
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '/review')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                    github.event.comment.author_association))
      ||
      (github.event_name == 'pull_request_target'
        && github.event.pull_request.draft == false
        && github.actor != 'dependabot[bot]'
        && (
        (github.repository == 'peterdrier/Humans'
          && (github.event.pull_request.head.repo.full_name == github.repository
            || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                        github.event.pull_request.author_association)))
        ||
        (github.repository == 'nobodies-collective/Humans'
          && github.event.pull_request.head.repo.full_name == 'peterdrier/Humans')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      merge_base: ${{ steps.pr.outputs.merge_base }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      # Resolve the PR under review once, for every trigger, and hand the
      # result to the action's prompt. Without it the reviewer spends ~8
      # turns on `gh pr list` / `gh pr view` / `gh api pulls/N` working out
      # which PR it is — the custom `prompt:` below suppresses the action's
      # own PR-context block. issue_comment events carry only the issue
      # number, so the SHAs have to come from the API on every path.
      - name: pr-context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${PR}" \
            --jq '"number=\(.number)", "head_sha=\(.head.sha)", "base_sha=\(.base.sha)", "base_ref=\(.base.ref)"' \
            | tee -a "$GITHUB_OUTPUT"
          # The review diffs from the merge base, as the PR page does: base.sha
          # is the base branch tip, and diffing from it on a stale branch
          # shows base-only commits as reverse changes. Falls back to base.sha.
          base=$(grep '^base_sha=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          head=$(grep '^head_sha=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          mb=$(gh api "repos/${{ github.repository }}/compare/${base}...${head}" --jq .merge_base_commit.sha 2>/dev/null || true)
          echo "merge_base=${mb:-$base}" | tee -a "$GITHUB_OUTPUT"

      # Skip the review when the PR diff is docs-only. Compares
      # base.sha...head.sha via the compare API — works across forks because
      # PR head SHAs are mirrored into refs/pull/N/head in the base repo.
      # Fails open: if the compare endpoint errors, run the review.
      - name: skip-if-docs-only
        id: guard
        if: github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ steps.pr.outputs.base_sha }}
          HEAD: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          echo "Comparing $BASE...$HEAD"
          if ! files=$(gh api "repos/${{ github.repository }}/compare/${BASE}...${HEAD}" --jq '.files[].filename' 2>&1); then
            echo "Compare API failed; running review anyway."
            echo "$files"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$files" ]]; then
            echo "No file changes in this delta; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files in delta:"
          echo "$files"
          # The review prompt is markdown but steers every later review, so a
          # change to it always gets reviewed.
          if echo "$files" | grep -qvE '(^docs/|\.md$)' \
            || echo "$files" | grep -qxF '.claude/claude-review-prompt.md'; then
            echo "Non-docs files present; running review."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only delta; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A full review runs ~5 minutes; without this the job inherits the
    # 360-minute default and a hung action burns an afternoon of runner time.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base branch — see "Trust boundary" in the header. Never add a
      # `ref:` pointing at the PR head.
      - uses: actions/checkout@v7

      # Brings the PR's head and merge-base commits into the object store so
      # the reviewer can diff them and `git show <sha>:<path>` any changed
      # file. Objects only: nothing is checked out, so no PR file lands in
      # the workspace.
      - name: fetch-pr
        env:
          BASE: ${{ needs.preflight.outputs.merge_base }}
          HEAD: ${{ needs.preflight.outputs.head_sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"

      # Read from the base checkout, so the prompt is whatever base says.
      - name: review-prompt
        id: prompt
        run: |
          set -euo pipefail
          delim="PROMPT_$(openssl rand -hex 16)"
          {
            echo "body<<$delim"
            cat .claude/claude-review-prompt.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        # The range .claude/pr-diff.sh diffs; the reviewer cannot change it.
        env:
          PR_MERGE_BASE: ${{ needs.preflight.outputs.merge_base }}
          PR_HEAD: ${{ needs.preflight.outputs.head_sha }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Skips the OIDC exchange (see #713 in the header).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request for the Nobodies Humans codebase.

              Repo:      ${{ github.repository }}
              Owner:     ${{ github.event.repository.owner.login }}
              Repo name: ${{ github.event.repository.name }}
              PR:        #${{ needs.preflight.outputs.number }}
              Head SHA:  ${{ needs.preflight.outputs.head_sha }}
              Base:      ${{ needs.preflight.outputs.base_ref }} @ ${{ needs.preflight.outputs.merge_base }} (merge base)

            That is the PR under review. Do NOT run `gh pr list` or
            `gh pr view` to work out which PR it is, and do not look up the
            head SHA — it is above, and it is the SHA the summary comment
            must cite. The diff is `.claude/pr-diff.sh`, pinned to those two
            commits: `.claude/pr-diff.sh --stat`, `--name-only`,
            `--name-status`, or `-- <paths>` for one slice; no other options.
            Raw `git diff` and `gh pr diff` are not allowed. Start with the
            shape, not the content: run `--stat` first. Under ~30 files,
            take the full diff next. Over that, never pull the whole diff
            into your own context: group the files by section, spawn one
            subagent per group with `.claude/pr-diff.sh -- <paths>` for its
            slice, and keep your context for their reports and the summary.

            ${{ steps.prompt.outputs.body }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(.claude/pr-diff.sh:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh api:*),Bash(git show:*)"

      # Surface what happened without a full debug log. The action writes
      # every SDK message to claude-execution-output.json; the result message
      # carries turns, cost and permission_denials (tool name + input), and
      # each tool_result carries is_error. Inputs are truncated so PR content
      # does not flood the log. Informational only — it never fails the job.
      - name: run-report
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          [ -f "$FILE" ] || { echo "No execution file at $FILE"; exit 0; }
          echo "== run =="
          jq -r '.[] | select(.type=="result")
                 | "turns=\(.num_turns) cost_usd=\(.total_cost_usd) duration_s=\((.duration_ms // 0) / 1000 | floor) is_error=\(.is_error)"' "$FILE"
          echo "== permission denials =="
          jq -r '.[] | select(.type=="result") | .permission_denials[]?
                 | "DENIED \(.tool_name): \(.tool_input | tostring | .[0:200])"' "$FILE"
          echo "== tool errors =="
          jq -r '([.[] | select(.type=="assistant") | .message.content[]?
                   | select(.type=="tool_use") | {key: .id, value: .name}]
                  | from_entries) as $names
                 | .[] | select(.type=="user") | .message.content[]?
                 | select(.type=="tool_result" and .is_error==true)
                 | "ERROR \($names[.tool_use_id] // "?"): \(.content | tostring | .[0:300])"' "$FILE"
