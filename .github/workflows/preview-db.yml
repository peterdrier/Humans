name: Preview Database
on:
  pull_request:
    types: [opened, reopened, closed]
    branches: [main]
  # Manual path for fork PRs a maintainer deploys by hand (CONTRIBUTING.md).
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to create a preview database for
        required: true

jobs:
  # Clone only for PRs whose branch lives in this repo (collaborators) or on
  # manual dispatch. Fork PRs get no preview (AGENTS.md). Cleanup stays
  # unguarded: it runs no PR code and must still drop clones made before this guard.
  clone-db:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'opened' || github.event.action == 'reopened'))
    runs-on: [self-hosted, nuc]
    steps:
      - name: Create preview database (clone from QA)
        run: |
          PR_ID=${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          DB_NAME="humans_pr_${PR_ID}"

          # Terminate connections and drop if exists (handles reopened PRs)
          docker exec humans-db psql -U humans -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${DB_NAME}' AND pid <> pg_backend_pid();" || true
          docker exec humans-db psql -U humans -c "DROP DATABASE IF EXISTS ${DB_NAME};"

          # Clone from QA
          docker exec humans-db psql -U humans -c "CREATE DATABASE ${DB_NAME};"
          docker exec humans-db bash -c "pg_dump -U humans humans | psql -U humans ${DB_NAME}"

          echo "Created database ${DB_NAME}"

      - name: Create preview uploads directory
        run: |
          mkdir -p /opt/docker/human/uploads-pr-${{ github.event.inputs.pr_number || github.event.pull_request.number }}

  cleanup-db:
    if: github.event.action == 'closed'
    runs-on: [self-hosted, nuc]
    steps:
      - name: Drop preview database
        run: |
          docker exec humans-db psql -U humans -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'humans_pr_${{ github.event.pull_request.number }}' AND pid <> pg_backend_pid();" || true
          docker exec humans-db psql -U humans -c "DROP DATABASE IF EXISTS humans_pr_${{ github.event.pull_request.number }};"

      - name: Remove preview uploads
        run: |
          rm -rf /opt/docker/human/uploads-pr-${{ github.event.pull_request.number }}/
