name: E2E Tests (QA)

on:
  push:
    branches: [main]

# QA only ever runs the newest main deploy, so an e2e run against a superseded
# sha is testing an environment that no longer exists — cancel it.
concurrency:
  group: e2e-qa
  cancel-in-progress: true

jobs:
  e2e:
    if: github.repository == 'peterdrier/Humans'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait for QA deploy
        working-directory: .
        run: |
          FULL_SHA="${{ github.sha }}"
          SHORT_SHA="${FULL_SHA:0:8}"
          URL="https://humans.n.burn.camp/api/version"
          echo "Waiting for $SHORT_SHA to deploy..."

          for i in $(seq 1 60); do
            DEPLOYED=$(curl -sf "$URL" | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$DEPLOYED" = "$SHORT_SHA" ] || [ "$DEPLOYED" = "$FULL_SHA" ]; then
              echo "Deploy confirmed after ~$((i * 5))s"
              exit 0
            fi
            echo "Attempt $i: deployed=$DEPLOYED, expected=$SHORT_SHA"
            sleep 5
          done

          # A superseded run is cancelled by the concurrency group above, so reaching here means
          # the deploy itself is late or broken. Fail: a run that tested nothing must not show green.
          echo "::error::Build $SHORT_SHA not deployed to QA within 5 minutes (deployed=$DEPLOYED)"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: https://humans.n.burn.camp

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
