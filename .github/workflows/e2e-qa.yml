name: E2E Tests (QA)

# Daily, not per push: the suite is too flaky to gate each merge. Runs test whatever main
# is deployed on QA at the time.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-qa
  cancel-in-progress: false

jobs:
  e2e:
    if: github.repository == 'peterdrier/Humans'
    # devbox only: Playwright's --with-deps does not recognise nuc-runner's OS.
    runs-on: [self-hosted, devbox]
    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: https://humans.n.burn.camp

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
