name: Flag PRs with merge conflicts

# A conflicted PR gets the merge-conflict label plus one comment; the comment
# wakes whichever session is watching the PR. GitHub sends no event of its own
# when a PR becomes conflicted, hence the re-check on every push to main.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: merge-conflict-label-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const LABEL = 'merge-conflict';
            const READY = 'ready-to-merge';
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            const numbers = context.payload.pull_request
              ? [context.payload.pull_request.number]
              : (await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 }))
                  .map(p => p.number);

            for (const pull_number of numbers) {
              // mergeable is null while GitHub computes it in the background.
              let pr;
              for (let attempt = 0; attempt < 10; attempt++) {
                pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
                if (pr.mergeable !== null || pr.state !== 'open') break;
                await sleep(6000);
              }
              if (pr.state !== 'open' || pr.mergeable === null) {
                core.info(`#${pull_number}: skipped (state ${pr.state}, mergeable unknown)`);
                continue;
              }

              const labels = pr.labels.map(l => l.name);
              const flagged = labels.includes(LABEL);

              if (pr.mergeable === false && !flagged) {
                core.info(`#${pull_number}: conflicted, flagging`);
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [LABEL] });
                if (labels.includes(READY)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: READY });
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull_number,
                  body: `This PR has a merge conflict with \`${pr.base.ref}\`. ` +
                        `Merge \`origin/${pr.base.ref}\` into the branch and resolve the conflicts. ` +
                        `The \`${LABEL}\` label comes off automatically once it merges cleanly` +
                        (labels.includes(READY) ? `; \`${READY}\` was removed and needs re-earning.` : '.')
                });
              } else if (pr.mergeable === true && flagged) {
                core.info(`#${pull_number}: clean again, unflagging`);
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: LABEL });
              } else {
                core.info(`#${pull_number}: no change (mergeable ${pr.mergeable}, labelled ${flagged})`);
              }
            }
