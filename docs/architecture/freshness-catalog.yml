# Freshness catalog — see docs/superpowers/specs/2026-04-25-freshness-sweep-design.md
# Consumed by /freshness-sweep (.claude/skills/freshness-sweep/SKILL.md)

version: 1

# Mechanical entries — fully auto-derived. Each entry declares trigger globs
# (matched against `git diff --name-only <anchor>..upstream/main`) and an
# update method (script or prompt).
mechanical:
  - id: dev-stats
    # RUN AFTER `reforge-history`. generate-stats.sh reads docs/reforge-history.csv
    # for its semantic class/interface counts and silently regex-falls-back for any
    # day the CSV does not yet cover — run it first and every new day in the window
    # gets the weaker fallback number, permanently. The 2026-08-24 sweep hit exactly
    # this (regex-fallback=6 days) and had to revert and re-run.
    target: docs/development-stats.md
    triggers:
      - "src/**/*.cs"
      - "src/**/*.cshtml"
    update: script
    script: docs/scripts/generate-stats.sh

  - id: about-page-packages
    target: src/Humans.Web/Views/About/Index.cshtml
    triggers:
      - "Directory.Packages.props"
      - "**/*.csproj"
    update: prompt
    prompt: |
      Read Directory.Packages.props and every .csproj file in the repo.
      Build a list of production NuGet packages (exclude test-only packages
      that are referenced only from anything under tests/).

      Open src/Humans.Web/Views/About/Index.cshtml. Find the package list
      section ("The Ingredients" and any package cards below it). Update
      version numbers in place. Add new packages following the existing
      card structure with a one-line description (carry over any existing
      description for packages already in the file). Remove cards for
      packages no longer referenced.

      Preserve all prose, contributor names, the license section, and any
      hand-written copy outside the package cards. Do not invent licenses
      or descriptions; if you don't know a new package's license, leave a
      `<!-- TODO: license -->` HTML comment next to its card and add a
      question to your return JSON asking Peter to confirm.

  - id: docs-readme-index
    target: docs/README.md
    triggers:
      - "docs/features/**/*.md"
      - "docs/sections/**/*.md"
      - "docs/guide/**/*.md"
      # README indexes the in-project invariants docs of sections too, so a
      # new or renamed section doc must mark it dirty. Adding Tour's row this
      # sweep required a manual nudge for exactly this reason.
      - "src/Sections/*/Docs/*.md"
      # …and the section's feature specs, which sit one level deeper. The glob above
      # does not descend, so without this a new spec never marks README dirty.
      - "src/Sections/*/Docs/features/*.md"
    update: prompt
    prompt: |
      Walk docs/features/global/, docs/sections/, docs/guide/, AND src/Sections/*/Docs/
      recursively — a section keeps its invariants doc directly in Docs/ and its feature
      specs in Docs/features/, and README indexes both, so a walk restricted to docs/ or
      one that does not descend into Docs/features/ would drop exactly the in-project doc
      whose change fired this entry.
      docs/features/ now holds only global/, the cross-section specs.
      Exclude SECTION-TEMPLATE.md, G5-SECTION-TEMPLATE.md, README.md,
      GettingStarted.md, Glossary.md, and the dated design records matching
      src/Sections/*/Docs/20*.md. Every section's doc lives at the derivable path
      src/Sections/Humans.<Section>/Docs/<Section>.md — there is no index doc.

      For each .md file, derive a one-line description from the first paragraph
      of the file (or the H1 + first sentence if the first paragraph is too long).

      Update docs/README.md to list every doc found, grouped by directory,
      using the existing table layout (file name → relative link → description).
      Preserve any hand-written prose at the top of docs/README.md (intro,
      pointers to architecture/, etc.). Only regenerate the indexed tables.

  - id: authorization-inventory
    # Split per-section 2026-08-18 (Peter): each section's authorization map
    # lives in its own project at src/Sections/Humans.<X>/Docs/authorization.md,
    # routed by each controller's and handler's owning project, so a change
    # inside one section only regenerates that section's file. The global target
    # below keeps ONLY the cross-section content (view map, canonical policy
    # names, same-rule-different-spelling table, enforcement gaps, role
    # appendix) plus the Humans.Web shell controllers and handlers.
    target: docs/authorization-inventory.md
    triggers:
      - "src/Humans.Web/Controllers/**/*.cs"
      - "src/Humans.Web/Authorization/**/*.cs"
      # RoleChecks / ShiftRoleChecks / PolicyNames moved with the rest of Humans.UI
      # into Humans.Base; the old glob matched nothing.
      - "src/Humans.Base/Authorization/**/*.cs"
      # Section-owned resource handlers — eight sections keep theirs under
      # src/Sections/<Section>/Authorization/, and had silently left this sweep.
      - "src/Sections/**/Authorization/**/*.cs"
      # Section-owned controllers carry [Authorize] attributes the inventory lists,
      # but were not a trigger for it.
      - "src/Sections/*/Controllers/**/*.cs"
    update: prompt
    prompt: |
      Document current state only — no move/migration history, no "new this
      sweep", no PR archaeology, no generated-by header boilerplate
      (memory/process/current-state-docs-no-history.md). A PR/date reference
      is allowed only for a live pending item.

      Regenerate the per-section authorization maps and the global inventory.

      Outputs: src/Sections/Humans.<X>/Docs/authorization.md for each section
      whose Controllers/ or Authorization/ files changed in the diff window, and
      docs/authorization-inventory.md (view map + canonical policy names +
      same-rule-different-spelling table + enforcement gaps + role appendix,
      plus the src/Humans.Web shell's own controllers and handlers) when
      cross-section findings or Humans.Web files changed. Do NOT regenerate
      untouched sections' files.

      Route every controller and handler to the map that OWNS it, by its own
      source path: a type under src/Sections/<Project>/ belongs in that
      project's Docs/authorization.md, and only src/Humans.Web types belong in
      the global inventory. Never document a section's controller in the global
      file or in a neighbouring section's map — the verifier checks the owning
      map only, and a misfiled row leaves the owner permanently stale.

      Search src/Humans.Web/ (Controllers/, Authorization/),
      src/Humans.Base/Authorization/ (RoleChecks / ShiftRoleChecks /
      PolicyNames), AND every src/Sections/*/ project (its Controllers/ and
      Authorization/ folders). Find every:
      - [Authorize(Roles = ...)] / [Authorize(Policy = ...)] attribute on
        controllers and actions
      - RoleChecks.* / ShiftRoleChecks.* invocation
      - IAuthorizationService.AuthorizeAsync call site
      - Resource-based authorization handler (subclass of AuthorizationHandler<T, R>)

      Match the existing column layout: Controller | Scope | Roles | Source.
      "Scope" is "Class" for class-level [Authorize], "Action" for
      action-level. "Roles" is the comma-separated role list. "Source" names
      the static field (e.g. RoleNames.Admin, RoleGroups.BoardOrAdmin) when
      identifiable.

      Preserve each file's existing intro paragraph and any non-table prose at
      the top, and the global file's "Per-Section Inventories" pointer section.

  # controller-architecture-audit retired 2026-08-18 (Peter): the action-name
  # conventions live in docs/architecture/conventions.md, and a perpetual
  # per-action inventory just re-derives what the code already says. Do not re-add.

  - id: dependency-graph
    target: docs/architecture/dependency-graph.md
    triggers:
      - "src/Humans.Web/Services/**/*.cs"
      - "src/Humans.Web/Program.cs"
      - "src/Humans.Web/Extensions/Sections/**/*.cs"
      # Most services now live in section projects and register themselves from
      # their own Section.cs, not from Humans.Web/Extensions/Sections/. Without
      # these, a ctor change to any moved service (Teams, Tickets, Holded, …)
      # left this graph stale without ever marking it dirty.
      - "src/Sections/*/Services/**/*.cs"
      - "src/Sections/*/Section.cs"
    update: prompt
    prompt: |
      Regenerate the Mermaid dependency graph in docs/architecture/dependency-graph.md.

      This graph shows CROSS-SECTION edges only (Peter, 2026-08-18): omit any
      edge whose consumer and target implementation live in the same section
      project, omit nodes left with zero edges, and never re-add intra-section
      detail. Walk every service class under src/Sections/*/Services/ AND the
      cross-section orchestrators left in src/Humans.Web/Services/. For each:
      1. Read the constructor; identify every injected interface.
      2. For each injected interface, follow it to its implementing service to
         identify the owning section. The section is the project name: an
         implementation under src/Sections/Humans.Teams/Services/ belongs to Teams.
         Note the interface may be declared in a separate Humans.<X>.Contracts
         project; the section is where the IMPLEMENTATION lives, not the contract.
         Drop the edge if both ends resolve to the same section.
      3. Distinguish ctor-injected (solid arrow) from
         IServiceProvider.GetRequiredService<T>() (dashed arrow with "lazy"
         label).
      4. Identify cross-cutting services (AuditLogService, EmailService,
         NotificationService, RoleAssignmentService, HumansMetrics) — place
         these on the right side of the graph as a separate cluster.

      5. A service with no cross-section edges at all is not drawn. List it in
         the "Services with no cross-section edges" section instead, backtick-
         quoted. Regenerate that roster from the same walk that produces the
         diagram, in the same pass — it is the diagram's complement, not prose.
         Every service must end up in exactly one of the two: the verifier
         accepts an undrawn service only if it is named there, so a service that
         loses its last cross-section dependency fails the check until it is
         added, and one that gains its first must be removed from the roster as
         it enters the diagram.

      After regenerating the Mermaid body, recount the `linkStyle` line: it
      indexes the lazy edges by position, so every added or removed eager edge
      shifts them. Eager edges are numbered 0..n-1 in source order and the lazy
      ones follow; the comment above it must state the new counts.

      Preserve the document header ("How to read", classDef colors) and the
      remaining explanatory prose — the cycles, fan-in and follow-up sections.

  - id: service-data-access-map
    # Split per-section 2026-08-18 (Peter): each section's map lives in its own
    # project at src/Sections/Humans.<X>/Docs/data-access.md so a change inside
    # one section only regenerates that section's file. The global target below
    # keeps ONLY the cross-section content (Dashboard orchestrator, cross-section
    # analysis, cache inventory, appendices). When this entry fires, regenerate
    # only the data-access.md of the sections whose files changed, plus the
    # global rollup if cross-section findings changed. The per-section files are
    # mechanical outputs — they carry no editorial freshness markers and are not
    # hand-edited.
    target: docs/architecture/service-data-access-map.md
    triggers:
      - "src/Humans.Web/Services/**/*.cs"
      # SystemDbContext and the admin diagnostics repository followed the rest of
      # src/Humans.Infrastructure into Humans.Web, which deleted it.
      - "src/Humans.Web/Repositories/**/*.cs"
      - "src/Humans.Web/Data/*DbContext.cs"
      - "src/Sections/**/Data/*DbContext.cs"
      # The section DbContexts were already triggers, but the services and
      # repositories that read through them were not — so a repository or ctor
      # change inside a section never marked this map dirty.
      - "src/Sections/*/Services/**/*.cs"
      - "src/Sections/*/Data/Repository.cs"
      - "src/Sections/*/Data/*Repository.cs"
    update: prompt
    prompt: |
      Document current state only — no move/migration history, no "new this
      sweep", no PR archaeology, no generated-by header boilerplate
      (memory/process/current-state-docs-no-history.md). A PR/date reference
      is allowed only for a live pending item.

      Regenerate the per-section data-access maps and the cross-section rollup.

      Outputs: src/Sections/Humans.<X>/Docs/data-access.md for each section whose
      source files changed in the diff window, and
      docs/architecture/service-data-access-map.md (Dashboard orchestrator +
      cross-section analysis + cache inventory + appendices) when cross-section
      findings changed. Do NOT regenerate untouched sections' files.

      Route every service to the map that OWNS it, by its own source path: a
      service under src/Sections/<Project>/Services/ belongs in that project's
      Docs/data-access.md, and only src/Humans.Web/Services orchestrators belong
      in the rollup. A service that bridges two sections (e.g.
      TicketingBudgetService, which reads Tickets and writes through Budget) is
      documented once, in the section that owns the class; the consuming
      section's map may reference it in prose but must not carry its `###`
      heading. The verifier checks the owning map only, so a misfiled heading
      leaves the owner permanently stale.

      For every service in a touched section (and the cross-section orchestrators
      left in src/Humans.Web/Services/), identify:
      1. Which repository interfaces it depends on. Note that a section's
         repository is often a class literally named `Repository` implementing
         `I<Section>Repository`, not `<Section>Repository`; use the real class name.
      2. Which database tables those repositories ultimately access, and which
         DbContext maps each one. There is no single context: resolve
         the DbSet<> declarations across src/Humans.Web/Data/
         *DbContext.cs plus each section's own Data/*DbContext.cs, and
         report the owning context per table. Do not assume a table is on
         HumansDbContext because a previous revision of this doc said so —
         re-resolve it from the context sources.
      3. Which IMemoryCache keys the service reads/writes.

      Match each per-section file's existing header and table layout. In the
      global rollup, preserve the intro/methodology block and the
      "Per-Section Maps" pointer section.

      Note: at scale ~500 users with single-server deployment, this map is
      diagnostic — call out cross-section table reads (a service reading a
      table owned by another section's repository) as a design rule
      violation per docs/architecture/design-rules.md §"Services own their data".

  # data-model-index retired 2026-08-18 (Peter): docs/architecture/data-model.md
  # deleted — each section's Docs/ owns its data model; the DbContext→tables
  # rollup lives in service-data-access-map's methodology block. Do not re-add.

  - id: guid-reservations
    target: docs/guid-reservations.md
    triggers:
      # SystemTeamIds / SystemUserIds followed the rest of Humans.Domain/Constants
      # into Humans.Base. The old Humans.Domain and
      # Humans.Infrastructure globs matched nothing once those projects were deleted;
      # no seed GUID lives outside this folder and the section Data/ tree below.
      - "src/Humans.Base/Constants/**/*.cs"
      # Section-owned configurations carry their own HasData seed GUIDs. Whole
      # Data/ tree — some configurations sit directly under Data/ rather than
      # Data/Configurations/. Same false-clean as data-model-index above.
      - "src/Sections/*/Data/**/*.cs"
    update: prompt
    prompt: |
      Regenerate the "Current Reservations" table in docs/guid-reservations.md.

      Walk src/Humans.Base/Constants/ AND the whole src/Sections/*/Data/ tree —
      Sections carry their own EF configurations and therefore their own HasData
      seed GUIDs, so scanning only the Base constants folder can omit the very
      section-owned GUID that fired this entry (blocks 0001/Teams and 0026/Events
      already live in sections).
      Search Data/ recursively, not just Data/Configurations/: several sections
      keep configuration classes directly under Data/ (Consent, Email).
      Find every deterministic GUID literal (`new Guid("0000...")`, `Guid.Parse(...)`,
      or string literals in HasData/HasData<T>). Group GUIDs by their leading
      4-hex block (e.g., `0001`, `0002`).

      For each block, derive Purpose from the file path / class name and
      Source as a relative link to that file.

      Preserve the document's prose sections ("Rules", and the explanatory
      intro). Only regenerate the table.

  - id: code-analysis-suppressions
    target: docs/architecture/code-analysis.md
    triggers:
      - "Directory.Build.props"
      - "tests/Directory.Build.props"
      - "tests/BannedSymbols.txt"
    update: prompt
    prompt: |
      Process the freshness:auto block with id="suppressions" in
      docs/architecture/code-analysis.md per its inline prompt.

  - id: reforge-history
    target: docs/reforge-history.csv
    triggers:
      - "src/**/*.cs"
      - "src/**/*.cshtml"
    update: script
    script: docs/scripts/generate-reforge-history.sh

# Editorial doc trees — walked recursively for .md files. Each .md may include
# inline freshness markers (freshness:triggers, freshness:auto, freshness:flag-on-change).
editorial_trees:
  - AGENTS.md
  - docs/sections/
  - docs/features/
  - docs/guide/
  # Sections in their own project carry their invariants + feature docs in-project
  # rather than in docs/sections/.
  - src/Sections/
  - docs/architecture/coding-rules.md
  - docs/architecture/design-rules.md
  - docs/architecture/roslyn-analysis.md
  - docs/architecture/code-review-rules.md
  - docs/architecture/conventions.md
  - docs/seed-data.md
  # NOT memory/. Tried and reverted 2026-08-12: marking the atoms cost 865 lines
  # (16% of that corpus) of trigger blocks sitting above each rule body, on files
  # whose whole value is being terse. Stale symbol references in atoms get noticed
  # and fixed when an agent goes to apply the rule — not worth a daily proactive check.

# The sweep's own verifier lives at docs/scripts/freshness-checks/ and is NOT
# listed here — it holds .sh files, and both walks below are .md-only. It is in
# scope regardless: /freshness-sweep owns those scripts and repairs them in its
# own PR without asking (memory/process/freshness-sweep-owns-its-verifier.md,
# authorised 2026-08-18). Two sweeps running treated a broken verifier as
# out-of-scope and paused; a verifier that under-reports is the most expensive
# defect the sweep can carry, because a dead trigger makes a stale doc look
# clean rather than unchecked.

# Files to exclude from both mechanical and editorial walks.
ignore:
  - docs/sections/SECTION-TEMPLATE.md
  - docs/sections/G5-SECTION-TEMPLATE.md
  - docs/architecture/maintenance-log.md
  - docs/architecture/screenshot-maintenance.md
  - docs/admin-role-setup.md
  - docs/google-service-account-setup.md
  - docs/plans/**
  - docs/superpowers/**
  # Guide meta files — narrative cover material, not tied to a specific feature
  - docs/guide/README.md
  - docs/guide/GettingStarted.md
  - docs/guide/Glossary.md
  # In-project docs: sweep the living invariants/feature docs, not the dated
  # design records (historical, same genre as docs/superpowers/specs/).
  - src/Sections/*/Docs/20*.md
  - src/Sections/*/Contracts/README.md
  # Section-doctor machine-owned files: scorecards + plan + per-run files. The doctor run
  # maintains them itself (docs/superpowers/specs/2026-08-17-section-doctor-design.md).
  - src/Sections/*/Docs/health.md
  - docs/health/**
  # Per-section data-access maps: mechanical outputs of the service-data-access-map
  # entry (split from the global file 2026-08-18). No editorial markers; never hand-edited.
  - src/Sections/*/Docs/data-access.md
  # Per-section authorization maps: the exact same case one entry over — mechanical
  # outputs of the authorization-inventory entry, split per-section on the same day.
  # Without this line all ~40 of them land in the report's "Unmarked editorial" flag
  # list every single sweep, asking for freshness:triggers markers they must never
  # carry: they are regenerated wholesale from source, not reviewed as prose.
  - src/Sections/*/Docs/authorization.md
