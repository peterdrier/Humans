inbox:
  - added: 2026-10-05
    id: CENTRAL-76
    what: "Consent's SendReConsentReminderJob selects recipients through Governance's GetUsersRequiringStatusUpdateAsync, which returns active-assignment users only after required consent grace periods have expired. The same audience feeds Users' suspension job 30 minutes later (04:00 reminder, 04:30 suspension), while the reminder email promises the configured ConsentReminderDaysBeforeSuspension (30) days remain. That setting affects wording only, not eligibility. Found during the daily debt sweep. Plan: add an optional `expiringWithin` horizon to the existing `IMembershipCalculatorRead.GetUsersRequiringStatusUpdateAsync`; reminder audience = pending-required consents expiring within `ConsentReminderDaysBeforeSuspension`, suspension audience and cooldown semantics unchanged; pre-approved per debt-sweep-standing-policy, list in PR."
    review: panel
  - added: 2026-10-04
    id: CENTRAL-72
    what: "MailerLiteImportService.ApplyAsync (ReplaceUnverifiedEmail) and AttendeeContactImportService.ApplyDecisionAsync (DeleteUnverifiedThenCreate) delete the sole unverified UserEmail before account provisioning. If provisioning fails, the address stays removed while the batch reports an error. Reordering alone reuses the unverified owner; compensation can overwrite concurrent user changes. Deferred in the daily sweep. Plan: one Users-owned replace-and-provision operation called by both importers; if provisioning fails, nothing is deleted; pre-approved per debt-sweep-standing-policy, list in PR."
    review: panel
