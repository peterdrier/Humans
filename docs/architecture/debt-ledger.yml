  - added: 2026-09-10
    id: CENTRAL-35
    what: "GoogleIntegration's Drive sync knows about Teams directly: google_resources rows are keyed by TeamId and expected Drive access is derived from team membership inside the connector. The Workgroups design (src/Sections/Humans.Workgroups/Docs/2026-09-10-workgroups-section-design.md §9) introduces IGoogleDriveAccessSource, the Drive analogue of IGoogleGroupMembershipSource, with Workgroups as its first source. Migrate Teams' Drive path onto the same fan-out so the connector stops referencing team membership at all (Teams becomes a source that claims its google_resources folder ids); then the connector owns only clients, diffing, mutation and the sync log. Peter's call 2026-09-10: 'should google-drive have a fanout then, instead of knowing about teams directly?' — yes, as follow-up after Workgroups lands. Plan: move Teams onto `IGoogleDriveAccessSource` in GoogleWorkspaceSyncService (the Drive fan-out already exists); dedicated PR, no decision needed."
    review: panel
  - added: 2026-09-20
    id: CENTRAL-59
    what: "src/Sections/Humans.Users.Contracts/IUserInfoInvalidator.cs:24 deliberately omits the IInvalidator marker (its own comment says so, debt nobodies-collective/Humans#805), so HUM0028 cannot see it and it needs no [Grandfathered] marker — one invalidator dodging the ratchet by being invisible to it. Marking it (or recording the exemption where the analyzer reads it) is small and separable from the big invalidator rework the HUM0028 theme is parked on. Found by the 2026-09-20 accepted-smell audit. A tag-only fix is circular (reverted in peterdrier/Humans#1932); making HUM0028 see unmarked invalidators widens the analyzer. Plan: Peter 2026-10-10 — waits for the invalidator rework the HUM0028 theme is parked on; do not work it separately."
    review: light
  - added: 2026-10-04
    id: CENTRAL-75
    what: "Containers Service validators throw localized InvalidOperationException messages for names, images and placement geometry. CityPlanningApiController.SaveContainerPlacement identifies validation failure by comparing ex.Message to a localized ContainersResource value. This violates no-localized-exception-messages and couples failure classification to translated wording. A structured owner validation result should preserve existing localized form/API feedback while leaving exception messages developer-facing. Found during the daily production sweep. Plan: the validators return an owner-defined validation result and the controller localizes it, per no-localized-exception-messages; pre-approved per debt-sweep-standing-policy, list in PR."
    review: panel

  - added: 2026-10-05
    id: CENTRAL-77
    what: "DoNotPersist account-deletion mail bypasses the outbox but still reaches SmtpEmailTransport/StubEmailTransport Recipient and Subject logs, and ProcessAccountDeletionsJob logs transport exceptions. Base recipient redaction masks only part of the address and does not scrub subjects or exceptions, so the no-stored-recipient erasure guarantee is not met. Found during the daily debt sweep. Plan: pass a redact flag from OutboxEmailService:79 through the internal `IEmailTransport` so Smtp/Stub transports log the template name only, and have ProcessAccountDeletionsJob log the exception type without its message; preserve normal delivery diagnostics and deletion confirmation. `IEmailTransport` is `internal`, so no public surface."
    review: panel
