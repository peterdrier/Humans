    what: "Gate dedupe race has no integration test. The atomic per-barcode admit dedupe relies on a Postgres unique index on GateScanEvent.AdmitDedupeKey (first concurrent admit wins, RecordScanAsync returns DuplicateAdmitRejected on the loser). The EF in-memory test provider can't enforce unique indexes, so GateServiceTests only exercises the sequential pre-check, not the concurrent index collision. Add a Postgres-backed integration test (Testcontainers/Docker) that fires two concurrent admits for one barcode and asserts exactly one Admitted + one RejectedDuplicate. Deferred from the gate-scanner PR (PR 895) — needs a containerized DB not available in that environment."
