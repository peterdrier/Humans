inbox:
  # Seeded from the open items in docs/architecture/tech-debt-2026-04-23.md.
  - added: 2026-08-26
    what: "AuditLogEntry.EntityType is a plain string filtered by exact equality (IAuditLogRepository.GetEntityIdsForEntityTypeActionsAsync, AuditViewerService's entityType filter), and nearly every caller supplies it as nameof(<EntityType>) — User, ShiftSignup, GoogleResource, Team, CampSeason, Camp and more, with User by far the most widely audited. Renaming any audited entity therefore changes the discriminator for new rows while historical rows keep the old string, and the entity's audit history silently splits with nothing failing. Decide whether persisted entity-type names should be pinned to constants (and an analyzer added) or the rename risk accepted; the fix is repo-wide across the Audit crosscut's callers, not one section's. Found by /section-doctor on CityPlanning 2026-08-26, from a review finding on peterdrier/Humans#1525 that proposed pinning CityPlanning alone — declined there because a single-section constant would make it the only caller not following the house convention without reducing the exposure."
    review: panel
  - added: 2026-08-25
    what: "docs/architecture/service-entity-boundary-ratchet.md is retired: its baseline targeted the pre-split Humans.Domain/Humans.Application layout and was never re-run against the current src/Sections layout. Re-run the service/entity boundary audit (I<Section>Service read APIs returning owned EF/domain entities) against src/Sections/*/Contracts and src/Sections/*.Contracts, and decide whether a ratchet is still wanted."
    review: panel
  - added: 2026-08-21
    what: "Nothing builds the real service provider and resolves the sections' registered services, so a DI misregistration ships green. Found in nobodies-collective/Humans#1104: a commit registered Service only as ISettingsWriteService while two consumers still asked for the concrete Service — the build passed and all ~4,900 unit tests passed, but /Settings/Admin and /Settings/Admin/Carry would both have thrown on activation and IEventSettingsCarryService could not have been constructed. Nothing in the suite would have caught it at any point. A composition-root smoke check that builds the container from the same ISection registration path the app uses and resolves every registered service would close it. Needs Peter's approval before anything is added (memory/process rule: no new CI checks without permission)."
    review: panel
  - added: 2026-08-18
    what: "DevelopmentDashboardSeeder fails on a fresh Development database while seeding dashboard scenarios: it calls Signup.Refuse() after the signup has already reached Confirmed state, raising 'Cannot refuse signup in Confirmed state' and aborting the remaining seed data. Reproduced while locally testing the Surveys audience workflow; needs a focused correction to the scenario's state-transition ordering. Same seeder, second item: it creates its burn with BuildStartOffset -14 while the sub-period columns default to FirstCrew -25, so the seeded row violates the event form's own rule (BuildStart <= FirstCrew) and cannot be saved from /Settings/Admin without first moving an offset. -25 is the coherent value. Left alone in nobodies-collective/Humans#1104 because changing it correlated with intermittent failures in StoreControllerTests.Volunteer_cannot_create_order_against_someone_elses_camp_season (2 of 3 runs red with the change, green without) — fix it together with the Refuse() ordering bug above, since both point at this seeder's fixture being fragile."
    review: panel
  - added: 2026-08-16
    what: "21 classes carry [CrossSectionWrite(\"reason\")] (grep src/ --include=*.cs) — each is a cross-section write through another section's full I*Service, which HUM0032 accepts only because the marker is there. The preferred shape is the other way round: the section that owns the data ships a view component and writes its own rows, so the consumer never holds the write interface. Introduced with the marker in nobodies-collective/Humans#1064; every one is a pre-existing call newly made visible, not new coupling. Work them down per owning section, not as one sweep — several (GoogleIntegration's four sync services, Development's two dev seeders) are provisioning paths where a view component is the wrong answer and the marker is the final state."
    review: panel
  - added: 2026-08-16
    what: "Humans.Users.Contracts (src/Sections/Humans.Users.Contracts/Humans.Users.Contracts.csproj) is the one `.Contracts` leaf where memory/architecture/service-read-no-ef.md's structural guarantee does not hold: it declares the public EF Identity entity `User : IdentityUser<Guid>` and references Microsoft.AspNetCore.Identity.EntityFrameworkCore (see the csproj's own reasoning block — ASP.NET Identity's generic surface, UserManager<User>/SignInManager<User>, can't be hidden). `IUserServiceRead` lives in the same project, so a future member returning `User` or another EF type would compile there, and HUM0029's retirement (peterdrier/Humans#1320) removed the only thing that ever would have caught it. Flagged by claude[bot] (Codex) on peterdrier/Humans#1320. Half the intended fix landed in nobodies-collective/Humans#1064 — the layer predicates are gone and the analyzers now run inside `.Contracts` assemblies with everything else under `src/`. What remains is writing the rule: measured at 21 diagnostics against this leaf, 5 of them Errors on `IdentityUser`'s own inherited members, so it needs an Identity carve-out."
    review: panel
  - added: 2026-08-13
    what: "StorePayActionTests.Pay_with_amount_over_balance_redirects_back_to_order_without_calling_Stripe fails under full parallel-suite runs but passes in isolation — races something shared; surfaced twice during PR peterdrier/Humans#1272's full-suite runs. Second instance in the same family: StoreControllerTests.Volunteer_cannot_create_order_against_someone_elses_camp_season, same signature (parallel-suite only, green in isolation and on rerun), seen on nobodies-collective/Humans#1104. It depends on the barrio-1-lead persona having seeded its camp + season, so the shared thing being raced is likely the dev-persona/camp seeding, not Store itself."
    review: light
  - added: 2026-08-11
    what: "TeamConfiguration's six system-team HasData rows declare RequiresApproval = false, but false is the CLR default so EF omits the column from the INSERT and the DB default (true) applies — model believes false, database holds true, on both chain-built and baseline-built schema. Long-standing (Initial did the same); surfaced by the EF migration review of the Teams peel (peel 14, nobodies-collective/Humans#858)"
    review: light
