    notes: >-
      Drained 2026-10-21: the last 18 rows (TicketRepository order/attendee
      grid sort helpers) were sort-before-SQL-Skip/Take on the paged admin
      grids, so each is now marked `// arch:db-sort-ok`; the baseline is empty.
