    what: "Rota search rows pay a heavy read on a cold cache key. IShiftManagementServiceRead.GetRotaAsync (src/Sections/Humans.Shifts/Services/ShiftManagementService.cs) serves the global-search row through CachingShiftViewService's per-rota cache; on a miss that cache's inner ShiftViewService.GetRotaAsync (src/Sections/Humans.Shifts/Services/ShiftViewService.cs:119) loads RotaReadShape.View — event settings, shifts, signups and tags — to hand back two fields, Name and TeamId. Warm cost is zero (measured: GlobalSearchSectionRenderTests.Tripling_the_rows_costs_no_extra_query, 2 commands per /Search page regardless of row count), so this is a first-search-after-startup and post-invalidation cost only, bounded by the number of matched rotas. The two obvious fixes are both wrong: GetRotasAsync loops one id at a time so it batches nothing, and carrying Name/TeamId on RotaSearchHit re-introduces the display-field projection nobodies-collective/Humans#1062 deleted. The right fix is a header-shaped rota projection Shifts caches separately from the view — new state in that section, so its own pass. Found by Codex on peterdrier/Humans#1432."
