  - added: 2026-06-29
    what: "TicketTailor inbound check-in detection is broken against the live API (Tickets section; pre-existing, issue #736). TicketTailorService.GetIssuedTicketsAsync maps check-in time from a nested `check_in` object (TtIssuedTicket.check_in -> TtCheckIn.checked_in_at) at line ~147/399-406, but the live TT API (verified read-only 2026-06-29 against /v1/issued_tickets/{id} and /v1/orders/{id}) returns NO nested `check_in` object — only a top-level string field `checked_in: \"true\"|\"false\"`. So ticket.CheckIn is always null and VendorTicketDto.CheckedInAt is always null; no ticket is ever detected as vendor-checked-in. Consequence for Gate: the secondary CheckedInAtVendor dedupe signal never fires from vendor data (the gate's own gate_scan_events local unique index remains the dedupe authority, so admission correctness is unaffected — only the cross-device/vendor signal is dead). Fix in Tickets (not the Gate PR): map the top-level `checked_in` boolean-string, and if a check-in timestamp is needed, fetch it from the dedicated GET /v1/check_ins collection (whose field is `check_in_at`, epoch seconds — note: different name from the dead nested `checked_in_at`). Found while verifying the Gate vendor-mirror payload for PR 895."
