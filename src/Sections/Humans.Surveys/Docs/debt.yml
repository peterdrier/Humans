# Section debt ledger for Humans.Surveys. Shape + routing: memory/process/debt-ledger-additions.md.
# /debt-sweep pools every src/Sections/*/Docs/debt.yml into the same inbox as the central ledger.
version: 1
inbox:
  - added: 2026-08-28
    what: "SurveyService is the solution's largest class by reforge's largeClass rule and grew again with ranked-choice voting. Deliberate per the section's target shape (one aggregate, one anonymity contract, now one embargo), but recorded so the score is not mistaken for unexamined debt (/section-doctor on Surveys 2026-08-27, re-examined 2026-09-07; the measurements live in those run files)."
    review: light
  - added: 2026-09-20
    what: "GDPR Article 15 gap: SurveyService.ContributeForUserAsync emits only SurveyResponses (Identified) and AuthoredSurveys, so survey_invitations never reaches a subject access export. Those rows are personal data keyed to a named person — UserId, which surveys they were invited to, SentAt, LatestEmailStatus, ReminderSentAt, Started, Completed — and a member who was only invited, or who answered CompletionTracked, has nothing of theirs exported at all. Article 17 is unaffected: AnonymizeResponsesForUserAsync deletes the invitation rows (SurveyRepository.cs:458-461). The fix is an invitation-ledger UserDataSlice plus its GdprExportSections key and an erasure declaration entry; the anonymity contract constrains what it may carry, since a precise per-invitation timestamp beside an anonymous response could correlate. Found by Codex on peterdrier/Humans#1747, verified by /section-doctor 2026-09-20; the run narrowed health.md's export claim rather than shipping the slice, because adding an export path is a behaviour change."
    review: panel
  - added: 2026-09-07
    what: "Surveys.md invariants with no test that pins them: individual submissions are never audit-logged; Close is audit-logged; eligibility is re-checked on every wizard page; a SentAt = null ledger row is excluded from invited counts, status and reminders; Article 17 erasure unlinks a response (the service call is pinned, the UserId blanking in SurveyRepository.AnonymizeResponsesForUserAsync is not); ballots in the drill-down are ordered by response id. Found by /section-doctor's Tests thread on 2026-09-07; its sibling gaps were closed in that run. Narrowed 2026-09-20: 'exactly one reminder per invitee' is now pinned at service level (SurveyServiceTests.cs:1343), leaving only the repository-side ReminderSentAt filter and stamp untested."
    review: light
