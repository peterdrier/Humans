    what: "Services/Service.cs GetOrderPageDataAsync selects the active event's catalog for editable historical orders, while Store.md defines Order.Year as the catalog year. AddLineAsync accepts any active product without checking its year; its legacy Year=0 repair runs after the line write. Historical Open orders can therefore acquire products from a different event year. Found during the daily debt sweep. Plan (follows Store.md's Order.Year rule): GetOrderPageDataAsync offers the catalog of Order.Year; AddLineAsync runs the existing audited Year=0 repair before validating, then refuses a product whose year differs from the order's (and refuses outright if the repair cannot resolve the year), writing nothing on refusal; section-internal, no public surface."
