    what: "DataAnnotations validation on the Create form is unlocalized in all six cultures. AddDataAnnotationsLocalization binds DataAnnotationLocalizerProvider to SharedResource, which carries neither the message templates ('The {0} field is required.') nor any display name for these fields, so both fall back to the attribute's English. ApplicationDecisionService already returns localized ErrorKeys for the same rules (MotivationRequired et al.) but ModelState.IsValid short-circuits before SubmitAsync runs, so the localized path is unreachable for the empty case. Fixing it means either SharedResource keys for the templates in six cultures or ErrorMessage keys per attribute — new shared surface, so Peter's call. Removing the [Display] attributes (finding 7) did not cause this but made the interpolated name a CLR identifier (finding 27, /section-doctor on Governance 2026-09-02)."
