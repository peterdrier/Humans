    what: "Views/GrantsAdmin/Form.cshtml and Views/GrantsAdmin/Program.cshtml each carry a near-identical inline script that moves a human-search pick into a list of hidden inputs; one script, parameterised by field name, would serve both. Found by the 2026-11-07 section-doctor run."
    review: light
