    id: GRANTS-1
    what: "GrantsAdminController.Index restates the program-manager visibility rule (user.AllUserIds.Any(p.IsManager)) beside a GrantsPolicies.Read check instead of asking ProgramAuthorizationHandler with ProgramOperationRequirement.View, as UserGrantsViewComponent already does; the rule lives in two places. Switching leaves GrantsPolicies.Read without a caller, so the fix also decides whether the Read/Manage policy pair stays (Preapprovals has the same shape, PREAPPROVALS-1). Found by the 2026-11-07 section-doctor run."
    review: panel
