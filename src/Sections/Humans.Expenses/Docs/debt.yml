# Section debt ledger for Humans.Expenses. Shape + routing: memory/process/debt-ledger-additions.md.
# /debt-sweep pools every src/Sections/*/Docs/debt.yml into the same inbox as the central ledger.
version: 1
inbox:
  - added: 2026-08-26
    what: "Every mutation on the section exists twice: an internal XxxAsync that throws ExpenseValidationException and a public XxxWithResultAsync that catches it and returns a result object. Services/ExpenseReportService.cs carries both halves for each transition, so a caller can reach the throwing form and a reader has to check which one a call site took. One shape per transition would delete the wrapper layer, but the choice of which shape survives changes IExpenseReportService's surface. Found by /section-doctor on Expenses 2026-08-26."
    review: panel
  - added: 2026-08-26
    what: "Controllers/ExpensesController.cs repeats the same load-and-authorize preamble in nearly every action that takes a report id: RequireCurrentUserAsync, GetAsync(id), NotFound, AllowsAsync(op), Forbid. A private helper returning (IActionResult? Failure, ExpenseReportDto? Report, UserInfo? User) collapses the preamble at each site, at the cost of a null-forgiving operator at every one — which is the reason this run did not strike it. Found by /section-doctor on Expenses 2026-08-26."
    review: panel
  - added: 2026-08-26
    what: "Services/ExpenseReportService.cs is the section's maxClassLoc and its only large class. It holds the report state machine, the Holded outbox drain and its backoff, the Holded purchase-document conversation (ProcessHoldedCreateAsync, the section's longest method), and the GDPR export contributor. The Holded conversation is a cohesive concern with its own failure model and would split out without touching the state machine. Found by /section-doctor on Expenses 2026-08-26."
    review: panel
  - added: 2026-08-26
    what: "ExpenseReportOperation.Withdraw is granted by ExpenseReportAuthorizationHandler (submitter, on Submitted/CoordinatorEndorsed/Approved) and no code asks for it: ExpensesController.Withdraw hand-rolls report.SubmitterUserId != user.Id instead. Wiring the operation is not a no-op — a submitter withdrawing a Draft would get a 403 where they now get a red toast from the repository's own refusal — so it is a behaviour change, not a cleanup. Found by /section-doctor on Expenses 2026-08-26."
    review: panel
