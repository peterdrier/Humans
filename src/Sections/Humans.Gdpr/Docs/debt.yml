inbox:
  - added: 2026-08-27
    id: GDPR-1
    what: "GuestDataController has no test, anywhere. Deliberately not written this run: apart from its catch-and-redirect on contributor failure — whose disposition sits with Users, since ProfileController has no catch for the same failure — the action is logic-free, and a test now would pin behaviour that decision may change. Write it once the two routes agree on failure handling. Found by /section-doctor on Gdpr 2026-08-27."
    review: light
  - added: 2026-09-17
    id: GDPR-2
    what: "docs/features/global/gdpr-export.md asserts its own completeness and nothing enforces it. The roster table, its Contributor column and its freshness trigger block are all hand-maintained, and one PR turned up four separate drifts in them: six missing Workgroup rows, a missing AuthoredSurveys row, a registered erasure-only contributor (MailerLiteGdprContributor) absent from a list calling itself the roster, and a trigger watching a forwarding decorator instead of the service that builds the slices. Each was fixed by hand and the next one will appear the same way. The shape fix is a test that reflects over IUserDataContributor implementers and asserts the doc matches: every registered contributor has a row or a documented erasure-only exemption, and every key a contributor declares has a row. That test crosses every user-scoped section, so it belongs beside the existing coverage tests in tests/Humans.Web.Tests/Services/Gdpr/, not in Gdpr's own project — needs Peter's call on placement. Found by /section-doctor on Gdpr 2026-09-17."
    review: panel
  - added: 2026-09-17
    id: GDPR-3
    what: "The 'logged' half of complete-or-fail is unpinned in both fan-outs. GdprService logs an error naming the failing contributor before re-throwing, in export and in erasure alike, and the invariant doc states it — but CreateService injects NullLogger, so every failure test observes only the re-throw. A contributor failure that stopped naming itself in the log would pass the suite, and that log line is the only way an operator learns which section broke a download or an erasure. Needs a capturing logger in the fixture. Found by /section-doctor on Gdpr 2026-09-17."
    review: light
