# /debt-sweep pools every src/Sections/*/Docs/debt.yml into the same inbox as the central ledger.
version: 1
inbox:
  - added: 2026-09-14
    what: "GuideSegmenter tracks fenced-code state by line scanning, so a fence-looking line inside a raw HTML block (an HTML comment among them) puts it into fence state where Markdig, which parses no fences inside raw HTML, does not. The state never clears, and a real '## As a Coordinator/Board' heading below it opens no segment — its content stays in the enclosing segment and reaches anyone who can see that one. Latent, not live: no file in docs/guide/ currently has a fence-shaped line inside a comment, which is why GuideShippedContentFilterTests.Anonymous_ReceivesNoCoordinatorOrBoardHeading_AcrossTheWholeCorpus is green; every guide file does carry two HTML comments at the top, so one such line opens it. The general fix is to derive segments from Markdig's block AST instead of scanning lines, which costs a second parse per file and the byte-exact rejoining property invariant 13 states; the narrow fix is to track raw-HTML block state alongside fence state. Third defect of this class in the same scanner (the other two — a fenced '##' ending a role block, and an invalid backtick opener being treated as a fence — are fixed and pinned). Raised by Codex on peterdrier/Humans#1655 after that PR's review-round budget was spent; kept deliberately (Peter, 2026-09-14) and recorded in Docs/health.md §6."
    review: panel
