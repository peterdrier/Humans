  - added: 2026-09-14
    id: TEAMS-5
    what: "TeamService.DeleteTeamAsync deactivates a team by closing every live membership through TeamRepository.DeactivateTeamAsync, which stamps LeftAt and saves with no audit entry — only an ILogger line. An admin action ending members' memberships is invisible to the Board, against AGENTS.md's audit rule. Found by Codex reviewing peterdrier/Humans#1594. Plan: DeactivateTeamAsync returns the closed memberships' user ids and the service writes one existing AuditAction.TeamMemberRemoved entry per member (actor = the admin); no new AuditAction, no public surface."
    review: panel
  - added: 2026-10-04
    id: TEAMS-7
    what: "Controllers/TeamController.cs MyTeams always supplies PendingRequests = [], hiding the existing member request table and Withdraw forms. The join/withdraw workflow remains live. Repository GetAllJoinRequestsForUserAsync already owns the data but no service method returns the member's list. Found during the daily debt sweep. Plan: add GetPendingRequestsForUserAsync(Guid userId, CancellationToken ct) to the internal ITeamManagementService over that repository read and fill PendingRequests from it; internal interface, not public surface per debt-sweep-standing-policy D2, list in PR."
    review: light
  - added: 2026-10-04
    id: TEAMS-8
    what: "TeamController.EditTeam catches every DbUpdateException and classifies it by whether InnerException.Message contains CustomSlug; all other database failures become a duplicate Google Group prefix form error. Structured constraint/rule translation belongs at the data/service boundary, not provider-schema knowledge in the controller. Found during the daily debt sweep. Plan: the repository maps the unique-constraint violation to a typed outcome and the service's UpdateTeamAsync returns a result record (Success / SlugTaken / GroupPrefixTaken) the controller localizes; other database failures propagate. Throw-to-result, pre-approved per debt-sweep-standing-policy, list in PR."
    review: panel
  - added: 2026-10-06
    id: TEAMS-9
    what: "TeamService.PermanentlyDeleteTeamAsync deletes a team, and with it its TeamEarlyEntryGrant rows, without calling IEarlyEntryInvalidator, so each grantee's cached early-entry answer outlives the delete (/section-doctor on EarlyEntry 2026-09-05, re-verified 2026-10-06)."
    review: light
    root: CENTRAL-54
  - added: 2026-10-06
    id: TEAMS-10
    what: "Deactivating a team (UpdateTeamAsync with isActive false, or DeleteTeamAsync) leaves its early-entry grants live: TeamRepository.GetEarlyEntryGrantsForEnabledTeamsAsync filters on EarlyEntryEnabled only, and neither path evicts IEarlyEntryInvalidator. Whether a deactivated team still grants early entry is a Teams decision; either filter on IsActive and evict on the flip, or record that deactivation keeps grants (/section-doctor on EarlyEntry 2026-10-06)."
    review: panel
    status: needs-detail
    blocked_on: "A Teams policy call on whether a deactivated team keeps granting early entry."
