    what: "IssuesService holds four near-identical field-mutation pipelines plus their four …WithResultAsync twins — eight method signatures for one operation shape — and is the largest file in the section and still growing. Collapsing them changes the machine door's surface, so it is Peter's call. Found by /section-doctor on Issues 2026-08-25, re-measured 2026-09-14."
    review: panel
