  - added: 2026-08-25
    what: "IssuesService writes screenshots with a raw FileStream to a path it builds itself from ContentRootPath + wwwroot, and DeleteScreenshotDirectory rebuilds the same path by hand, rather than going through Humans.Base/Interfaces/IFileStorage.cs. Humans.Feedback has since moved to IFileStorage, so Issues is now the only section doing this and the fix is Issues-local. Found by /section-doctor on Issues 2026-08-25, re-scoped 2026-09-14. Peter 2026-09-14: deferred, and paired with the unauthorized-serving row below — both or neither, because half a fix is a waste. Do not take this row alone."
    review: panel
  - added: 2026-09-14
    what: "An issue screenshot is readable by anyone holding its URL, with no authorization check. FileSystemFileStorage roots at wwwroot and every consumer hands the stored path out as a static URL, so moving Issues onto IFileStorage does not fix this half — it wants an authorization-checked serving endpoint. Repo-wide in cause, listed here because Issues is one of the sections exposing it. Found by /section-doctor on Issues 2026-09-14. Peter 2026-09-14: deferred, and paired with the IFileStorage row above — both or neither, because half a fix is a waste. Do not take this row alone."
    review: panel
