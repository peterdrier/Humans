    what: "IssuesServiceTests's …WithResultAsync success twins re-assert stored state their direct-call counterparts already own, and four tests assert only which arguments the service handed a substitute repository while the file's own real-repository equivalents cover the same behaviour. Trimming deletes tests, so it is Peter's call. Found by /section-doctor on Issues 2026-08-25, narrowed 2026-09-14 — the four unasserted behaviours it also named are now covered."
