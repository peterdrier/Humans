version: 1
inbox:
  - added: 2026-09-03
    what: "BackdoorApiKeyRepository has no test file, so the invariants that live only in it are unpinned: FindActiveByHashAsync must not return a revoked key, and RevokeAsync must be a no-op on a key already revoked. The service tests stub the repository, so both pass today by assumption (finding 23, /section-doctor on Backdoor 2026-09-03)."
    review: light
  - added: 2026-09-03
    what: "BackdoorApiKeyService.RotateAsync is not atomic: it awaits RevokeAsync (which commits) and only then persists the replacement, so a failure in between leaves the owner with no working key and no way to tell a rotate from a revoke. At this scale the window is tiny and the recovery is 'issue a new key', which is why it is recorded rather than fixed — but the docs claim a rotate is one operation (finding 24, /section-doctor on Backdoor 2026-09-03)."
    review: panel
  - added: 2026-09-03
    what: "BackdoorApiKeyAuthFilter asks Auth about the key owner's roles twice per request: IBackdoorApiKeyService.ResolveOwnerAsync already calls IsUserAdminAsync/IsUserBoardMemberAsync for the eligibility half, and the filter then calls GetActiveForUserAsync for the claims half. One lookup could serve both — but folding it in widens IBackdoorApiKeyService's return past a Guid?, which is new public surface and needs Peter. Separately, the read reaches Auth through IRoleAssignmentService, a full write-capable service (AssignRoleAsync, EndRoleAsync, RevokeAllActiveAsync), because Auth.Contracts publishes no narrow read contract; that is what the PR surface report scores as crossSectionFullService +8. The narrow fix is an IRoleAssignmentServiceRead in Auth, which is Auth's public surface and also needs Peter (finding 42, /section-doctor on Backdoor 2026-09-03)."
    review: panel
