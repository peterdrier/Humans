<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <!-- ===== Bold solid base (gold) ===== -->
  <g fill="#c9a96e">
    <!-- head -->
    <ellipse cx="120" cy="58" rx="9.5" ry="12"/>
    <!-- torso + legs together -->
    <path d="M112,72 L128,72 L147,85 L139,100 L131,122 L135,146 L134,200 L131,233 L146,240 L127,240 L121,150 L120,148 L119,150 L113,240 L94,240 L106,233 L105,200 L109,146 L101,122 L93,100 L93,85 Z"/>
    <!-- horizontal arms -->
    <path d="M147,82 L217,81 L217,87 L150,93 Z"/>
    <path d="M93,82 L23,81 L23,87 L90,93 Z"/>
    <!-- raised arms -->
    <path d="M150,86 L185,24 L192,27 L156,93 Z"/>
    <path d="M90,86 L55,24 L48,27 L84,93 Z"/>
    <!-- spread legs -->
    <path d="M126,150 L186,214 L192,223 L123,157 Z"/>
    <path d="M114,150 L54,214 L48,223 L117,157 Z"/>
    <!-- hands (horizontal) -->
    <circle cx="217" cy="84" r="4"/>
    <circle cx="23" cy="84" r="4"/>
    <!-- hands (raised) -->
    <circle cx="188" cy="24" r="4"/>
    <circle cx="52" cy="24" r="4"/>
    <!-- feet (spread) -->
    <ellipse cx="189" cy="218" rx="6" ry="4"/>
    <ellipse cx="51" cy="218" rx="6" ry="4"/>
  </g>

  <!-- ===== Frame (gold rings) ===== -->
  <g fill="none" stroke="#c9a96e" stroke-width="3.2">
    <circle cx="120" cy="120" r="120"/>
    <rect x="23" y="46" width="194" height="194"/>
  </g>

  <!-- ===== Faint gold construction ===== -->
  <g fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.5">
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
  </g>

  <!-- ===== Tier 1 etch: main contours + pose separations (2.0) ===== -->
  <g fill="none" stroke="#3d2b1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- centerline of body -->
    <line x1="120" y1="72" x2="120" y2="146"/>
    <!-- torso outline echo -->
    <path d="M101,100 Q108,120 109,146"/>
    <path d="M139,100 Q131,120 131,146"/>
    <!-- together-leg separation -->
    <path d="M120,150 L120,235"/>
    <!-- horizontal arm separation from raised arm (right) -->
    <path d="M150,90 L214,85"/>
    <path d="M90,90 L26,85"/>
    <!-- raised arm separation -->
    <path d="M153,89 L186,28"/>
    <path d="M87,89 L54,28"/>
    <!-- spread leg separation -->
    <path d="M122,153 L186,217"/>
    <path d="M118,153 L54,217"/>
  </g>

  <!-- ===== Tier 2 etch: muscle groups + hair (1.4) ===== -->
  <g fill="none" stroke="#3d2b1f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- collarbones -->
    <path d="M104,86 Q120,82 136,86"/>
    <!-- pectorals -->
    <path d="M106,92 Q114,100 120,98"/>
    <path d="M134,92 Q126,100 120,98"/>
    <!-- ribs / abdomen -->
    <path d="M110,108 H130"/>
    <path d="M112,118 H128"/>
    <!-- navel -->
    <circle cx="120" cy="120" r="1.4"/>
    <!-- knees (together legs) -->
    <path d="M106,196 Q110,199 112,196"/>
    <path d="M134,196 Q130,199 128,196"/>
    <!-- thigh contours -->
    <path d="M109,150 Q106,180 106,200"/>
    <path d="M131,150 Q134,180 134,200"/>
    <!-- hair -->
    <path d="M110,52 Q120,44 130,52"/>
    <path d="M111,56 Q120,50 129,56"/>
  </g>

  <!-- ===== Tier 3 etch: face, fingers, toes, hatching (0.9) ===== -->
  <g fill="none" stroke="#3d2b1f" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- face -->
    <circle cx="116" cy="58" r="1"/>
    <circle cx="124" cy="58" r="1"/>
    <path d="M120,59 L120,63"/>
    <path d="M117,66 H123"/>
    <!-- horizontal-hand fingers -->
    <path d="M220,81 l2,0 M220,84 l3,0 M220,87 l2,0"/>
    <path d="M20,81 l-2,0 M20,84 l-3,0 M20,87 l-2,0"/>
    <!-- raised-hand fingers -->
    <path d="M190,21 l1,-2 M188,20 l0,-3 M186,21 l-1,-2"/>
    <path d="M50,21 l-1,-2 M52,20 l0,-3 M54,21 l1,-2"/>
    <!-- together-feet toes -->
    <path d="M128,239 l0,2 M132,239 l0,2 M136,239 l0,2 M140,239 l0,2"/>
    <path d="M112,239 l0,2 M108,239 l0,2 M104,239 l0,2 M100,239 l0,2"/>
    <!-- spread-feet toes -->
    <path d="M193,216 l2,-1 M193,219 l2,0 M193,221 l2,1"/>
    <path d="M47,216 l-2,-1 M47,219 l-2,0 M47,221 l-2,1"/>
    <!-- abdomen hatch -->
    <path d="M114,128 H126 M115,134 H125 M116,140 H124"/>
  </g>
</svg>
