<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">

  <!-- Faint construction lines (vanish at small sizes) -->
  <g opacity="0.1" stroke="#c9a96e" fill="none" stroke-width="0.4">
    <line x1="120" y1="-2" x2="120" y2="242"/>
    <line x1="-2" y1="120" x2="242" y2="120"/>
    <path d="M 20,120 A 100,100 0 0,1 220,120" stroke-dasharray="4,8"/>
    <line x1="21" y1="46" x2="25" y2="46"/>
    <line x1="215" y1="46" x2="219" y2="46"/>
    <line x1="21" y1="240" x2="25" y2="240"/>
    <line x1="215" y1="240" x2="219" y2="240"/>
    <line x1="23" y1="44" x2="23" y2="48"/>
    <line x1="217" y1="44" x2="217" y2="48"/>
    <line x1="23" y1="238" x2="23" y2="242"/>
    <line x1="217" y1="238" x2="217" y2="242"/>
