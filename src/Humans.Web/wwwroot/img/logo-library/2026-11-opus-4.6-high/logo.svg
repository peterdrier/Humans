    <path d="M 127,138 L 144,164 L 153,182 L 163,198 L 173,216 L 176,226 L 174,230 L 170,228 L 167,220 L 155,204 L 143,188 L 130,172 L 113,148 Z"/>
    <path d="M 113,138 L 96,164 L 87,182 L 77,198 L 67,216 L 64,226 L 66,230 L 70,228 L 73,220 L 85,204 L 97,188 L 110,172 L 127,148 Z"/>

    <!-- Raised arms (behind torso) -->
    <path d="M 146,73 L 160,67 L 175,61 L 190,54 L 203,49 L 214,46 L 218,46 L 220,50 L 207,55 L 194,60 L 179,67 L 164,74 L 152,85 Z"/>
    <path d="M 94,73 L 80,67 L 65,61 L 50,54 L 37,49 L 26,46 L 22,46 L 20,50 L 33,55 L 46,60 L 61,67 L 76,74 L 88,85 Z"/>

    <!-- Torso (smooth shoulders, narrow waist) -->
