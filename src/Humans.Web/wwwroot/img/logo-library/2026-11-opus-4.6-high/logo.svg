      <line x1="112" y1="110" x2="128" y2="110"/>
      <line x1="113" y1="116" x2="127" y2="116"/>
      <line x1="113" y1="123" x2="127" y2="123"/>
      <line x1="114" y1="129" x2="126" y2="129"/>
    </g>

    <!-- Cross-hatching for torso shading -->
