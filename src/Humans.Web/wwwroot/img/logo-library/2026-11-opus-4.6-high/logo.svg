    <!-- Together legs (in front) -->
    <path d="M 121,147 Q 119,165 122,180 L 123,192 Q 125,208 125,224 L 125,232 L 123,236 L 121,240 L 136,240 L 134,236 L 132,232 Q 132,208 133,192 L 134,180 Q 139,165 138,147 Z"/>
    <path d="M 119,147 Q 121,165 118,180 L 117,192 Q 115,208 115,224 L 115,232 L 117,236 L 119,240 L 104,240 L 106,236 L 108,232 Q 108,208 107,192 L 106,180 Q 101,165 102,147 Z"/>

    <!-- Horizontal arms (wider fingertips) -->
    <path d="M 148,72 C 160,72 172,72 183,73 L 196,74 L 205,75 L 212,76 L 217,76.5 L 217,79.5 L 212,80 L 205,82 L 196,83 L 183,84 C 172,85 160,85 148,85 Z"/>
    <path d="M 92,72 C 80,72 68,72 57,73 L 44,74 L 35,75 L 28,76 L 23,76.5 L 23,79.5 L 28,80 L 35,82 L 44,83 L 57,84 C 68,85 80,85 92,85 Z"/>

    <!-- Head -->
    <ellipse cx="120" cy="58" rx="10.5" ry="12.5"/>
    <!-- Neck (tapered) -->
    <path d="M 115,66 L 112,72 L 128,72 L 125,66 Z"/>
  </g>

  <!-- === TIER 1: Main contours and pose separations (≈2.0) === -->
  <g fill="none" stroke="#3d2b1f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head contour -->
    <ellipse cx="120" cy="58" rx="10.5" ry="12.5"/>

    <!-- Left neck + shoulder + torso (single smooth curve) -->
    <path d="M 112,68 C 108,72 100,78 92,82 C 88,84 90,89 94,94 C 98,100 102,108 106,116 C 108,122 106,128 105,132 C 105,136 107,140 110,143 L 115,147"/>

