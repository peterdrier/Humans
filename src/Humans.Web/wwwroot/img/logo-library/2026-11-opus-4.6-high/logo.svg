      <line x1="155" y1="74" x2="158" y2="81"/>
      <line x1="161" y1="74" x2="164" y2="81"/>
      <line x1="167" y1="74" x2="170" y2="81"/>
      <line x1="173" y1="74" x2="176" y2="80"/>
      <line x1="85" y1="74" x2="82" y2="81"/>
      <line x1="79" y1="74" x2="76" y2="81"/>
      <line x1="73" y1="74" x2="70" y2="81"/>
      <line x1="67" y1="74" x2="64" y2="80"/>
    </g>

    <!-- Thigh hatching -->
    <g stroke-width="0.4" opacity="0.2">
      <line x1="128" y1="155" x2="132" y2="163"/>
      <line x1="129" y1="163" x2="133" y2="171"/>
      <line x1="130" y1="171" x2="133" y2="179"/>
      <line x1="112" y1="155" x2="108" y2="163"/>
      <line x1="111" y1="163" x2="107" y2="171"/>
      <line x1="110" y1="171" x2="107" y2="179"/>
    </g>

    <!-- Shin hatching -->
    <g stroke-width="0.4" opacity="0.2">
      <line x1="126" y1="200" x2="129" y2="208"/>
      <line x1="126" y1="210" x2="129" y2="218"/>
      <line x1="114" y1="200" x2="111" y2="208"/>
