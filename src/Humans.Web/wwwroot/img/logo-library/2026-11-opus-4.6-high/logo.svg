      <line x1="96" y1="92" x2="100" y2="99"/>
      <line x1="97" y1="96" x2="101" y2="103"/>
      <line x1="98" y1="100" x2="102" y2="107"/>
      <line x1="100" y1="104" x2="104" y2="111"/>
      <line x1="101" y1="108" x2="105" y2="115"/>
      <line x1="144" y1="92" x2="140" y2="99"/>
      <line x1="143" y1="96" x2="139" y2="103"/>
      <line x1="142" y1="100" x2="138" y2="107"/>
      <line x1="140" y1="104" x2="136" y2="111"/>
      <line x1="139" y1="108" x2="135" y2="115"/>
