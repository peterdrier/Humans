    <!-- Groin arch -->
    <path d="M 115,147 Q 118,151 120,151 Q 122,151 125,147"/>

    <!-- Collarbone ridge -->
    <path d="M 110,76 Q 115,74 120,74 Q 125,74 130,76"/>

    <!-- Right horizontal arm -->
    <path d="M 148,72 C 165,72 180,73 196,74 L 212,76 L 217,76.5"/>
    <path d="M 148,85 C 165,85 180,84 196,83 L 212,80 L 217,79.5"/>

    <!-- Left horizontal arm -->
    <path d="M 92,72 C 75,72 60,73 44,74 L 28,76 L 23,76.5"/>
    <path d="M 92,85 C 75,85 60,84 44,83 L 28,80 L 23,79.5"/>

    <!-- Right raised arm -->
    <path d="M 146,73 L 175,61 L 203,49 L 214,46"/>
    <path d="M 152,85 L 179,67 L 207,55 L 220,50"/>

    <!-- Left raised arm -->
    <path d="M 94,73 L 65,61 L 37,49 L 26,46"/>
    <path d="M 88,85 L 61,67 L 33,55 L 20,50"/>

    <!-- Right together leg -->
    <path d="M 121,147 Q 119,165 122,180 L 123,192 Q 125,208 125,224 L 125,232 L 123,236"/>
    <path d="M 138,147 Q 139,165 136,180 L 133,192 Q 132,208 132,224 L 132,232 L 134,236"/>
    <path d="M 123,236 L 121,240 L 136,240 L 134,236"/>

    <!-- Left together leg -->
    <path d="M 119,147 Q 121,165 118,180 L 117,192 Q 115,208 115,224 L 115,232 L 117,236"/>
    <path d="M 102,147 Q 101,165 104,180 L 107,192 Q 108,208 108,224 L 108,232 L 106,236"/>
    <path d="M 117,236 L 119,240 L 104,240 L 106,236"/>

    <!-- Right spread leg -->
    <path d="M 127,138 L 144,164 L 153,182 L 163,198 L 173,216 L 176,226"/>
    <path d="M 113,148 L 130,172 L 143,188 L 155,204 L 167,220 L 170,228"/>
    <path d="M 176,226 L 174,230 L 170,228"/>

    <!-- Left spread leg -->
    <path d="M 113,138 L 96,164 L 87,182 L 77,198 L 67,216 L 64,226"/>
    <path d="M 127,148 L 110,172 L 97,188 L 85,204 L 73,220 L 70,228"/>
    <path d="M 64,226 L 66,230 L 70,228"/>
  </g>

  <!-- === TIER 2: Muscles, hair, joints (≈1.4) === -->
  <g fill="none" stroke="#3d2b1f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
