    <ellipse cx="124.5" cy="55" rx="1.6" ry="0.9" fill="#3d2b1f" stroke="none"/>
    <path d="M 120,54 L 120,61" stroke-width="0.7"/>
    <path d="M 118,62 L 120,63 L 122,62"/>
    <line x1="116" y1="66" x2="124" y2="66" stroke-width="0.8"/>
    <path d="M 112,52 Q 115,51 118,52.5" stroke-width="0.7"/>
    <path d="M 128,52 Q 125,51 122,52.5" stroke-width="0.7"/>
    <path d="M 110,64 Q 115,70 120,70 Q 125,70 130,64" stroke-width="0.6"/>

    <!-- Ears -->
