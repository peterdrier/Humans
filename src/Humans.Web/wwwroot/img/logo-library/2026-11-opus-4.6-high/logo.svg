  <!-- Geometric frame -->
  <circle cx="120" cy="120" r="120" fill="none" stroke="#c9a96e" stroke-width="1.2"/>
  <rect x="23" y="46" width="194" height="194" fill="none" stroke="#c9a96e" stroke-width="1.2"/>

