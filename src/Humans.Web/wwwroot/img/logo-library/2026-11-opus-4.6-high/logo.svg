    <path d="M 99,86 Q 109,90 120,90 Q 131,90 141,86"/>
    <path d="M 101,92 Q 111,95 120,95 Q 129,95 139,92"/>

    <!-- Abdominal midline -->
    <path d="M 120,95 L 120,143" stroke-width="1.0"/>

    <!-- Abdominal side lines -->
    <path d="M 112,96 C 111,106 110,116 111,126 L 112,138"/>
    <path d="M 128,96 C 129,106 130,116 129,126 L 128,138"/>

    <!-- Navel -->
    <circle cx="120" cy="120" r="2.5"/>

    <!-- Iliac crest -->
    <path d="M 110,126 Q 107,130 105,134"/>
    <path d="M 130,126 Q 133,130 135,134"/>

    <!-- Hair mass -->
    <path d="M 111,52 Q 109,47 114,46 Q 118,45 120,45 Q 122,45 126,46 Q 131,47 129,52"/>

    <!-- Elbow creases - horizontal arms -->
    <path d="M 181,73 Q 183,78 181,84" stroke-width="1.0"/>
    <path d="M 59,73 Q 57,78 59,84" stroke-width="1.0"/>

    <!-- Deltoid definition -->
    <path d="M 148,82 Q 155,80 162,76" stroke-width="1.0"/>
    <path d="M 92,82 Q 85,80 78,76" stroke-width="1.0"/>

    <!-- Bicep/tricep separation -->
    <path d="M 160,73 L 180,73" stroke-width="0.8"/>
    <path d="M 80,73 L 60,73" stroke-width="0.8"/>

    <!-- Forearm muscle line -->
    <path d="M 185,74 Q 195,76 203,75" stroke-width="0.7"/>
    <path d="M 55,74 Q 45,76 37,75" stroke-width="0.7"/>

    <!-- Knee caps - together legs -->
    <path d="M 123,189 Q 127,194 130,194 Q 133,194 134,189" stroke-width="1.1"/>
    <path d="M 117,189 Q 113,194 110,194 Q 107,194 106,189" stroke-width="1.1"/>

    <!-- Knee crease - spread legs -->
    <path d="M 152,180 Q 150,184 152,188" stroke-width="1.0"/>
    <path d="M 88,180 Q 90,184 88,188" stroke-width="1.0"/>

    <!-- Wrist lines - horizontal arms -->
    <line x1="204" y1="74" x2="204" y2="82" stroke-width="0.9"/>
    <line x1="36" y1="74" x2="36" y2="82" stroke-width="0.9"/>

    <!-- Calf muscles - together legs -->
    <path d="M 124,196 Q 127,206 125,218" stroke-width="0.9"/>
    <path d="M 133,196 Q 130,206 132,218" stroke-width="0.9"/>
    <path d="M 116,196 Q 113,206 115,218" stroke-width="0.9"/>
    <path d="M 107,196 Q 110,206 108,218" stroke-width="0.9"/>

    <!-- Quadriceps outer definition -->
    <path d="M 136,152 Q 135,168 134,182" stroke-width="0.7"/>
    <path d="M 104,152 Q 105,168 106,182" stroke-width="0.7"/>
  </g>

  <!-- === TIER 3: Fine details, face, fingers, hatching (≈0.9) === -->
  <g fill="none" stroke="#3d2b1f" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
