      <path d="M 30,79 L 23,79.2"/>
      <path d="M 30,80.5 L 25,80.5"/>
      <path d="M 32,81 Q 30,83 28,81"/>
    </g>

    <!-- Finger lines - right raised hand -->
    <g stroke-width="0.6">
      <path d="M 212,45.5 L 216,46"/>
      <path d="M 213,47 L 218,47.5"/>
      <path d="M 215,49 L 219,49.5"/>
      <path d="M 216,50.5 L 219,51"/>
    </g>

    <!-- Finger lines - left raised hand -->
    <g stroke-width="0.6">
      <path d="M 28,45.5 L 24,46"/>
      <path d="M 27,47 L 22,47.5"/>
      <path d="M 25,49 L 21,49.5"/>
      <path d="M 24,50.5 L 21,51"/>
    </g>

    <!-- Toe lines - right foot -->
    <g stroke-width="0.5">
      <line x1="124" y1="239" x2="124" y2="240"/>
      <line x1="127" y1="239" x2="127" y2="240"/>
      <line x1="130" y1="239" x2="130" y2="240"/>
      <line x1="133" y1="239" x2="133" y2="240"/>
    </g>

    <!-- Toe lines - left foot -->
    <g stroke-width="0.5">
      <line x1="116" y1="239" x2="116" y2="240"/>
      <line x1="113" y1="239" x2="113" y2="240"/>
      <line x1="110" y1="239" x2="110" y2="240"/>
      <line x1="107" y1="239" x2="107" y2="240"/>
    </g>

    <!-- Ribcage lines -->
