             L125,240 L124,234 L125,226 Q126,215 126,204
             L126,192 Q126,180 125,168 L123,155 L122,146 Z"/>
    <!-- Right foot -->
    <path d="M133,234 L137,236 L140,239 L136,242 L125,240 L124,234 Z"/>

    <!-- === SPREAD LEGS — muscular, reaching circle === -->
    <!-- Left spread leg -->
    <path d="M115,143 L108,148 Q97,168 86,192 L80,208
             Q76,218 72,228 L68,234 L64,236
             L60,232 L62,228 L67,232 L72,224
             Q78,212 86,196 L96,176 Q107,156 118,146 Z"/>
    <!-- Left spread foot -->
    <path d="M68,234 L63,235 L58,234 L57,231 L62,229 L67,232 Z"/>

    <!-- Right spread leg -->
    <path d="M125,143 L132,148 Q143,168 154,192 L160,208
             Q164,218 168,228 L172,234 L176,236
             L180,232 L178,228 L173,232 L168,224
             Q162,212 154,196 L144,176 Q133,156 122,146 Z"/>
    <!-- Right spread foot -->
    <path d="M172,234 L177,235 L182,234 L183,231 L178,229 L173,232 Z"/>
  </g>

  <!-- === TIER 1 ETCH (stroke 2.0, from ~64px) === -->
  <g fill="none" stroke="#3d2b1f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <ellipse cx="120" cy="57" rx="11.5" ry="13.5"/>
    <!-- Neck -->
    <line x1="113" y1="69" x2="111" y2="78"/>
    <line x1="127" y1="69" x2="129" y2="78"/>
    <!-- Shoulder ridge -->
    <path d="M95,82 Q107,76 120,76 Q133,76 145,82"/>
    <!-- Torso contour -->
    <path d="M94,90 L93,100 Q94,110 96,118 L99,126 Q101,133 104,138 L108,143"/>
    <path d="M146,90 L147,100 Q146,110 144,118 L141,126 Q139,133 136,138 L132,143"/>
    <!-- Pelvis -->
    <path d="M108,143 Q114,148 120,149 Q126,148 132,143"/>
    <!-- Pose separation: arms -->
    <line x1="95" y1="76" x2="75" y2="50"/>
    <line x1="145" y1="76" x2="165" y2="50"/>
    <!-- Pose separation: legs -->
    <line x1="113" y1="143" x2="86" y2="192"/>
    <line x1="127" y1="143" x2="154" y2="192"/>
  </g>

  <!-- === TIER 2 ETCH (stroke 1.4, from ~96px) === -->
  <g fill="none" stroke="#3d2b1f" stroke-width="1.4" stroke-linecap="round">
