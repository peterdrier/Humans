    <path d="M107,134 L114,143"/>
    <path d="M133,134 L126,143"/>
    <!-- Hair -->
    <path d="M109,47 Q113,42 120,41 Q127,42 131,47"/>
    <!-- Collarbone -->
    <path d="M98,80 Q109,78 120,79 Q131,78 142,80"/>
    <!-- Deltoids -->
    <path d="M95,82 Q91,86 92,92"/>
    <path d="M145,82 Q149,86 148,92"/>
    <!-- Elbows (horizontal) -->
    <circle cx="66" cy="81" r="2.5" stroke-width="1.0"/>
    <circle cx="174" cy="81" r="2.5" stroke-width="1.0"/>
    <!-- Elbows (raised) -->
    <circle cx="76" cy="53" r="2.5" stroke-width="1.0"/>
    <circle cx="164" cy="53" r="2.5" stroke-width="1.0"/>
    <!-- Kneecaps (straight legs) -->
    <path d="M105,190 Q110,186 115,190" stroke-width="1.2"/>
    <path d="M125,190 Q130,186 135,190" stroke-width="1.2"/>
    <!-- Kneecaps (spread legs) -->
    <path d="M82,200 Q87,196 92,200" stroke-width="1.0"/>
    <path d="M148,200 Q153,196 158,200" stroke-width="1.0"/>
    <!-- Wrist creases -->
    <line x1="30" y1="77" x2="30" y2="83"/>
    <line x1="210" y1="77" x2="210" y2="83"/>
    <!-- Ankles -->
    <line x1="105" y1="226" x2="108" y2="232"/>
    <line x1="135" y1="226" x2="132" y2="232"/>
  </g>

  <!-- === TIER 3 ETCH (stroke 0.9, from ~150px) === -->
