<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <defs>
    <clipPath id="bounds">
      <circle cx="120" cy="120" r="122"/>
    </clipPath>
  </defs>

  <!-- Construction lines (faint gold, vanish small) -->
  <g opacity="0.08" stroke="#c9a96e" fill="none" clip-path="url(#bounds)">
    <line x1="120" y1="-2" x2="120" y2="242" stroke-width="0.4"/>
    <line x1="-2" y1="120" x2="242" y2="120" stroke-width="0.4"/>
    <path d="M55,16 A106,106 0 0,1 78,6" stroke-width="0.3"/>
    <path d="M185,16 A106,106 0 0,0 162,6" stroke-width="0.3"/>
    <line x1="23" y1="44" x2="23" y2="48" stroke-width="0.3"/>
    <line x1="217" y1="44" x2="217" y2="48" stroke-width="0.3"/>
    <line x1="21" y1="46" x2="25" y2="46" stroke-width="0.3"/>
    <line x1="215" y1="46" x2="219" y2="46" stroke-width="0.3"/>
  </g>

  <!-- Frame -->
  <circle cx="120" cy="120" r="120" fill="none" stroke="#c9a96e" stroke-width="1.6"/>
  <rect x="23" y="46" width="194" height="194" fill="none" stroke="#c9a96e" stroke-width="1.6"/>

  <!-- === SOLID GOLD BASE === -->
  <g fill="#c9a96e" stroke="none">

    <!-- Head -->
    <ellipse cx="120" cy="57" rx="11.5" ry="13.5"/>

    <!-- Neck -->
    <path d="M113,69 Q113,73 111,78 L129,78 Q127,73 127,69 Z"/>

    <!-- Torso — broad chest tapering to waist, slight hip flare -->
    <path d="M98,78 Q95,82 94,90 L93,100 Q94,110 96,118
             L99,126 Q101,133 104,138 L108,143
             L132,143 L136,138 Q139,133 141,126
             L144,118 Q146,110 147,100 L146,90
             Q145,82 142,78 Z"/>

    <!-- === HORIZONTAL ARMS === -->
    <!-- Left upper arm — generous width -->
    <path d="M98,78 L95,76 Q82,77 68,79 L64,76 L62,80
             Q62,84 64,86 L68,85 Q82,84 95,83 L98,82 Z"/>
    <!-- Left forearm -->
    <path d="M68,79 L64,76 Q48,76 32,77 L28,76 L24,78
             Q23,80 24,83 L28,84 Q48,83 64,82 L68,85 Z"/>
    <!-- Left hand -->
    <path d="M28,76 L25,75 L20,75 L17,77 L17,80 L20,82 L25,82 L28,84
             Q29,80 28,76 Z"/>

    <!-- Right upper arm -->
    <path d="M142,78 L145,76 Q158,77 172,79 L176,76 L178,80
             Q178,84 176,86 L172,85 Q158,84 145,83 L142,82 Z"/>
    <!-- Right forearm -->
    <path d="M172,79 L176,76 Q192,76 208,77 L212,76 L216,78
             Q217,80 216,83 L212,84 Q192,83 176,82 L172,85 Z"/>
    <!-- Right hand -->
    <path d="M212,76 L215,75 L220,75 L223,77 L223,80 L220,82 L215,82 L212,84
             Q211,80 212,76 Z"/>

    <!-- === RAISED ARMS — connected to shoulder mass === -->
    <!-- Left raised upper arm -->
    <path d="M98,78 L95,74 Q86,64 78,54 L75,50 L72,52
             Q72,56 74,58 L82,66 Q90,74 98,80 Z"/>
    <!-- Left raised forearm -->
    <path d="M78,54 L75,50 Q66,38 56,28 L52,22 L48,18
             L44,20 L46,24 L50,26 Q60,36 72,52 L74,58 Z"/>
    <!-- Left raised hand -->
    <path d="M48,18 L44,14 L39,12 L36,15 L36,19 L39,22 L44,22 L48,22 Z"/>

    <!-- Right raised upper arm -->
    <path d="M142,78 L145,74 Q154,64 162,54 L165,50 L168,52
             Q168,56 166,58 L158,66 Q150,74 142,80 Z"/>
    <!-- Right raised forearm -->
    <path d="M162,54 L165,50 Q174,38 184,28 L188,22 L192,18
             L196,20 L194,24 L190,26 Q180,36 168,52 L166,58 Z"/>
    <!-- Right raised hand -->
    <path d="M192,18 L196,14 L201,12 L204,15 L204,19 L201,22 L196,22 L192,22 Z"/>

    <!-- === LEGS TOGETHER — fuller thighs, defined gap === -->
    <!-- Left leg -->
    <path d="M113,143 L108,146 Q105,155 103,168 L102,180
             Q102,192 103,204 L104,215 L105,226 L107,234
             L115,240 L116,234 L115,226 Q114,215 114,204
             L114,192 Q114,180 115,168 L117,155 L118,146 Z"/>
    <!-- Left foot -->
    <path d="M107,234 L103,236 L100,239 L104,242 L115,240 L116,234 Z"/>

    <!-- Right leg -->
    <path d="M127,143 L132,146 Q135,155 137,168 L138,180
