    <path d="M115,54 Q116.5,52.5 118,54"/>
    <path d="M122,54 Q123.5,52.5 125,54"/>
    <!-- Brow -->
    <path d="M113,52 L118,51"/>
    <path d="M122,51 L127,52"/>
    <!-- Nose -->
    <line x1="120" y1="53" x2="119.5" y2="59"/>
    <path d="M117.5,60 Q120,61.5 122.5,60"/>
    <!-- Mouth — flat neutral line -->
    <line x1="117" y1="64" x2="123" y2="64"/>
    <!-- Chin -->
    <path d="M116,67 Q120,69.5 124,67"/>
    <!-- Ear hints -->
    <path d="M108.5,55 Q107,57 108.5,60"/>
    <path d="M131.5,55 Q133,57 131.5,60"/>

    <!-- Fingers: horizontal left -->
    <line x1="18" y1="74" x2="14" y2="72"/>
    <line x1="16" y1="76" x2="11" y2="75"/>
    <line x1="15" y1="78" x2="10" y2="78"/>
    <line x1="15" y1="80" x2="11" y2="81"/>
    <line x1="17" y1="82" x2="14" y2="84"/>

    <!-- Fingers: horizontal right -->
    <line x1="222" y1="74" x2="226" y2="72"/>
    <line x1="224" y1="76" x2="229" y2="75"/>
    <line x1="225" y1="78" x2="230" y2="78"/>
    <line x1="225" y1="80" x2="229" y2="81"/>
    <line x1="223" y1="82" x2="226" y2="84"/>

    <!-- Fingers: raised left -->
    <line x1="39" y1="12" x2="36" y2="9"/>
    <line x1="37" y1="14" x2="32" y2="12"/>
    <line x1="36" y1="17" x2="31" y2="16"/>
    <line x1="37" y1="20" x2="34" y2="22"/>

    <!-- Fingers: raised right -->
    <line x1="201" y1="12" x2="204" y2="9"/>
    <line x1="203" y1="14" x2="208" y2="12"/>
    <line x1="204" y1="17" x2="209" y2="16"/>
    <line x1="203" y1="20" x2="206" y2="22"/>

    <!-- Toes: left foot -->
    <line x1="103" y1="240" x2="101" y2="242"/>
    <line x1="106" y1="241" x2="105" y2="243"/>
    <line x1="109" y1="241" x2="109" y2="243"/>
    <line x1="112" y1="240" x2="113" y2="242"/>

    <!-- Toes: right foot -->
    <line x1="137" y1="240" x2="139" y2="242"/>
    <line x1="134" y1="241" x2="135" y2="243"/>
    <line x1="131" y1="241" x2="131" y2="243"/>
    <line x1="128" y1="240" x2="127" y2="242"/>

    <!-- Pectoral hatching -->
    <line x1="104" y1="87" x2="109" y2="93"/>
    <line x1="112" y1="87" x2="116" y2="93"/>
    <line x1="124" y1="93" x2="128" y2="87"/>
    <line x1="131" y1="93" x2="136" y2="87"/>

    <!-- Oblique hatching -->
    <line x1="98" y1="106" x2="103" y2="118"/>
    <line x1="137" y1="118" x2="142" y2="106"/>
    <line x1="97" y1="118" x2="102" y2="130"/>
    <line x1="138" y1="130" x2="143" y2="118"/>

    <!-- Rib hints -->
    <path d="M101,94 Q105,96 109,94"/>
    <path d="M131,94 Q135,96 139,94"/>
    <path d="M100,100 Q104,102 108,100"/>
    <path d="M132,100 Q136,102 140,100"/>

    <!-- Thigh contours -->
    <path d="M107,152 Q104,165 103,178"/>
    <path d="M133,152 Q136,165 137,178"/>
    <!-- Calf contours -->
    <path d="M103,196 Q102,208 104,218"/>
    <path d="M137,196 Q138,208 136,218"/>

    <!-- Forearm tendons -->
    <line x1="46" y1="79" x2="38" y2="79"/>
    <line x1="194" y1="79" x2="202" y2="79"/>
    <!-- Bicep lines -->
    <path d="M88,78 Q82,79 76,80"/>
    <path d="M152,78 Q158,79 164,80"/>
    <!-- Raised arm muscle separation -->
    <line x1="88" y1="66" x2="82" y2="58"/>
    <line x1="152" y1="66" x2="158" y2="58"/>

    <!-- Spread leg thigh contours -->
    <path d="M100,170 Q92,185 86,198"/>
    <path d="M140,170 Q148,185 154,198"/>
    <!-- Spread leg calf -->
    <path d="M78,210 Q74,220 70,228"/>
    <path d="M162,210 Q166,220 170,228"/>
