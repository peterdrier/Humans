    <path d="M102,89 Q111,94 120,95 Q129,94 138,89"/>
    <!-- Sternum -->
    <line x1="120" y1="83" x2="120" y2="96"/>
    <!-- Linea alba -->
    <line x1="120" y1="100" x2="120" y2="140"/>
    <!-- Abdominal segments -->
    <path d="M110,106 Q120,109 130,106"/>
    <path d="M109,116 Q120,119 131,116"/>
    <path d="M108,126 Q120,129 132,126"/>
    <!-- Navel -->
    <circle cx="120" cy="120" r="1.8"/>
