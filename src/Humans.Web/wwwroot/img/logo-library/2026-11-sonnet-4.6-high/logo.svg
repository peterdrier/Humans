<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">

<!-- GOLD BASE: solid fills for body parts (all gold #c9a96e) -->
<g fill="#c9a96e" stroke="none">

  <!-- Spread legs (drawn below together legs) — tips land on circle (~22,191) -->
  <path d="M 96 143 Q 56 163 22 191 L 36 199 Q 76 175 112 150 Z"/>
  <path d="M 144 143 Q 184 163 218 191 L 204 199 Q 164 175 128 150 Z"/>

  <!-- Together legs — slight calf bulge outward -->
  <path d="M 100 143 Q 104 166 105 192 Q 103 213 106 240 L 120 240 L 120 143 Z"/>
  <path d="M 140 143 Q 136 166 135 192 Q 137 213 134 240 L 120 240 L 120 143 Z"/>

  <!-- Together feet — wider -->
  <path d="M 106 237 Q 106 243 116 243 L 119 239 L 114 236 Z"/>
  <path d="M 134 237 Q 134 243 124 243 L 121 239 L 126 236 Z"/>

  <!-- Spread feet — at circle edge, clearly foot-shaped -->
  <path d="M 22 191 Q 14 198 8 196 L 6 190 L 22 191 Z"/>
  <path d="M 218 191 Q 226 198 232 196 L 234 190 L 218 191 Z"/>

  <!-- Horizontal arms -->
  <path d="M 96 83 L 24 87 L 23 91 L 96 88 Z"/>
  <path d="M 144 83 L 216 87 L 217 91 L 144 88 Z"/>

  <!-- Horizontal hands (paddle, not fork) -->
  <path d="M 24 87 L 19 85 Q 16 87 16 89 Q 16 91 19 91 L 23 91 Z"/>
  <path d="M 216 87 L 221 85 Q 224 87 224 89 Q 224 91 221 91 L 217 91 Z"/>

  <!-- Raised arms (angled up to circle) -->
  <path d="M 96 80 Q 55 70 14 63 L 14 68 Q 55 75 96 86 Z"/>
  <path d="M 144 80 Q 185 70 226 63 L 226 68 Q 185 75 144 86 Z"/>

  <!-- Raised hands -->
  <path d="M 14 63 L 10 61 Q 7 63 7 66 Q 7 68 10 68 L 14 68 Z"/>
  <path d="M 226 63 L 230 61 Q 233 63 233 66 Q 233 68 230 68 L 226 68 Z"/>

  <!-- Torso (neck base → shoulders → waist → hips) -->
  <path d="M 114 69 Q 102 73 96 83 Q 103 97 104 108 Q 102 126 100 143 L 140 143 Q 138 126 136 108 Q 137 97 144 83 Q 138 73 126 69 Z"/>

  <!-- Neck -->
  <rect x="113" y="68" width="14" height="14" rx="2"/>

  <!-- Head -->
  <ellipse cx="120" cy="57" rx="10" ry="12"/>

</g>

<!-- FRAME: circle and square, gold stroked -->
<circle cx="120" cy="120" r="120" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
<rect x="23" y="46" width="194" height="194" fill="none" stroke="#c9a96e" stroke-width="1.5"/>

<!-- INK TIER 1 (~2px): main contours and pose separations -->
<g fill="none" stroke="#3d2b1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head contour -->
  <ellipse cx="120" cy="57" rx="10" ry="12"/>
  <!-- Neck sides -->
  <line x1="113" y1="69" x2="113" y2="81"/>
  <line x1="127" y1="69" x2="127" y2="81"/>
  <!-- Collarbone to shoulder -->
  <path d="M 113 72 Q 102 75 96 83"/>
  <path d="M 127 72 Q 138 75 144 83"/>
  <!-- Torso sides -->
  <path d="M 96 83 Q 103 97 104 108 Q 102 126 100 143"/>
  <path d="M 144 83 Q 137 97 136 108 Q 138 126 140 143"/>
  <!-- Hip base -->
  <line x1="100" y1="143" x2="140" y2="143"/>
  <!-- Center divide between together legs -->
  <line x1="120" y1="143" x2="120" y2="240"/>
  <!-- Together leg outer edges -->
  <path d="M 100 143 Q 104 166 106 192 L 108 240"/>
  <path d="M 140 143 Q 136 166 134 192 L 132 240"/>
  <!-- Spread leg outer edges — to circle -->
  <path d="M 96 143 Q 56 163 22 191"/>
  <path d="M 144 143 Q 184 163 218 191"/>
  <!-- Spread leg inner edges -->
  <path d="M 112 150 Q 76 175 36 199"/>
  <path d="M 128 150 Q 164 175 204 199"/>
  <!-- Horizontal arm top and bottom edges -->
  <path d="M 96 83 L 24 87"/>
  <path d="M 96 88 L 23 91"/>
  <path d="M 144 83 L 216 87"/>
  <path d="M 144 88 L 217 91"/>
  <!-- Raised arm top and bottom edges -->
  <path d="M 96 80 Q 55 70 14 63"/>
  <path d="M 96 86 Q 55 75 14 68"/>
  <path d="M 144 80 Q 185 70 226 63"/>
  <path d="M 144 86 Q 185 75 226 68"/>
</g>

<!-- INK TIER 2 (~1.4px): muscle groups and hair -->
<g fill="none" stroke="#3d2b1f" stroke-width="1.4" stroke-linecap="round">
  <!-- Sternum -->
  <line x1="120" y1="81" x2="120" y2="143"/>
  <!-- Pectoral boundary -->
  <path d="M 96 83 Q 110 93 120 91 Q 130 93 144 83"/>
  <!-- Rib arch -->
  <path d="M 104 108 Q 112 113 120 111 Q 128 113 136 108"/>
  <!-- Knee caps — well-separated on each leg -->
  <ellipse cx="111" cy="192" rx="6" ry="4.5"/>
  <ellipse cx="129" cy="192" rx="6" ry="4.5"/>
  <!-- Deltoid curve -->
  <path d="M 96 83 Q 93 87 95 92"/>
  <path d="M 144 83 Q 147 87 145 92"/>
  <!-- Neck muscles -->
  <line x1="115" y1="69" x2="113" y2="81"/>
  <line x1="125" y1="69" x2="127" y2="81"/>
  <!-- Hair -->
  <path d="M 112 47 Q 116 45 120 45 Q 124 45 128 47"/>
  <path d="M 111 50 Q 115 48 120 47 Q 125 48 129 50"/>
  <!-- Calf muscles (together legs) -->
  <path d="M 105 196 Q 103 215 106 230"/>
  <path d="M 135 196 Q 137 215 134 230"/>
  <!-- Foot base lines (together) -->
  <line x1="106" y1="240" x2="120" y2="240"/>
  <line x1="120" y1="240" x2="134" y2="240"/>
  <!-- Ankle narrowing -->
  <path d="M 106 228 L 107 237"/>
  <path d="M 134 228 L 133 237"/>
</g>

<!-- INK TIER 3 (~0.9px): face, fingers, fine details -->
<g fill="none" stroke="#3d2b1f" stroke-width="0.9" stroke-linecap="round">
  <!-- Eyes -->
  <ellipse cx="115.5" cy="55" rx="2" ry="1.3"/>
  <ellipse cx="124.5" cy="55" rx="2" ry="1.3"/>
  <!-- Nose -->
  <path d="M 119 58 L 118.5 62 Q 120 63.5 121.5 62 L 121 58"/>
  <!-- Mouth -->
  <path d="M 116.5 64.5 Q 120 67 123.5 64.5"/>
  <!-- Chin crease -->
  <line x1="118" y1="68" x2="122" y2="68"/>
  <!-- Navel -->
  <circle cx="120" cy="120" r="2.5"/>
  <path d="M 118 118.5 Q 120 117.5 122 118.5"/>
  <!-- Horizontal left hand fingers -->
  <path d="M 19 85 L 16 84 M 19 87 L 15 86.5 M 19 89 L 15 89 M 19 91 L 16 92"/>
  <!-- Horizontal right hand fingers -->
  <path d="M 221 85 L 224 84 M 221 87 L 225 86.5 M 221 89 L 225 89 M 221 91 L 224 92"/>
  <!-- Raised left hand fingers -->
  <path d="M 10 61 L 7 60 M 10 63.5 L 6 63 M 10 65.5 L 6 65.5 M 10 68 L 7 69"/>
  <!-- Raised right hand fingers -->
  <path d="M 230 61 L 233 60 M 230 63.5 L 234 63 M 230 65.5 L 234 65.5 M 230 68 L 233 69"/>
  <!-- Together left toes -->
  <line x1="109" y1="240" x2="109" y2="242"/>
  <line x1="112" y1="241" x2="112" y2="243"/>
  <line x1="115" y1="241" x2="115" y2="243"/>
  <line x1="118" y1="240" x2="117" y2="242"/>
  <!-- Together right toes -->
  <line x1="131" y1="240" x2="131" y2="242"/>
  <line x1="128" y1="241" x2="128" y2="243"/>
  <line x1="125" y1="241" x2="125" y2="243"/>
  <line x1="122" y1="240" x2="123" y2="242"/>
  <!-- Abdominal sections -->
  <path d="M 112 95 L 111 100 M 116 94 L 115 100 M 124 94 L 125 100 M 128 95 L 129 100"/>
  <!-- Lower abdominal arcs -->
  <path d="M 111 110 Q 115.5 115 120 113 Q 124.5 115 129 110"/>
  <path d="M 112 125 Q 116 129 120 127 Q 124 129 128 125"/>
  <!-- Iliac crest / lower torso definition -->
  <path d="M 103 136 Q 112 139 120 137 Q 128 139 137 136"/>
</g>

<!-- FAINT GOLD CONSTRUCTION LINES -->
<g fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.4">
  <!-- Main axes -->
  <line x1="0" y1="120" x2="240" y2="120"/>
  <line x1="120" y1="0" x2="120" y2="240"/>
  <!-- Proportion tick marks on square -->
  <line x1="23" y1="70" x2="31" y2="70"/>  <line x1="210" y1="70" x2="217" y2="70"/>
  <line x1="23" y1="94" x2="31" y2="94"/>  <line x1="210" y1="94" x2="217" y2="94"/>
  <line x1="23" y1="143" x2="31" y2="143"/> <line x1="210" y1="143" x2="217" y2="143"/>
  <line x1="23" y1="192" x2="31" y2="192"/> <line x1="210" y1="192" x2="217" y2="192"/>
</g>

</svg>
