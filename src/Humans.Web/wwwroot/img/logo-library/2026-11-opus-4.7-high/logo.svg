<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <defs>
    <style>
      .gold{fill:#c9a96e}
      .goldline{fill:none;stroke:#c9a96e}
      .faint{fill:none;stroke:#c9a96e;stroke-opacity:.30}
      .ink1{fill:none;stroke:#3d2b1f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .ink2{fill:none;stroke:#3d2b1f;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
      .ink3{fill:none;stroke:#3d2b1f;stroke-width:.9;stroke-linecap:round;stroke-linejoin:round}
      .inkfill{fill:#3d2b1f}
    </style>
  </defs>

  <!-- ================================================================= -->
  <!-- FAINT CONSTRUCTION (tier 0): axes + cardinal ticks; fade out small -->
  <!-- ================================================================= -->
  <g class="faint" stroke-width=".6">
    <line x1="120" y1="0"   x2="120" y2="240"/>
    <line x1="0"   y1="120" x2="240" y2="120"/>
    <line x1="0"   y1="46"  x2="240" y2="46"/>
    <line x1="0"   y1="143" x2="240" y2="143"/>
    <line x1="0"   y1="70"  x2="240" y2="70"/>
  </g>

  <!-- Frame: square + circle -->
  <rect   class="goldline" x="23" y="46" width="194" height="194" stroke-width="2.2"/>
  <circle class="goldline" cx="120" cy="120" r="120"               stroke-width="2.2"/>

  <!-- ================================================================= -->
  <!-- SOLID GOLD BASE  — generous forms that survive to 16px             -->
  <!-- ================================================================= -->

  <!-- Horizontal arms (square pose): shoulders out to the square edges   -->
  <path class="gold" d="M 96,76
                        C 70,78 46,78 23,76
                        L 23,82
                        C 46,84 70,84 96,84 Z"/>
  <path class="gold" d="M 144,76
                        C 170,78 194,78 217,76
                        L 217,82
                        C 194,84 170,84 144,84 Z"/>

  <!-- Raised arms (circle pose): steeper angle so pose reads clearly -->
  <!-- Left raised arm: shoulder (96,74) -> hand on circle at ~(46,25) -->
  <path class="gold" d="M 98,71
                        C 82,56 64,41 46,25
                        L 40,33
                        C 60,48 78,64 93,80 Z"/>
  <!-- Right raised arm -->
  <path class="gold" d="M 142,71
                        C 158,56 176,41 194,25
                        L 200,33
                        C 180,48 162,64 147,80 Z"/>

  <!-- Legs together (square pose): two DISTINCT columns with a visible gap -->
  <!-- Left together-leg: thigh 108-117, calf swell to 108-118, ankle 112-118 -->
  <path class="gold" d="M 108,143
                        C 107,160 106,175 107,188
                        C 108,205 110,220 112,236
                        L 119,236
                        L 119,143 Z"/>
  <!-- Right together-leg -->
  <path class="gold" d="M 121,143
                        L 121,236
                        L 128,236
                        C 130,220 132,205 133,188
                        C 134,175 133,160 132,143 Z"/>

  <!-- Legs spread (circle pose): angled outward, foot on circle -->
  <!-- Left spread -->
  <path class="gold" d="M 108,143
                        C 103,170 97,205 90,236
                        L 100,238
                        C 106,208 112,175 118,145 Z"/>
  <!-- Right spread -->
  <path class="gold" d="M 132,143
                        C 137,170 143,205 150,236
                        L 140,238
                        C 134,208 128,175 122,145 Z"/>

  <!-- Torso (shoulders → chest → waist → hips) -->
  <path class="gold" d="M 96,76
                        C 100,88 102,98 104,110
                        L 108,140
                        L 132,140
                        L 136,110
                        C 138,98 140,88 144,76
                        L 128,72
                        C 126,78 123,80 120,80
                        C 117,80 114,78 112,72 Z"/>

  <!-- Neck -->
  <path class="gold" d="M 112,66 L 114,78 L 126,78 L 128,66 Z"/>

  <!-- Head: oval -->
  <ellipse class="gold" cx="120" cy="58" rx="11" ry="12.5"/>

  <!-- Hair cap (period curls, not helmet) -->
  <path class="gold" d="M 109,56
                        C 108,46 114,43 120,43
                        C 126,43 132,46 131,56
                        C 128,52 124,50 120,50
                        C 116,50 112,52 109,56 Z"/>

  <!-- Hands (raised): small ovals at circle at ~(46,25) -->
  <ellipse class="gold" cx="43" cy="26" rx="3.8" ry="2.8" transform="rotate(45 43 26)"/>
  <ellipse class="gold" cx="197" cy="26" rx="3.8" ry="2.8" transform="rotate(-45 197 26)"/>

  <!-- Hands (horizontal) -->
  <ellipse class="gold" cx="22" cy="79" rx="3.2" ry="3.6"/>
  <ellipse class="gold" cx="218" cy="79" rx="3.2" ry="3.6"/>

  <!-- Feet together -->
  <ellipse class="gold" cx="109" cy="239" rx="7.5" ry="2.8"/>
  <ellipse class="gold" cx="131" cy="239" rx="7.5" ry="2.8"/>

  <!-- Feet spread -->
  <ellipse class="gold" cx="94"  cy="238" rx="7.5" ry="2.8"/>
  <ellipse class="gold" cx="146" cy="238" rx="7.5" ry="2.8"/>

  <!-- ================================================================= -->
  <!-- TIER 1 INK (~2.0): main contours, pose separations                 -->
  <!-- ================================================================= -->
  <g class="ink1">
    <!-- Separate the two leg poses with a crisp vertical seam from groin -->
    <path d="M 120,80 L 120,140"/>
    <!-- Groin notch -->
    <path d="M 120,140 L 120,152"/>
    <!-- Hip belt -->
    <path d="M 108,140 L 132,140"/>
    <!-- Shoulder yoke: horizontal pose -->
    <path d="M 95,78 L 145,78"/>
    <!-- Shoulder yoke: raised pose (clavicle arc) -->
    <path d="M 95,74 C 110,70 130,70 145,74"/>
    <!-- Ribcage underline (subtle, straighter) -->
    <path d="M 105,108 C 112,112 128,112 135,108"/>
    <!-- Together-leg outer contours (left: outer edge; right: outer edge) -->
    <path d="M 108,145 C 107,160 107,185 108,210 C 109,225 111,234 112,236"/>
    <path d="M 132,145 C 133,160 133,185 132,210 C 131,225 129,234 128,236"/>
    <!-- Together-leg inner edges meeting at centerline (shows the leg gap) -->
    <path d="M 119,145 L 119,236"/>
    <path d="M 121,145 L 121,236"/>
    <!-- Spread-leg outer contours (fan outward to feet on circle) -->
    <path d="M 108,145 C 104,170 97,205 90,236"/>
    <path d="M 132,145 C 136,170 143,205 150,236"/>
    <!-- Spread-leg inner contours (edge nearest together-leg) -->
    <path d="M 116,146 C 113,170 107,205 100,238"/>
    <path d="M 124,146 C 127,170 133,205 140,238"/>
    <!-- Where horizontal arm meets raised arm at the shoulder -->
    <path d="M 96,75 L 93,80"/>
    <path d="M 144,75 L 147,80"/>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 2 INK (~1.4): muscle groups, hair                              -->
  <!-- ================================================================= -->
  <g class="ink2">
    <!-- Hairline / jaw (flatter chin, no smile curve) -->
    <path d="M 109,56 C 110,50 114,46 120,46 C 126,46 130,50 131,56"/>
    <path d="M 112,69 L 128,69"/>
    <!-- Pectorals (shallower curve, less smiley) -->
    <path d="M 107,90 C 112,95 117,95 120,95"/>
    <path d="M 133,90 C 128,95 123,95 120,95"/>
    <!-- Nipples -->
    <path d="M 112,91 L 112,93"/>
    <path d="M 128,91 L 128,93"/>
    <!-- Abdominals (linea alba + two cross lines) -->
    <path d="M 120,97 L 120,136"/>
    <path d="M 113,108 L 127,108"/>
    <path d="M 112,120 L 128,120"/>
    <path d="M 113,131 L 127,131"/>
    <!-- Deltoid caps: horizontal arm -->
    <path d="M 94,78 C 92,82 91,84 90,86"/>
    <path d="M 146,78 C 148,82 149,84 150,86"/>
    <!-- Deltoid caps: raised arm -->
    <path d="M 96,74 C 93,70 92,66 93,62"/>
    <path d="M 144,74 C 147,70 148,66 147,62"/>
    <!-- Horizontal arm interior (biceps/forearm transition) -->
    <path d="M 58,78 C 60,80 60,82 58,82"/>
    <path d="M 182,78 C 180,80 180,82 182,82"/>
    <!-- Raised arm interior -->
    <path d="M 55,60 C 58,61 60,63 60,65"/>
    <path d="M 185,60 C 182,61 180,63 180,65"/>
    <!-- Knees -->
    <path d="M 108,188 C 112,190 116,190 120,188"/>
    <path d="M 120,188 C 124,190 128,190 132,188"/>
    <!-- Spread-leg knees -->
    <path d="M 98,188  C 100,190 104,190 107,188"/>
    <path d="M 133,188 C 136,190 140,190 142,188"/>
    <!-- Hair tufts -->
    <path d="M 111,51 C 113,48 116,48 118,50"/>
    <path d="M 122,50 C 124,48 127,48 129,51"/>
  </g>

  <!-- ================================================================= -->
  <!-- TIER 3 INK (~0.9): fingers, toes, face, hatching                   -->
  <!-- ================================================================= -->
  <g class="ink3">
    <!-- Face: brow + eyes + nose + closed mouth (engraved, not smile) -->
    <path d="M 113,55 L 118,55"/>
    <path d="M 122,55 L 127,55"/>
    <circle class="inkfill" cx="116" cy="58" r=".75"/>
    <circle class="inkfill" cx="124" cy="58" r=".75"/>
    <path d="M 120,59 L 120,63"/>
    <path d="M 118,65 L 122,65"/>
    <!-- Ear suggestion -->
    <path d="M 109,58 C 108,60 108,62 109,63"/>
    <path d="M 131,58 C 132,60 132,62 131,63"/>

    <!-- Fingers — horizontal hands (five short strokes each) -->
    <g>
      <path d="M 20,75 L 15,75"/>
      <path d="M 20,77 L 14,77"/>
      <path d="M 20,79 L 14,79"/>
      <path d="M 20,81 L 15,81"/>
      <path d="M 20,83 L 16,83"/>
      <path d="M 220,75 L 225,75"/>
      <path d="M 220,77 L 226,77"/>
      <path d="M 220,79 L 226,79"/>
      <path d="M 220,81 L 225,81"/>
      <path d="M 220,83 L 224,83"/>
    </g>
    <!-- Fingers — raised hands (five short strokes each, radial outward) -->
    <g>
      <path d="M 40,24 L 36,20"/>
      <path d="M 42,22 L 40,18"/>
      <path d="M 44,22 L 44,18"/>
      <path d="M 46,22 L 48,19"/>
      <path d="M 47,24 L 50,21"/>
      <path d="M 200,24 L 204,20"/>
      <path d="M 198,22 L 200,18"/>
      <path d="M 196,22 L 196,18"/>
      <path d="M 194,22 L 192,19"/>
      <path d="M 193,24 L 190,21"/>
    </g>

    <!-- Toes, together-feet -->
    <g>
      <path d="M 104,240 L 104,238"/>
      <path d="M 107,240 L 107,237"/>
      <path d="M 110,240 L 110,237"/>
      <path d="M 113,240 L 113,237"/>
      <path d="M 116,240 L 116,238"/>
      <path d="M 124,240 L 124,238"/>
      <path d="M 127,240 L 127,237"/>
      <path d="M 130,240 L 130,237"/>
      <path d="M 133,240 L 133,237"/>
      <path d="M 136,240 L 136,238"/>
    </g>
    <!-- Toes, spread-feet -->
    <g>
      <path d="M 88,239 L 88,237"/>
      <path d="M 91,239 L 91,236"/>
      <path d="M 94,239 L 94,236"/>
      <path d="M 97,239 L 97,236"/>
      <path d="M 100,239 L 100,237"/>
      <path d="M 140,239 L 140,237"/>
      <path d="M 143,239 L 143,236"/>
      <path d="M 146,239 L 146,236"/>
      <path d="M 149,239 L 149,236"/>
      <path d="M 152,239 L 152,237"/>
    </g>

    <!-- Thigh interior lines (quadriceps) — faint hatching -->
    <g>
      <path d="M 114,155 L 112,185"/>
      <path d="M 126,155 L 128,185"/>
    </g>
    <!-- Calves (interior) -->
    <g>
      <path d="M 110,200 L 108,225"/>
      <path d="M 130,200 L 132,225"/>
    </g>
    <!-- Spread-leg calves -->
    <g>
      <path d="M 102,200 L 98,228"/>
      <path d="M 138,200 L 142,228"/>
    </g>
  </g>
</svg>
