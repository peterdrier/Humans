      <path d="M 110.5 191.6 C 112.0 193.2, 114.6 193.2, 116.0 191.6" stroke-width="1.15" />
      <path d="M 110.5 195.6 C 112.2 196.4, 114.4 196.4, 116.0 195.6" stroke-width="1.05" />
