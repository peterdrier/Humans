      <path d="M 25.6 83.1 C 27.6 83.2, 29.8 83.4, 31.8 83.6
               M 24.6 85.3 C 27.0 85.3, 29.6 85.3, 32.2 85.3
               M 27.0 87.1 C 28.8 87.0, 30.5 86.9, 32.0 86.7" stroke-width="0.75" />

      <!-- Delicate abdominal inscriptions & serratus anterior curves -->
      <path d="M 118.2 105.2 C 116.2 105.5, 114.2 105.2, 112.8 104.5" stroke-width="0.8" />
      <path d="M 118.2 112.5 C 116.2 112.8, 114.2 112.5, 112.8 111.8" stroke-width="0.8" />
