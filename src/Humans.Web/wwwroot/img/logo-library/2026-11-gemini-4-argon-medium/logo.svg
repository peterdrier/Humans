      <use href="#raised-arm-fill" transform="translate(240,0) scale(-1,1)" />
      <use href="#spread-leg-fill" />
      <use href="#spread-leg-fill" transform="translate(240,0) scale(-1,1)" />
    </g>

    <!-- Back pose Tier 2 & Tier 3 internal anatomy (clean organic curves, no stripes) -->
    <g id="back-pose-etch-left" fill="none" stroke="#3d2b1f" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tier 2 (1.15): Raised arm deltoid insertion emerging behind front shoulder & elbow brachioradialis sweep -->
      <path d="M 91.5 78.8 C 90.8 76.2, 89.2 74.0, 87.2 72.2" stroke-width="1.15" />
      <path d="M 70.0 60.8 C 67.0 61.2, 63.5 60.4, 59.8 58.6" stroke-width="1.15" />

