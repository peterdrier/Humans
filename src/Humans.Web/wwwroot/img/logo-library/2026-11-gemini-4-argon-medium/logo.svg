               M 111.0 239.3 C 110.9 238.2, 110.6 237.5, 110.2 237.2
               M 108.5 239.3 C 108.4 238.4, 108.1 237.8, 107.7 237.5" stroke-width="0.75" />
    </g>
    <use href="#front-tier3-left" transform="translate(240,0) scale(-1,1)" />

    <!-- Midline Facial features (Nose, solemn mouth, chin dimple) in Tier 3 -->
    <g fill="none" stroke="#3d2b1f" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round">
