    <circle cx="120" cy="120" r="120" stroke-width="3.2" />
    <rect x="23" y="46" width="194" height="194" stroke-width="2.8" />
  </g>

  <!-- 3. BACK POSE (Raised arms & Spread legs) -->
  <g id="back-pose">
    <g fill="#c9a96e">
