    <line x1="23" y1="191.5" x2="217" y2="191.5" stroke-width="0.45" stroke-opacity="0.24" />
    <line x1="23" y1="215.75" x2="217" y2="215.75" stroke-width="0.45" stroke-opacity="0.2" />
    <!-- Frame ruler ticks (4-cubit / 8-head subdivisions) -->
    <path d="M47.25 46 v3.5 M71.5 46 v5.5 M95.75 46 v3.5 M144.25 46 v3.5 M168.5 46 v5.5 M192.75 46 v3.5
             M23 70.25 h4.5 M23 94.5 h6 M23 118.75 h4.5 M23 143 h6 M23 167.25 h4.5 M23 191.5 h6 M23 215.75 h4.5
             M217 70.25 h-4.5 M217 94.5 h-6 M217 118.75 h-4.5 M217 143 h-6 M217 167.25 h-4.5 M217 191.5 h-6 M217 215.75 h-4.5"
          stroke-width="0.65" stroke-opacity="0.42" />
