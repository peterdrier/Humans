      <path d="M 77.8 187.8 C 79.8 186.8, 82.2 187.5, 83.0 189.2" stroke-width="1.2" />
      <path d="M 77.0 191.2 C 78.5 193.0, 81.0 193.2, 82.6 191.8" stroke-width="1.15" />

