  <!-- 1. FAINT GOLD CONSTRUCTION LINES (vanish at small sizes, enrich large view) -->
  <g stroke="#c9a96e" fill="none" stroke-linecap="round">
    <!-- Central vertical and navel horizontal axes -->
    <line x1="120" y1="0" x2="120" y2="240" stroke-width="0.6" stroke-opacity="0.35" />
    <line x1="0" y1="120" x2="240" y2="120" stroke-width="0.6" stroke-opacity="0.35" />
    <!-- Leonardo's equilateral triangle rays (groin to spread heels) & shoulder-to-corner diagonals -->
    <line x1="120" y1="143" x2="66.8" y2="225.8" stroke-width="0.55" stroke-opacity="0.28" stroke-dasharray="2.5 2.5" />
    <line x1="120" y1="143" x2="173.2" y2="225.8" stroke-width="0.55" stroke-opacity="0.28" stroke-dasharray="2.5 2.5" />
    <line x1="120" y1="81" x2="25.5" y2="46" stroke-width="0.55" stroke-opacity="0.25" stroke-dasharray="2.5 2.5" />
    <line x1="120" y1="81" x2="214.5" y2="46" stroke-width="0.55" stroke-opacity="0.25" stroke-dasharray="2.5 2.5" />
