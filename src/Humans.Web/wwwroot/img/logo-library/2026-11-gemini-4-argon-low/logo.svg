      C 217.5,47.5 215,50 210,52
      C 206,53 202,53.5 198,56
      C 189,63 180,70 170,76
      C 160,82 151,87 142,91
      Z
    " />

    <!-- Tier 1 Etch (2.0u): Pose Separation & Main Contours for Pose 2 -->
    <g stroke="#3d2b1f" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Raised arms outer contours -->
      <path d="M 97,79 C 87,71 78,64 67,59 C 58,53 47,48.5 36,46.8 C 31,45 26,44.5 23,46 C 22.5,47.5 25,50 30,52 C 34,53 38,53.5 42,56 C 51,63 60,70 70,76 C 79,81 88,86 96,90" />
      <path d="M 143,79 C 153,71 162,64 173,59 C 182,53 193,48.5 204,46.8 C 209,45 214,44.5 217,46 C 217.5,47.5 215,50 210,52 C 206,53 202,53.5 198,56 C 189,63 180,70 170,76 C 161,81 152,86 144,90" />
