      <path d="M 128,76 C 137,77 145,78 152,80 C 161,79 169,81 177,82 C 187,80.5 195,82 203,83 C 208,82 214,82 217,84 C 218,86 215,88 210,89 C 206,90 203,89 200,88 C 192,90.5 183,91.5 174,90 C 164,92.5 154,93.5 144,91" />
