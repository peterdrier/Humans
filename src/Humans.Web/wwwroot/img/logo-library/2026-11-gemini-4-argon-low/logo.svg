      <path d="M 67,59 C 65,61.5 65,64.5 67,66.5" />
      <path d="M 173,59 C 175,61.5 175,64.5 173,66.5" />
      <path d="M 88,78.5 C 80,73.5 73,69 68,65.5" />
      <path d="M 152,78.5 C 160,73.5 167,69 172,65.5" />
