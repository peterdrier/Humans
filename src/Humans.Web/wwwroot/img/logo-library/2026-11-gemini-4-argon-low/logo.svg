    <line x1="23" y1="215.75" x2="28.5" y2="215.75" /><line x1="211.5" y1="215.75" x2="217" y2="215.75" />
    <!-- Cubit/palm scale ticks along square bottom -->
    <line x1="47.25" y1="234.5" x2="47.25" y2="240" />
    <line x1="71.5" y1="232.5" x2="71.5" y2="240" />
    <line x1="95.75" y1="234.5" x2="95.75" y2="240" />
    <line x1="144.25" y1="234.5" x2="144.25" y2="240" />
    <line x1="168.5" y1="232.5" x2="168.5" y2="240" />
    <line x1="192.75" y1="234.5" x2="192.75" y2="240" />
