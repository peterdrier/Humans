      <path d="M 129,229 C 129,231 127.5,232 126,232" />
      <path d="M 109,235.5 C 111.5,236.5 114,237.5 116,239" />
      <path d="M 106,237.2 C 108,238.2 110,239 112,239.5" />
      <path d="M 131,235.5 C 128.5,236.5 126,237.5 124,239" />
