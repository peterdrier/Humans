      <path d="M 141,134 L 136,137 M 144,139 L 139,142 M 147,144 L 142,147" />
      <path d="M 90,77 L 94,81 M 85,74 L 89,78" />
      <path d="M 150,77 L 146,81 M 155,74 L 151,78" />
    </g>
  </g>

