      C 91,137 82,153 76,169
      C 73.5,175 73,179 70,185
      C 65.5,194 63,204 60,214
      C 57,215 53,216 52,217.5
      C 52,219 58,223 63,224.8
      C 66,225.5 68,224 68.5,221
      C 70,213 76,204 81,193
      C 84.5,185 85.5,179 88.5,173
      C 96,160 105,147 113,136
      Z
      M 139,123
      C 149,137 158,153 164,169
      C 166.5,175 167,179 170,185
      C 174.5,194 177,204 180,214
      C 183,215 187,216 188,217.5
      C 188,219 182,223 177,224.8
      C 174,225.5 172,224 171.5,221
      C 170,213 164,204 159,193
      C 155.5,185 154.5,179 151.5,173
      C 144,160 135,147 127,136
