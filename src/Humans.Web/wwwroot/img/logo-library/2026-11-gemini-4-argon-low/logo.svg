      <path d="M 146,142 C 153,153 158,163 161,171" />
      <path d="M 78,171 C 79.5,169.5 82.5,170 83.5,172.5 C 83.5,175.5 79.5,176.5 77.5,174.5" />
      <path d="M 162,171 C 160.5,169.5 157.5,170 156.5,172.5 C 156.5,175.5 160.5,176.5 162.5,174.5" />
