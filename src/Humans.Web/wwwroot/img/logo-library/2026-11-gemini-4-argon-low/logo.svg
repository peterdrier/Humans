      <path d="M 117,142 C 117,145.5 123,145.5 123,142" />
      <path d="M 118.8,143.5 C 118.8,148 121.2,148 121.2,143.5" />
      <!-- Quadriceps & Patella (Knees at y≈175-182) -->
