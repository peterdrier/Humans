      <path d="M 35,47.5 C 32,46.5 29,46 26,46.5" />
      <path d="M 35,50 C 31,49 28,48.5 25,48" />
      <path d="M 205,47.5 C 208,46.5 211,46 214,46.5" />
      <path d="M 205,50 C 209,49 212,48.5 215,48" />
      <!-- Spread ankle malleolus & foot arch -->
      <path d="M 63,215 C 62,217.5 63,219.5 65,219.5" />
      <path d="M 177,215 C 178,217.5 177,219.5 175,219.5" />
      <path d="M 59,218 C 57,218.5 55,218.5 53.5,218" />
      <path d="M 181,218 C 183,218.5 185,218.5 186.5,218" />
