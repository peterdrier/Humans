<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <defs>
    <style>
      .frame { fill: none; stroke: #c9a96e; stroke-width: 1.4; }
      .axis { stroke: #c9a96e; stroke-width: 0.5; opacity: 0.35; stroke-dasharray: 2 2; }
      .gold { fill: #c9a96e; }
      .t1 { stroke: #3d2b1f; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .t2 { stroke: #3d2b1f; stroke-width: 1.0; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .t3 { stroke: #3d2b1f; stroke-width: 0.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fill { fill: #3d2b1f; }
    </style>
  </defs>

  <!-- Frame: circle centred at (120, 120) r=120, square x=23, y=46, side=194 -->
  <rect class="frame" x="23" y="46" width="194" height="194" />
  <circle class="frame" cx="120" cy="120" r="120" />
  
  <!-- Subtle Leonardo construction axes -->
  <line class="axis" x1="120" y1="0" x2="120" y2="240" />
  <line class="axis" x1="0" y1="120" x2="240" y2="120" />
  <line class="axis" x1="23" y1="143" x2="217" y2="143" />

  <!-- Base Solid Silhouette (Gold #c9a96e) -->
  <g class="gold">
    <!-- Straight Legs (Pose 1: standing together, feet resting on bottom y=240) -->
    <!-- Left straight leg -->
    <path d="M 106 143 C 104 165 105 190 106 210 C 107 225 107 236 107 240 L 93 240 C 94 234 97 220 99 205 C 100 185 102 165 106 143 Z" />
    <!-- Right straight leg -->
    <path d="M 134 143 C 136 165 135 190 134 210 C 133 225 133 236 133 240 L 147 240 C 146 234 143 220 141 205 C 140 185 138 165 134 143 Z" />
    <!-- Inseam fill straight legs -->
    <path d="M 112 143 L 128 143 L 122 238 L 118 238 Z" />

    <!-- Spread Legs (Pose 2: reaching bottom perimeter of circle ~ (60, 226) and (180, 226)) -->
    <!-- Left spread leg -->
    <path d="M 110 143 C 102 155 88 178 78 198 C 68 215 58 224 54 226 C 55 229 64 231 71 228 C 80 220 94 204 103 186 C 111 170 116 154 118 146 Z" />
    <!-- Right spread leg -->
    <path d="M 130 143 C 138 155 152 178 162 198 C 172 215 182 224 186 226 C 185 229 176 231 169 228 C 160 220 146 204 137 186 C 129 170 124 154 122 146 Z" />

    <!-- Torso: Classical proportion with athletic ribcage and shoulders -->
    <path d="M 96 75 C 97 90 100 102 102 110 C 104 116 107 122 107 128 C 107 134 107 139 110 144 L 130 144 C 133 139 133 134 133 128 C 133 122 136 116 138 110 C 140 102 143 90 144 75 Z" />

    <!-- Neck & Trapezius -->
    <path d="M 113 67 C 110 70 103 73 96 75 L 144 75 C 137 73 130 70 127 67 Z" />

    <!-- Head & Hair (top y=46, chin y=70, natural oval with curly volume) -->
    <path d="M 113 54 C 111 46 127 46 127 54 C 128 62 125 70 120 70 C 115 70 112 62 113 54 Z" />
    <!-- Classical curls silhouette -->
    <path d="M 112 54 C 108 49 112 45 120 45 C 128 45 132 49 128 54 C 131 58 130 64 127 66 C 126 61 125 56 124 53 C 122 48 118 48 116 53 C 115 56 114 61 113 66 C 110 64 109 58 112 54 Z" />

    <!-- Raised Arms (Pose 2: reaching top circle perimeter ~ 28, 34 and 212, 34) -->
    <!-- Left raised arm -->
    <path d="M 98 74 C 89 66 72 54 55 44 C 43 37 34 34 27 33 C 27 35 28 40 34 44 C 45 52 66 65 84 76 C 91 81 95 84 97 85 Z" />
    <!-- Right raised arm -->
    <path d="M 142 74 C 151 66 168 54 185 44 C 197 37 206 34 213 33 C 213 35 212 40 206 44 C 195 52 174 65 156 76 C 149 81 145 84 143 85 Z" />

    <!-- Horizontal Arms (Pose 1: reaching square sides x=23, 217 at y≈81) -->
    <!-- Left horizontal arm -->
    <path d="M 97 76 L 68 78 C 50 78 35 79 23 80 C 21 82 21 84 23 85 C 35 86 50 86 68 85 L 97 85 Z" />
    <!-- Right horizontal arm -->
    <path d="M 143 76 L 172 78 C 190 78 205 79 217 80 C 219 82 219 84 217 85 C 205 86 190 86 172 85 L 143 85 Z" />
  </g>

  <!-- Aged-ink Details (#3d2b1f) -->
  <!-- Tier 1: Main contours & anatomical structures -->
  <g class="t1">
    <!-- Jaw and chin -->
    <path d="M 115 62 C 116 67 118 70 120 70 C 122 70 124 67 125 62" />

    <!-- Neck & Clavicle line -->
    <path d="M 116 67 L 118 76" />
    <path d="M 124 67 L 122 76" />
    <path d="M 97 75 C 105 77 113 78 120 78 C 127 78 135 77 143 75" />

    <!-- Torso lateral contours -->
    <path d="M 97 75 C 98 89 101 101 102 110 C 104 116 107 122 107 128 C 107 134 107 139 110 144" />
    <path d="M 143 75 C 142 89 139 101 138 110 C 136 116 133 122 133 128 C 133 134 133 139 130 144" />

    <!-- Midline (Sternum & Linea alba) -->
    <path d="M 120 78 L 120 143" />

    <!-- Pelvis / Groin line (Square centre at 120, 143) -->
    <path d="M 113 143 Q 120 146 127 143" />

    <!-- Straight legs contours -->
    <path d="M 106 143 C 104 165 105 190 106 240" />
    <path d="M 134 143 C 136 165 135 190 134 240" />
    <path d="M 120 146 L 120 240" />

    <!-- Spread legs contours -->
    <path d="M 111 144 C 103 162 88 188 71 216 L 58 226" />
    <path d="M 129 144 C 137 162 152 188 169 216 L 182 226" />
    <path d="M 118 148 C 113 164 98 194 76 226" />
    <path d="M 122 148 C 127 164 142 194 164 226" />

    <!-- Horizontal arms contours -->
    <path d="M 97 76 L 24 80" />
    <path d="M 97 85 L 24 85" />
    <path d="M 143 76 L 216 80" />
    <path d="M 143 85 L 216 85" />

    <!-- Raised arms contours -->
    <path d="M 98 74 L 29 34" />
    <path d="M 97 85 L 36 45" />
    <path d="M 142 74 L 211 34" />
    <path d="M 143 85 L 204 45" />
  </g>

  <!-- Tier 2: Musculature, joint articulations, hair curves -->
  <g class="t2">
    <!-- Pectoralis Major -->
    <path d="M 103 84 C 108 89 115 89 120 86 C 125 89 132 89 137 84" />
    <path d="M 104 91 C 110 96 116 96 120 93 C 124 96 130 96 136 91" />

    <!-- Ribcage / Thoracic arch -->
    <path d="M 109 105 C 114 101 126 101 131 105" />

    <!-- Rectus abdominis -->
    <path d="M 111 113 Q 120 115 129 113" />
    <!-- Navel exactly at (120, 120) -->
    <circle cx="120" cy="120" r="1.3" class="ink-fill" />
    <path d="M 112 127 Q 120 129 128 127" />
    <path d="M 113 135 Q 120 137 127 135" />

    <!-- Deltoid definitions -->
    <path d="M 95 77 C 91 81 90 84 94 85" />
    <path d="M 145 77 C 149 81 150 84 146 85" />
    <path d="M 68 78 Q 64 81 60 78" />
    <path d="M 172 78 Q 176 81 180 78" />

    <!-- Knees (straight) at y≈188 -->
    <path d="M 107 184 C 109 182 114 182 115 184 C 114 189 109 189 107 184 Z" />
    <path d="M 125 184 C 127 182 132 182 133 184 C 132 189 127 189 125 184 Z" />

    <!-- Knees (spread) at y≈192 -->
    <path d="M 84 187 C 87 184 92 187 91 192" />
    <path d="M 156 187 C 153 184 148 187 149 192" />

    <!-- Classical wavy hair -->
    <path d="M 115 48 C 118 46 122 46 125 48" />
    <path d="M 112 52 C 115 51 117 53 118 55" />
    <path d="M 128 52 C 125 51 123 53 122 55" />
    <path d="M 113 58 C 114 60 115 63 114 66" />
    <path d="M 127 58 C 126 60 125 63 126 66" />
  </g>

  <!-- Tier 3: Renaissance face, fine hatching, hands & feet -->
  <g class="t3">
    <!-- Classical Leonardo face -->
    <!-- Brow -->
    <path d="M 116.5 54 C 118 53.5 119.5 54 120 54.8 C 120.5 54 122 53.5 123.5 54" />
    <!-- Eyes -->
    <path d="M 117 56.2 C 118 55.8 119 56.2 118.5 56.9" />
    <path d="M 123 56.2 C 122 55.8 121 56.2 121.5 56.9" />
    <!-- Nose line & tip -->
    <path d="M 120 54.8 L 120 61 L 121.2 61.5" />
    <!-- Lips -->
    <path d="M 118.2 64.5 C 119.5 64.2 120.5 64.2 121.8 64.5" />
    <path d="M 119.2 66 C 120 66.5 120.8 66 120.8 66" />
    <circle cx="120" cy="68.5" r="0.4" class="ink-fill" />

    <!-- Shading hatching (left-handed da Vinci slant) -->
    <line x1="103" y1="88" x2="108" y2="90" />
    <line x1="103" y1="92" x2="109" y2="94" />
    <line x1="103" y1="96" x2="110" y2="98" />
    <line x1="132" y1="88" x2="137" y2="90" />
    <line x1="131" y1="92" x2="137" y2="94" />
    <line x1="130" y1="96" x2="137" y2="98" />

    <line x1="105" y1="112" x2="109" y2="114" />
    <line x1="106" y1="117" x2="110" y2="119" />
    <line x1="106" y1="123" x2="110" y2="125" />
    <line x1="107" y1="130" x2="111" y2="132" />
    <line x1="131" y1="112" x2="135" y2="114" />
    <line x1="130" y1="117" x2="134" y2="119" />
    <line x1="130" y1="123" x2="134" y2="125" />
    <line x1="129" y1="130" x2="133" y2="132" />

    <!-- Hands: Horizontal pose (reaching square sides x=23, 217) -->
    <!-- Left hand: fingers extended -->
    <path d="M 23 80 C 19 79 17 80 15 81" />
    <path d="M 23 82 C 18 82 15 82.5 13 83.5" />
    <path d="M 23 84 C 18 84 15 85 13 86" />
    <!-- Right hand -->
    <path d="M 217 80 C 221 79 223 80 225 81" />
    <path d="M 217 82 C 222 82 225 82.5 227 83.5" />
    <path d="M 217 84 C 222 84 225 85 227 86" />

    <!-- Hands: Raised pose (reaching circle perimeter ~ 27, 33 and 213, 33) -->
    <!-- Left raised hand -->
    <path d="M 28 34 C 23 29 21 27 19 27" />
    <path d="M 30 32 C 25 26 23 24 22 23" />
    <path d="M 32 31 C 28 25 27 22 26 21" />
    <!-- Right raised hand -->
    <path d="M 212 34 C 217 29 219 27 221 27" />
    <path d="M 210 32 C 215 26 217 24 218 23" />
    <path d="M 208 31 C 212 25 213 22 214 21" />

    <!-- Feet: Straight pose (y=240, turned outward) -->
    <path d="M 107 240 C 103 240 96 240 92 239" />
    <path d="M 133 240 C 137 240 144 240 148 239" />

    <!-- Feet: Spread pose (y=226, resting on circle perimeter) -->
    <path d="M 60 225 C 55 227 51 229 48 230" />
    <path d="M 180 225 C 185 227 189 229 192 230" />
  </g>
</svg>
