<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <defs>
    <style>
      .gold { fill: #c9a96e; }
      .goldline { fill: none; stroke: #c9a96e; stroke-linecap: round; stroke-linejoin: round; }
      .ink1 { fill: none; stroke: #3d2b1f; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; }
      .ink2 { fill: none; stroke: #3d2b1f; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .ink3 { fill: none; stroke: #3d2b1f; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
      .inkfill { fill: #3d2b1f; }
    </style>
  </defs>

  <!-- Faint gold construction (vanishes small) -->
  <g class="goldline" stroke-width="0.5" opacity="0.5">
    <line x1="120" y1="0" x2="120" y2="240"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
    <line x1="0" y1="143" x2="240" y2="143"/>
  </g>

  <!-- Frame: circle + square in gold -->
  <circle cx="120" cy="120" r="120" fill="none" stroke="#c9a96e" stroke-width="2.4"/>
  <rect x="23" y="46" width="194" height="194" fill="none" stroke="#c9a96e" stroke-width="2.4"/>

  <!-- ============ BOLD SOLID BASE (gold) ============ -->
  <g class="gold">
    <!-- Head -->
    <ellipse cx="120" cy="59" rx="11" ry="13"/>
    <!-- Neck -->
    <rect x="115" y="70" width="10" height="7"/>
    <!-- Torso: shoulders wide, taper to waist, flare slightly to hips -->
    <path d="M 92,78 Q 90,100 96,120 Q 100,135 104,143 L 136,143 Q 140,135 144,120 Q 150,100 148,78 Q 140,74 120,74 Q 100,74 92,78 Z"/>

    <!-- Legs TOGETHER (vertical, feet at circle bottom y=240) -->
    <path d="M 108,143 Q 106,180 108,215 Q 108,235 112,240 L 120,240 L 120,143 Z"/>
    <path d="M 132,143 Q 134,180 132,215 Q 132,235 128,240 L 120,240 L 120,143 Z"/>

    <!-- Legs SPREAD (reaching circle at lower sides, ~y=210, x spread) -->
    <!-- Right spread leg -->
    <path d="M 120,143 L 136,145 Q 160,170 185,205 Q 189,211 184,214 Q 180,216 173,212 Q 148,185 128,160 Q 122,152 120,143 Z"/>
    <!-- Left spread leg -->
    <path d="M 120,143 L 104,145 Q 80,170 55,205 Q 51,211 56,214 Q 60,216 67,212 Q 92,185 112,160 Q 118,152 120,143 Z"/>

    <!-- Arms HORIZONTAL (to square sides, y ≈ 85) -->
    <path d="M 92,80 L 23,82 L 23,90 L 94,92 Z"/>
    <path d="M 148,80 L 217,82 L 217,90 L 146,92 Z"/>

    <!-- Arms RAISED (to circle upper-sides, 45° up, reaching r=120) -->
    <!-- Right raised arm -->
    <path d="M 142,78 Q 170,55 198,38 Q 203,36 205,40 Q 206,43 202,46 Q 175,62 150,86 Q 146,82 142,78 Z"/>
    <!-- Left raised arm -->
    <path d="M 98,78 Q 70,55 42,38 Q 37,36 35,40 Q 34,43 38,46 Q 65,62 90,86 Q 94,82 98,78 Z"/>

    <!-- Hands horizontal (at square edges) -->
    <ellipse cx="20" cy="86" rx="5" ry="5"/>
    <ellipse cx="220" cy="86" rx="5" ry="5"/>
    <!-- Hands raised (at upper circle) -->
    <circle cx="202" cy="40" r="4.5"/>
    <circle cx="38" cy="40" r="4.5"/>

    <!-- Feet together -->
    <ellipse cx="114" cy="241" rx="7" ry="3"/>
    <ellipse cx="126" cy="241" rx="7" ry="3"/>
    <!-- Feet spread -->
    <ellipse cx="183" cy="213" rx="7" ry="3" transform="rotate(50 183 213)"/>
    <ellipse cx="57" cy="213" rx="7" ry="3" transform="rotate(-50 57 213)"/>
  </g>

  <!-- ============ TIER 1 ink: main contours, pose separations ============ -->
  <g class="ink1">
    <!-- Head contour -->
    <ellipse cx="120" cy="59" rx="11" ry="13" fill="none"/>
    <line x1="115" y1="70" x2="115" y2="77"/>
    <line x1="125" y1="70" x2="125" y2="77"/>

    <!-- Torso contour -->
    <path d="M 92,78 Q 90,100 96,120 Q 100,135 104,143"/>
    <path d="M 148,78 Q 150,100 144,120 Q 140,135 136,143"/>
    <line x1="104" y1="143" x2="136" y2="143"/>

    <!-- Legs together separation -->
    <line x1="120" y1="143" x2="120" y2="240"/>
    <path d="M 108,143 Q 106,180 108,215 Q 108,235 112,240"/>
    <path d="M 132,143 Q 134,180 132,215 Q 132,235 128,240"/>

    <!-- Legs spread outer contours -->
    <path d="M 136,145 Q 160,170 185,205"/>
    <path d="M 104,145 Q 80,170 55,205"/>

    <!-- Horizontal arms outlines -->
    <line x1="92" y1="80" x2="23" y2="82"/>
    <line x1="94" y1="92" x2="23" y2="90"/>
    <line x1="148" y1="80" x2="217" y2="82"/>
    <line x1="146" y1="92" x2="217" y2="90"/>

    <!-- Raised arms outlines -->
    <path d="M 142,78 Q 170,55 198,38"/>
    <path d="M 150,86 Q 175,62 202,46"/>
    <path d="M 98,78 Q 70,55 42,38"/>
    <path d="M 90,86 Q 65,62 38,46"/>
  </g>

  <!-- ============ TIER 2 ink: muscle groups, hair ============ -->
  <g class="ink2">
    <!-- Hair: curly cap over head -->
    <path d="M 110,50 Q 112,44 120,44 Q 128,44 130,50"/>
    <path d="M 108,54 Q 112,47 116,49"/>
    <path d="M 124,49 Q 128,47 132,54"/>

    <!-- Collarbone -->
    <path d="M 102,80 Q 110,78 120,80 Q 130,78 138,80"/>
    <!-- Pectorals -->
    <path d="M 100,90 Q 110,98 118,95"/>
    <path d="M 140,90 Q 130,98 122,95"/>
    <!-- Sternum -->
    <line x1="120" y1="86" x2="120" y2="120"/>
    <!-- Abdomen division -->
    <path d="M 108,118 Q 120,116 132,118"/>
    <path d="M 110,128 Q 120,126 130,128"/>
    <!-- Hip crease -->
    <path d="M 108,138 Q 120,143 132,138"/>

    <!-- Together legs: knee hints -->
    <path d="M 108,185 Q 112,186 114,185"/>
    <path d="M 132,185 Q 128,186 126,185"/>

    <!-- Spread legs: knee hints -->
    <circle cx="160" cy="175" r="2.5" fill="none"/>
    <circle cx="80" cy="175" r="2.5" fill="none"/>
  </g>

  <!-- ============ TIER 3 ink: fingers, toes, face, hatching ============ -->
  <g class="ink3">
    <!-- Face: eyes, nose, mouth -->
    <circle cx="116" cy="58" r="0.9" class="inkfill"/>
    <circle cx="124" cy="58" r="0.9" class="inkfill"/>
    <path d="M 120,60 L 119,64 L 121,64"/>
    <path d="M 116,67 Q 120,69 124,67"/>
    <!-- Eyebrows -->
    <path d="M 113,55 L 118,54"/>
    <path d="M 122,54 L 127,55"/>

    <!-- Fingers horizontal hands -->
    <g>
      <line x1="20" y1="82" x2="14" y2="80"/>
      <line x1="20" y1="84" x2="13" y2="84"/>
      <line x1="20" y1="86" x2="13" y2="87"/>
      <line x1="20" y1="88" x2="14" y2="90"/>
    </g>
    <g>
      <line x1="220" y1="82" x2="226" y2="80"/>
      <line x1="220" y1="84" x2="227" y2="84"/>
      <line x1="220" y1="86" x2="227" y2="87"/>
      <line x1="220" y1="88" x2="226" y2="90"/>
    </g>
    <!-- Fingers raised hands -->
    <g>
      <line x1="202" y1="40" x2="207" y2="33"/>
      <line x1="204" y1="40" x2="209" y2="36"/>
      <line x1="205" y1="42" x2="211" y2="40"/>
      <line x1="205" y1="44" x2="210" y2="44"/>
    </g>
    <g>
      <line x1="38" y1="40" x2="33" y2="33"/>
      <line x1="36" y1="40" x2="31" y2="36"/>
      <line x1="35" y1="42" x2="29" y2="40"/>
      <line x1="35" y1="44" x2="30" y2="44"/>
    </g>

    <!-- Toes -->
    <line x1="108" y1="240" x2="108" y2="242"/>
    <line x1="111" y1="240" x2="111" y2="242"/>
    <line x1="114" y1="240" x2="114" y2="242"/>
    <line x1="117" y1="240" x2="117" y2="242"/>
    <line x1="123" y1="240" x2="123" y2="242"/>
    <line x1="126" y1="240" x2="126" y2="242"/>
    <line x1="129" y1="240" x2="129" y2="242"/>
    <line x1="132" y1="240" x2="132" y2="242"/>

    <!-- Light hatching on torso -->
    <line x1="98" y1="100" x2="100" y2="115"/>
    <line x1="142" y1="100" x2="140" y2="115"/>
    <line x1="106" y1="105" x2="107" y2="118"/>
    <line x1="134" y1="105" x2="133" y2="118"/>

    <!-- Hatching on together legs -->
    <line x1="112" y1="160" x2="113" y2="200"/>
    <line x1="128" y1="160" x2="127" y2="200"/>

    <!-- Compass ticks around circle -->
    <g stroke="#c9a96e" stroke-width="1">
      <line x1="120" y1="0" x2="120" y2="4"/>
      <line x1="120" y1="236" x2="120" y2="240"/>
      <line x1="0" y1="120" x2="4" y2="120"/>
      <line x1="236" y1="120" x2="240" y2="120"/>
    </g>
  </g>

  <!-- Navel marker -->
  <circle cx="120" cy="120" r="1.2" class="inkfill"/>
</svg>
