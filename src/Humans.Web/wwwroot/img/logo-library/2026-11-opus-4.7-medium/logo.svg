<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <!-- Faint gold construction (vanishes small) -->
  <g fill="none" stroke="#c9a96e" stroke-opacity="0.22" stroke-width="0.4">
    <line x1="120" y1="2" x2="120" y2="238"/>
    <line x1="2" y1="120" x2="238" y2="120"/>
    <circle cx="120" cy="120" r="94.5"/>
    <line x1="23" y1="46" x2="217" y2="46"/>
    <line x1="23" y1="240" x2="217" y2="240"/>
  </g>

  <!-- GOLD BASE: frame + body silhouette -->
  <g fill="#c9a96e" stroke="#c9a96e" stroke-linejoin="round" stroke-linecap="round">
    <!-- Frame: circle & square (stroked, not filled) -->
    <circle cx="120" cy="120" r="120" fill="none" stroke-width="2.4"/>
    <rect x="23" y="46" width="194" height="194" fill="none" stroke-width="2.4"/>

    <!-- HORIZONTAL ARMS (behind) -->
    <!-- left: shoulder (99,86) -> hand (23,120) -->
    <path d="M 99 80 L 28 116 L 23 120 L 28 124 L 101 92 Z"/>
    <!-- right -->
    <path d="M 141 80 L 212 116 L 217 120 L 212 124 L 139 92 Z"/>
    <!-- horizontal hands (open palms) -->
    <path d="M 23 120 q -3 -5 -1 -8 q 2 -1 3 2 q 2 -3 4 -1 q 2 -2 4 1 q 2 -1 3 2 l -2 6 z"/>
    <path d="M 23 120 q -3 5 -1 8 q 2 1 3 -2 q 2 3 4 1 q 2 2 4 -1 q 2 1 3 -2 l -2 -6 z"/>
    <path d="M 217 120 q 3 -5 1 -8 q -2 -1 -3 2 q -2 -3 -4 -1 q -2 -2 -4 1 q -2 -1 -3 2 l 2 6 z"/>
    <path d="M 217 120 q 3 5 1 8 q -2 1 -3 -2 q -2 3 -4 1 q -2 2 -4 -1 q -2 1 -3 -2 l 2 -6 z"/>

    <!-- SPREAD LEGS (behind legs-together, but drawn first so together sits on top) -->
    <!-- left spread: groin (120,143) -> foot (53,220) -->
    <path d="M 118 143 L 49 220 L 56 224 L 122 147 Z"/>
    <!-- right spread -->
    <path d="M 122 143 L 191 220 L 184 224 L 118 147 Z"/>
    <!-- spread feet -->
    <ellipse cx="52" cy="222" rx="7" ry="3.2"/>
    <ellipse cx="188" cy="222" rx="7" ry="3.2"/>

    <!-- RAISED ARMS (behind horizontal where they cross torso) -->
    <!-- left: shoulder (99,86) -> hand (32,38) -->
    <path d="M 97 88 L 28 40 L 34 34 L 103 84 Z"/>
    <!-- right -->
    <path d="M 143 88 L 212 40 L 206 34 L 137 84 Z"/>
    <!-- raised hands -->
    <path d="M 32 38 q -4 -3 -3 -7 q 3 -2 4 1 q 1 -3 4 -1 q 1 -3 4 0 q 1 -2 3 1 l -1 5 z"/>
    <path d="M 208 38 q 4 -3 3 -7 q -3 -2 -4 1 q -1 -3 -4 -1 q -1 -3 -4 0 q -1 -2 -3 1 l 1 5 z"/>

    <!-- LEGS TOGETHER -->
    <!-- left thigh+shin: groin to foot (108,238) -->
    <path d="M 115 142 L 102 190 L 104 238 L 114 238 L 116 190 L 120 142 Z"/>
    <!-- right -->
    <path d="M 125 142 L 138 190 L 136 238 L 126 238 L 124 190 L 120 142 Z"/>
    <!-- together feet -->
    <ellipse cx="108" cy="239" rx="6.5" ry="2.8"/>
    <ellipse cx="132" cy="239" rx="6.5" ry="2.8"/>

    <!-- TORSO -->
    <path d="M 98 86
             C 97 92, 95 100, 100 108
             L 102 140
             L 108 144
             L 132 144
             L 138 140
             L 140 108
             C 145 100, 143 92, 142 86
             C 135 82, 128 80, 120 80
             C 112 80, 105 82, 98 86 Z"/>

    <!-- NECK -->
    <path d="M 115 72 L 114 82 L 126 82 L 125 72 Z"/>

    <!-- HEAD -->
    <ellipse cx="120" cy="60" rx="12.5" ry="14"/>

    <!-- HAIR cap -->
    <path d="M 108 54
             C 108 46, 114 44, 120 44
             C 126 44, 132 46, 132 54
             C 132 50, 128 48, 120 48
             C 112 48, 108 50, 108 54 Z"/>
  </g>

  <!-- ETCH TIER 1 (~2.0): main contours & pose separations -->
  <g fill="none" stroke="#3d2b1f" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
    <!-- Torso outline -->
    <path d="M 98 86 C 97 92, 95 100, 100 108 L 102 140 L 108 144 L 132 144 L 138 140 L 140 108 C 145 100, 143 92, 142 86"/>
    <!-- Shoulders line separating horizontal vs raised arms -->
    <path d="M 98 86 C 108 82, 132 82, 142 86"/>
    <!-- Horizontal arm contours -->
    <path d="M 101 92 L 28 124"/>
    <path d="M 99 80 L 28 116"/>
    <path d="M 139 92 L 212 124"/>
    <path d="M 141 80 L 212 116"/>
    <!-- Raised arm contours -->
    <path d="M 97 88 L 28 40"/>
    <path d="M 103 84 L 34 34"/>
    <path d="M 143 88 L 212 40"/>
    <path d="M 137 84 L 206 34"/>
    <!-- Legs together contours -->
    <path d="M 115 142 L 102 190 L 104 238"/>
    <path d="M 120 142 L 116 190 L 114 238"/>
    <path d="M 125 142 L 138 190 L 136 238"/>
    <path d="M 120 142 L 124 190 L 126 238"/>
    <!-- Spread leg contours -->
    <path d="M 118 143 L 49 220"/>
    <path d="M 122 147 L 56 224"/>
    <path d="M 122 143 L 191 220"/>
    <path d="M 118 147 L 184 224"/>
    <!-- Head & neck -->
    <ellipse cx="120" cy="60" rx="12.5" ry="14"/>
    <path d="M 115 72 L 114 82"/>
    <path d="M 125 72 L 126 82"/>
  </g>

  <!-- ETCH TIER 2 (~1.4): muscles, knees, hair -->
  <g fill="none" stroke="#3d2b1f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sternum & subtle abs -->
    <path d="M 120 100 L 120 138"/>
    <path d="M 114 118 Q 120 119 126 118"/>
    <path d="M 114 128 Q 120 129 126 128"/>
    <!-- Pecs: subtle underline arcs -->
    <path d="M 105 100 Q 112 106 119 103"/>
    <path d="M 135 100 Q 128 106 121 103"/>
    <!-- Knees (together) -->
    <path d="M 102 188 Q 109 191 116 188"/>
    <path d="M 124 188 Q 131 191 138 188"/>
    <!-- Knees (spread) left ~midpoint (84,181), right (156,181) -->
    <path d="M 82 180 Q 86 184 90 180"/>
    <path d="M 150 180 Q 154 184 158 180"/>
    <!-- Hair detail -->
    <path d="M 110 50 Q 120 46 130 50"/>
    <path d="M 112 46 Q 120 42 128 46"/>
  </g>

  <!-- ETCH TIER 3 (~0.9): face, fingers, toes, hatching -->
  <g fill="none" stroke="#3d2b1f" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Face: brow, nose bridge, mouth line, beard -->
    <path d="M 113 57 L 118 58"/>
    <path d="M 122 58 L 127 57"/>
    <path d="M 120 59 L 120 65"/>
    <path d="M 118 68 L 122 68"/>
    <path d="M 114 70 Q 120 73 126 70"/>
    <!-- Fingers horizontal hands (left) -->
    <path d="M 22 118 L 18 116"/>
    <path d="M 23 120 L 18 120"/>
    <path d="M 22 122 L 18 124"/>
    <path d="M 24 115 L 22 112"/>
    <path d="M 24 125 L 22 128"/>
    <!-- Fingers horizontal hands (right) -->
    <path d="M 218 118 L 222 116"/>
    <path d="M 217 120 L 222 120"/>
    <path d="M 218 122 L 222 124"/>
    <path d="M 216 115 L 218 112"/>
    <path d="M 216 125 L 218 128"/>
    <!-- Fingers raised hands (left) -->
    <path d="M 30 36 L 28 32"/>
    <path d="M 32 35 L 31 30"/>
    <path d="M 34 35 L 34 30"/>
    <path d="M 36 36 L 37 31"/>
    <!-- Fingers raised hands (right) -->
    <path d="M 210 36 L 212 32"/>
    <path d="M 208 35 L 209 30"/>
    <path d="M 206 35 L 206 30"/>
    <path d="M 204 36 L 203 31"/>
    <!-- Toes together -->
    <path d="M 104 240 L 104 236"/>
    <path d="M 108 240 L 108 236"/>
    <path d="M 112 240 L 112 236"/>
    <path d="M 128 240 L 128 236"/>
    <path d="M 132 240 L 132 236"/>
    <path d="M 136 240 L 136 236"/>
    <!-- Toes spread -->
    <path d="M 47 222 L 45 219"/>
    <path d="M 50 223 L 49 220"/>
    <path d="M 53 224 L 53 220"/>
    <path d="M 56 223 L 57 220"/>
    <path d="M 193 222 L 195 219"/>
    <path d="M 190 223 L 191 220"/>
    <path d="M 187 224 L 187 220"/>
    <path d="M 184 223 L 183 220"/>
    <!-- Hatch shading torso sides -->
    <path d="M 100 112 L 103 118"/>
    <path d="M 99 118 L 102 124"/>
    <path d="M 98 124 L 101 130"/>
    <path d="M 140 112 L 137 118"/>
    <path d="M 141 118 L 138 124"/>
    <path d="M 142 124 L 139 130"/>
  </g>
</svg>
