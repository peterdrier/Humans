    <path d="M 112,52 C 114,51 116,51 118,52" fill="none"/>
    <path d="M 122,52 C 124,51 126,51 128,52" fill="none"/>
    <!-- Eyelid top -->
    <path d="M 112.5,55 C 114,53 117,53 117.5,55" fill="none"/>
    <path d="M 122.5,55 C 123,53 126,53 127.5,55" fill="none"/>
    <!-- Eyes (outline) -->
    <ellipse cx="115" cy="56" rx="2.5" ry="1.6" fill="none"/>
    <ellipse cx="125" cy="56" rx="2.5" ry="1.6" fill="none"/>
    <!-- Pupils (filled) -->
    <circle cx="115" cy="56" r="0.9" fill="#3d2b1f"/>
    <circle cx="125" cy="56" r="0.9" fill="#3d2b1f"/>
    <!-- Nose bridge -->
    <path d="M 118,58 C 118,62 116,65 116,66" fill="none"/>
    <path d="M 122,58 C 122,62 124,65 124,66" fill="none"/>
    <!-- Nose tip -->
    <path d="M 116,66 C 118,67 122,67 124,66" fill="none"/>
    <!-- Nostrils -->
    <path d="M 115,66 C 115,68 117,68 118,66" fill="none"/>
    <path d="M 125,66 C 125,68 123,68 122,66" fill="none"/>
    <!-- Mouth -->
    <path d="M 115,68 C 118,70 122,70 125,68" fill="none"/>
    <path d="M 117,68 C 119,69 121,69 123,68" fill="none"/>
    <!-- Philtrum -->
    <line x1="120" y1="66" x2="120" y2="68" fill="none"/>

    <!-- Hair strands -->
    <path d="M 111,46 C 109,42 108,38 108,35" fill="none"/>
    <path d="M 115,45 C 114,41 114,37 114,34" fill="none"/>
    <path d="M 120,44 C 120,40 120,36 120,33" fill="none"/>
    <path d="M 125,45 C 126,41 126,37 126,34" fill="none"/>
    <path d="M 129,46 C 131,42 132,38 132,35" fill="none"/>

    <!-- Left hand: 4 fingers outline (hanging from palm) -->
    <path d="M 17,103 C 17,109 17.5,114 18,116 C 18.5,117.5 19.5,117.5 20,116 C 20.5,114 21,109 21,103" fill="none"/>
    <path d="M 20,103 C 20,110 20.5,115 21,117 C 21.5,118.5 22.5,118.5 23,117 C 23.5,115 24,110 24,103" fill="none"/>
    <path d="M 23,103 C 23,110 23.5,115 24,117 C 24.5,118.5 25.5,118.5 26,117 C 26.5,115 27,110 27,103" fill="none"/>
    <!-- Index (top of hand) -->
    <path d="M 19,87 C 19,82 18.5,78 18,77 C 17.5,76 16.5,76 16,77 C 15.5,78 16,82 16,87" fill="none"/>
    <!-- Thumb -->
    <path d="M 26,100 C 28,101 30,103 29,106 C 28,108 25.5,107 25,105 C 24,103 24.5,100 26,100" fill="none"/>
    <!-- Palm crease -->
    <path d="M 17,97 C 20,98 23,98 27,97" fill="none"/>

    <!-- Right hand: 4 fingers -->
    <path d="M 219,103 C 219,109 219.5,114 220,116 C 220.5,117.5 221.5,117.5 222,116 C 222.5,114 223,109 223,103" fill="none"/>
    <path d="M 216,103 C 216,110 216.5,115 217,117 C 217.5,118.5 218.5,118.5 219,117 C 219.5,115 220,110 220,103" fill="none"/>
    <path d="M 213,103 C 213,110 213.5,115 214,117 C 214.5,118.5 215.5,118.5 216,117 C 216.5,115 217,110 217,103" fill="none"/>
    <!-- Right index (top) -->
    <path d="M 221,87 C 221,82 221.5,78 222,77 C 222.5,76 223.5,76 224,77 C 224.5,78 224,82 224,87" fill="none"/>
    <!-- Right thumb -->
    <path d="M 214,100 C 212,101 210,103 211,106 C 212,108 214.5,107 215,105 C 216,103 215.5,100 214,100" fill="none"/>
    <!-- Palm crease -->
    <path d="M 213,97 C 216,98 219,98 223,97" fill="none"/>

    <!-- Left raised hand fingers (small, near circle edge) -->
    <path d="M 10,70 L 3,68" fill="none"/>
    <path d="M 9,72 L 2,71" fill="none"/>
    <path d="M 8,74 L 2,74" fill="none"/>
    <path d="M 9,77 L 3,78" fill="none"/>

    <!-- Right raised hand fingers -->
    <path d="M 230,70 L 237,68" fill="none"/>
    <path d="M 231,72 L 238,71" fill="none"/>
    <path d="M 232,74 L 238,74" fill="none"/>
    <path d="M 231,77 L 237,78" fill="none"/>

    <!-- Closed left foot toes -->
    <path d="M 103,241 L 101,243" fill="none"/>
    <path d="M 107,241 L 106,243" fill="none"/>
    <path d="M 110,241 L 110,243" fill="none"/>
    <path d="M 113,241 L 113,243" fill="none"/>
    <path d="M 116,241 L 117,243" fill="none"/>
    <!-- Closed right foot toes -->
    <path d="M 137,241 L 139,243" fill="none"/>
    <path d="M 133,241 L 134,243" fill="none"/>
    <path d="M 130,241 L 130,243" fill="none"/>
    <path d="M 127,241 L 127,243" fill="none"/>
    <path d="M 124,241 L 123,243" fill="none"/>

    <!-- Left spread foot toes -->
    <path d="M 54,239 L 52,241" fill="none"/>
    <path d="M 58,239 L 57,241" fill="none"/>
    <path d="M 62,239 L 62,241" fill="none"/>
    <path d="M 66,239 L 67,241" fill="none"/>
    <path d="M 70,238 L 71,240" fill="none"/>
    <!-- Right spread foot toes -->
    <path d="M 186,239 L 188,241" fill="none"/>
    <path d="M 182,239 L 183,241" fill="none"/>
    <path d="M 178,239 L 178,241" fill="none"/>
    <path d="M 174,239 L 173,241" fill="none"/>
    <path d="M 170,238 L 169,240" fill="none"/>

    <!-- Light torso hatching (engraving effect) -->
    <g opacity="0.45">
      <line x1="115" y1="92" x2="108" y2="107"/>
      <line x1="119" y1="92" x2="112" y2="108"/>
      <line x1="123" y1="92" x2="116" y2="108"/>
      <line x1="127" y1="92" x2="120" y2="108"/>
      <line x1="131" y1="92" x2="124" y2="108"/>
    </g>
  </g>

</svg>
