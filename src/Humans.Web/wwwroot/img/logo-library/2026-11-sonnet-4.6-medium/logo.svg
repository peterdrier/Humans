<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">

  <!-- Faint gold construction geometry — vanishes at small sizes -->
  <g stroke="#c9a96e" fill="none" stroke-width="0.4" opacity="0.28">
    <line x1="120" y1="-2" x2="120" y2="242"/>
    <line x1="-2" y1="120" x2="242" y2="120"/>
  </g>

  <!-- Frame: circle and square -->
  <circle cx="120" cy="120" r="120" fill="none" stroke="#c9a96e" stroke-width="2.5"/>
  <rect x="23" y="46" width="194" height="194" fill="none" stroke="#c9a96e" stroke-width="2.5"/>

  <!-- ══════════════════════════════════
       GOLD SOLID BASE — survives at 38 px
       ══════════════════════════════════ -->

  <!-- SPREAD LEGS (behind closed legs) -->
  <path fill="#c9a96e" d="
    M 109,147 C 106,160 102,174 96,189
    C 90,204 82,218 76,230 L 70,234
    C 68,232 68,229 71,230
    C 77,225 85,212 92,197
    C 98,183 103,168 108,153 Z"/>
  <path fill="#c9a96e" d="
    M 131,147 C 134,160 138,174 144,189
    C 150,204 158,218 164,230 L 170,234
    C 172,232 172,229 169,230
    C 163,225 155,212 148,197
    C 142,183 137,168 132,153 Z"/>

  <!-- Spread feet -->
  <path fill="#c9a96e" d="M 70,234 C 63,235 56,236 52,237 C 50,238 51,240 55,240
    C 61,240 68,239 74,238 C 76,237 76,234 70,234 Z"/>
  <path fill="#c9a96e" d="M 170,234 C 177,235 184,236 188,237 C 190,238 189,240 185,240
    C 179,240 172,239 166,238 C 164,237 164,234 170,234 Z"/>

  <!-- RAISED ARMS (behind horizontal arms) — tapered from shoulder to wrist -->
  <!-- Left raised arm: thick at shoulder (~12), narrows to wrist (~8) -->
  <path fill="#c9a96e" d="
    M 90,84
    C 68,80 44,76 11,70
    L 7,78
    C 40,82 65,86 88,94 Z"/>
  <!-- Left raised hand -->
  <path fill="#c9a96e" d="M 11,70 C 8,68 3,68 1,71 C -1,74 1,78 5,79
    L 7,78 C 4,76 5,73 8,73 Z"/>

  <!-- Right raised arm -->
  <path fill="#c9a96e" d="
    M 150,84
    C 172,80 196,76 229,70
    L 233,78
    C 200,82 175,86 152,94 Z"/>
  <!-- Right raised hand -->
  <path fill="#c9a96e" d="M 229,70 C 232,68 237,68 239,71 C 241,74 239,78 235,79
    L 233,78 C 236,76 235,73 232,73 Z"/>

  <!-- HORIZONTAL ARMS — tapered, slightly curved -->
  <!-- Left arm: 12 wide at shoulder, 7 wide at wrist -->
  <path fill="#c9a96e" d="
    M 90,86
    C 65,87 45,88 27,89
    L 27,98
    C 45,99 65,99 90,99 Z"/>
  <!-- Left palm -->
  <path fill="#c9a96e" d="M 27,87 L 17,87 L 17,103 L 27,103 Z"/>
  <!-- Left fingers (hanging down, 4 fingers with rounded tips) -->
  <path fill="#c9a96e" d="M 17,103 C 17,109 17.5,114 18,116 C 18.5,117.5 19.5,117.5 20,116 C 20.5,114 21,109 21,103 Z"/>
  <path fill="#c9a96e" d="M 20,103 C 20,110 20.5,115 21,117 C 21.5,118.5 22.5,118.5 23,117 C 23.5,115 24,110 24,103 Z"/>
  <path fill="#c9a96e" d="M 23,103 C 23,110 23.5,115 24,117 C 24.5,118.5 25.5,118.5 26,117 C 26.5,115 27,110 27,103 Z"/>
  <!-- Index finger (slightly shorter, rising from top of palm) -->
  <path fill="#c9a96e" d="M 19,87 C 19,82 18.5,78 18,77 C 17.5,76 16.5,76 16,77 C 15.5,78 16,82 16,87 Z"/>
  <!-- Left thumb -->
  <path fill="#c9a96e" d="M 26,100 C 28,101 30,103 29,106 C 28,108 25.5,107 25,105 C 24,103 24.5,100 26,100 Z"/>

  <!-- Right horizontal arm -->
  <path fill="#c9a96e" d="
    M 150,86
    C 175,87 195,88 213,89
    L 213,98
    C 195,99 175,99 150,99 Z"/>
  <!-- Right palm -->
  <path fill="#c9a96e" d="M 213,87 L 223,87 L 223,103 L 213,103 Z"/>
  <!-- Right fingers -->
  <path fill="#c9a96e" d="M 219,103 C 219,109 219.5,114 220,116 C 220.5,117.5 221.5,117.5 222,116 C 222.5,114 223,109 223,103 Z"/>
  <path fill="#c9a96e" d="M 216,103 C 216,110 216.5,115 217,117 C 217.5,118.5 218.5,118.5 219,117 C 219.5,115 220,110 220,103 Z"/>
  <path fill="#c9a96e" d="M 213,103 C 213,110 213.5,115 214,117 C 214.5,118.5 215.5,118.5 216,117 C 216.5,115 217,110 217,103 Z"/>
  <!-- Right index (rising from palm top) -->
  <path fill="#c9a96e" d="M 221,87 C 221,82 221.5,78 222,77 C 222.5,76 223.5,76 224,77 C 224.5,78 224,82 224,87 Z"/>
  <!-- Right thumb -->
  <path fill="#c9a96e" d="M 214,100 C 212,101 210,103 211,106 C 212,108 214.5,107 215,105 C 216,103 215.5,100 214,100 Z"/>

  <!-- TORSO (shoulders → hips) -->
  <path fill="#c9a96e" d="
    M 116,70
    C 114,74 112,80 112,88
    L 85,91
    C 81,92 79,96 81,101
    C 83,107 90,113 97,121
    C 100,126 100,131 100,137
    L 100,145
    L 140,145
    L 140,137
    C 140,131 140,126 143,121
    C 150,113 157,107 159,101
    C 161,96 159,92 155,91
    L 128,88
    C 128,80 126,74 124,70 Z"/>

  <!-- CLOSED LEGS (front, together) -->
  <path fill="#c9a96e" d="
    M 100,145
    C 97,159 96,172 97,185
    C 98,197 101,209 105,221
    C 108,230 110,236 112,241
    L 128,241
    C 130,236 132,230 135,221
    C 139,209 142,197 143,185
    C 144,172 143,159 140,145 Z"/>

  <!-- Closed feet -->
  <path fill="#c9a96e" d="M 112,241 C 109,241 105,240 102,240 C 100,241 100,242 103,242
    C 108,242 113,242 118,241 Z"/>
  <path fill="#c9a96e" d="M 128,241 C 131,241 135,240 138,240 C 140,241 140,242 137,242
    C 132,242 127,242 122,241 Z"/>

  <!-- HEAD -->
  <!-- Hair mass (slightly wider than skull) -->
  <ellipse cx="120" cy="52" rx="13.5" ry="9" fill="#c9a96e"/>
  <!-- Skull / face -->
  <ellipse cx="120" cy="58" rx="13" ry="12" fill="#c9a96e"/>

  <!-- ══════════════════════════════════
       AGED INK DETAILS
       ══════════════════════════════════ -->

  <!-- Tier 1 — 2.0 stroke: main contours, pose separations (shows from ~64 px) -->
  <g stroke="#3d2b1f" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.0">
    <!-- Head outline -->
    <ellipse cx="120" cy="58" rx="13" ry="12"/>
    <!-- Neck -->
    <line x1="116" y1="69" x2="113" y2="88"/>
    <line x1="124" y1="69" x2="127" y2="88"/>
    <!-- Shoulder to left armpit -->
    <path d="M 113,88 C 106,89 97,90 85,91"/>
    <path d="M 127,88 C 134,89 143,90 155,91"/>
    <!-- Left torso silhouette -->
    <path d="M 85,91 C 81,92 79,96 81,101 C 83,108 91,114 98,122 C 100,127 100,132 100,138 L 100,145"/>
    <!-- Right torso silhouette -->
    <path d="M 155,91 C 159,92 161,96 159,101 C 157,108 149,114 142,122 C 140,127 140,132 140,138 L 140,145"/>
    <!-- Pelvic base -->
    <path d="M 100,145 Q 120,142 140,145"/>
    <!-- Left leg outer (closed) -->
    <path d="M 100,145 C 97,159 96,173 97,186 C 98,198 102,210 106,222 C 109,231 111,237 112,241"/>
    <!-- Right leg outer (closed) -->
    <path d="M 140,145 C 143,159 144,173 143,186 C 142,198 138,210 134,222 C 131,231 129,237 128,241"/>
    <!-- Leg separation line (closed legs) -->
    <path d="M 120,143 C 118,157 118,170 118,183 C 118,196 119,208 122,221"/>
    <!-- Left spread leg outline -->
    <path d="M 108,147 C 104,163 98,178 91,193 C 84,208 76,221 71,232"/>
    <!-- Right spread leg outline -->
    <path d="M 132,147 C 136,163 142,178 149,193 C 156,208 164,221 169,232"/>
    <!-- Horizontal arm edges (top and bottom, curved to match taper) -->
    <path d="M 90,86 C 65,87 45,88 27,89"/>
    <path d="M 90,99 C 65,99 45,99 27,98"/>
    <path d="M 150,86 C 175,87 195,88 213,89"/>
    <path d="M 150,99 C 175,99 195,99 213,98"/>
    <!-- Raised arm edges -->
    <path d="M 90,84 C 68,80 44,76 11,70"/>
    <path d="M 88,94 C 65,86 40,82 7,78"/>
    <path d="M 150,84 C 172,80 196,76 229,70"/>
    <path d="M 152,94 C 175,86 200,82 233,78"/>
  </g>

  <!-- Tier 2 — 1.4 stroke: muscle groups, anatomy (shows from ~96 px) -->
  <g stroke="#3d2b1f" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
    <!-- Sternum -->
    <line x1="120" y1="88" x2="120" y2="130"/>
    <!-- Left pectoral curve -->
    <path d="M 85,92 C 92,94 100,96 108,95 C 112,95 116,94 120,93"/>
    <!-- Right pectoral curve -->
    <path d="M 155,92 C 148,94 140,96 132,95 C 128,95 124,94 120,93"/>
    <!-- Under-pec fold left -->
    <path d="M 86,101 C 92,102 97,103 102,102"/>
    <!-- Under-pec fold right -->
    <path d="M 154,101 C 148,102 143,103 138,102"/>
    <!-- Ab lines (3 horizontal bands) -->
    <path d="M 110,108 C 115,109 120,109 125,109 C 128,109 130,108 130,108"/>
    <path d="M 108,118 C 113,119 120,120 127,119 C 130,118 132,117"/>
    <!-- Navel -->
    <circle cx="120" cy="120" r="2.2"/>
    <!-- Hip crease left -->
    <path d="M 102,137 C 108,139 114,140 120,140"/>
    <!-- Hip crease right -->
    <path d="M 138,137 C 132,139 126,140 120,140"/>
    <!-- Knee left (closed) -->
    <path d="M 100,183 C 103,180 107,180 109,181 C 112,183 110,187 107,187"/>
    <!-- Knee right (closed) -->
    <path d="M 140,183 C 137,180 133,180 131,181 C 128,183 130,187 133,187"/>
    <!-- Left elbow (horizontal arm) -->
    <path d="M 60,91 C 58,89 57,91 59,93 C 61,94 63,92 60,91"/>
    <!-- Right elbow -->
    <path d="M 180,91 C 182,89 183,91 181,93 C 179,94 177,92 180,91"/>
    <!-- Collar bones -->
    <path d="M 113,88 C 116,86 120,85 124,86 C 127,87 128,88"/>
    <!-- Hair line -->
    <path d="M 108,47 C 112,44 116,43 120,43 C 124,43 128,44 132,47"/>
    <!-- Ear left -->
    <path d="M 107,55 C 106,52 106,57 107,61 C 108,63 109,62 109,59"/>
    <!-- Ear right -->
    <path d="M 133,55 C 134,52 134,57 133,61 C 132,63 131,62 131,59"/>
    <!-- Chin line -->
    <path d="M 115,70 C 118,71 122,71 125,70"/>
  </g>

  <!-- Tier 3 — 0.9 stroke: face, fingers, toes, hatching (shows from ~150 px) -->
  <g stroke="#3d2b1f" stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9">
