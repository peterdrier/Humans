<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 244 244" role="img" aria-label="Vitruvian Man">
  <defs>
    <!-- Left half of background pose: raised arm + spread leg -->
    <g id="bg-half">
      <!-- Raised arm reaching circle & square top at (25.5, 46), with bicep & forearm swell -->
      <path d="M 106 81.5
               C 99.5 77, 92 72.8, 83.5 69
               C 76.5 65.6, 70 63, 65 61.3
               C 57.5 57.5, 49.8 54, 41.5 51.8
               C 39.2 50.6, 38.2 48.2, 37.2 47
               C 36.2 46, 35 46.7, 35.4 48.2
               C 35.8 49.4, 35.6 50.2, 34.6 49.8
               C 32 48.3, 29.4 46.8, 27.6 46.3
               C 26.8 46.1, 26.4 46.7, 27 47.2
               L 25.5 46.5
               C 24.8 46.5, 24.9 47.8, 26.2 48.6
               C 25.9 49.6, 26.8 50.6, 28.2 51.4
               C 28.6 52.4, 29.9 53.3, 31.6 54
               C 34.2 55.1, 37.2 55.9, 39.4 56.6
               C 47.5 61.2, 56 66.4, 63.5 70.2
               C 71 74.8, 81 80.8, 93 87.5
               L 106 95.5 Z"
