    <!-- Tier 1 etch (≈1.5): pose separations strictly inside actual overlap zones -->
    <g id="etch-t1-half" fill="none" stroke="#3d2b1f" stroke-linecap="round" stroke-linejoin="round">
      <!-- Horizontal arm upper edge crossing in front of raised arm (x=101..86) -->
      <path d="M 101 79.4 C 96 78.9, 91 79.4, 86.2 80.1" stroke-width="1.45"/>
      <path d="M 86.5 80.1 L 83.2 80.2" stroke-width="0.85"/>
      <!-- Axilla fold where horizontal arm meets raised arm lower edge -->
      <path d="M 101.2 93.2 C 98.8 92.3, 96.5 91.6, 94.2 91.1" stroke-width="1.4"/>
      <!-- Standing outer thigh crossing in front of spread thigh (y=136..164) -->
      <path d="M 102.3 136 C 102 145, 102.5 154, 103.5 163.8" stroke-width="1.5"/>
      <path d="M 102.4 132.5 L 102.3 136.5 M 103.5 163.4 L 103.8 166.5" stroke-width="0.9"/>
      <!-- Chin / jawline contour separating head from neck -->
      <path d="M 120 70.2 C 117.2 70.2, 114.8 68.5, 113.4 65.8" stroke-width="1.3"/>
    </g>

    <!-- Tier 2 etch (≈1.0-1.15): major muscle groups & flowing Renaissance hair -->
    <g id="etch-t2-half" fill="none" stroke="#3d2b1f" stroke-linecap="round" stroke-linejoin="round">
      <!-- Clavicle & sternocleidomastoid -->
      <path d="M 119.2 80.5 C 115.2 80.7, 109.2 80.2, 103.8 81.4" stroke-width="1.05"/>
      <path d="M 115.5 72.2 C 116.1 74.9, 117.4 77.6, 119.1 79.6" stroke-width="0.85" opacity="0.8"/>
      <!-- Pectoral lower sweep -->
      <path d="M 119.2 95.4 C 115.5 96.1, 109.8 95.7, 105.8 93.5 C 104 92.5, 102.8 90.8, 102.4 88.8" stroke-width="1.15"/>
      <!-- Subtle costal arch (ribcage) -->
      <path d="M 118.4 101 C 115.2 102.3, 111.8 104.5, 109.2 107.4" stroke-width="0.82" opacity="0.7"/>
      <!-- Soft S-curved iliac crest / inguinal fold -->
      <path d="M 104.6 125.6 C 106.2 130, 110.2 134.8, 116.6 139.4" stroke-width="0.95" opacity="0.78"/>
      <!-- Deltoid & bicep contour on horizontal arm -->
      <path d="M 96 81.8 C 93.2 83.4, 91.8 85.8, 92.2 88.2" stroke-width="0.98"/>
      <path d="M 77.5 84.3 C 73.2 84.8, 69.2 84.8, 66.2 84.1" stroke-width="0.75" opacity="0.65"/>
      <!-- Raised arm visible bicep contour -->
      <path d="M 76.5 70.4 C 72 68.5, 68.2 66.8, 65.2 65.8" stroke-width="0.75" opacity="0.65"/>
      <!-- Standing knee patella & vastus medialis teardrop -->
      <path d="M 109.5 188.2 C 110.6 186.8, 112.8 186.8, 114 188.2" stroke-width="0.95"/>
      <path d="M 115.2 179.5 C 115 182, 114.4 184.2, 113.5 185.8" stroke-width="0.75" opacity="0.68"/>
      <path d="M 110.8 191.6 C 112 192.2, 113.2 191.6, 113.9 190.6" stroke-width="0.75" opacity="0.68"/>
      <!-- Spread knee subtle patella -->
      <path d="M 82.6 186.2 C 84.1 185.6, 85.8 186.2, 86.8 187.6" stroke-width="0.88" opacity="0.75"/>
      <!-- Flowing Renaissance curls framing the face (with gentle center part) -->
      <path d="M 120 47.4 C 117 47.3, 114.2 48.2, 112.2 49.8" stroke-width="0.68" opacity="0.62"/>
      <path d="M 120 48.2 C 116.5 48.3, 113.5 50.2, 112.2 53.5 C 111.3 56.2, 111.6 59.8, 112.6 63.4" stroke-width="1.0"/>
      <path d="M 114.4 48.4 C 111.2 50.2, 109.4 53.8, 109.8 58 C 110.1 60.8, 109.2 63.2, 110.2 65.4" stroke-width="0.88"/>
      <path d="M 111.4 55.6 C 110.2 58.2, 110.6 61.2, 111.5 64" stroke-width="0.72" opacity="0.7"/>
      <path d="M 116.8 47.6 C 114.2 48.4, 112.2 50.2, 111 52.6" stroke-width="0.7" opacity="0.68"/>
    </g>

    <!-- Tier 3 etch (≈0.65-0.8): classical face, fingers, toes, delicate muscle modeling & engraving hatching -->
    <g id="etch-t3-half" fill="none" stroke="#3d2b1f" stroke-linecap="round" stroke-linejoin="round">
      <!-- Serene classical Renaissance face -->
      <!-- Soft brow arch -->
      <path d="M 114.3 56.2 C 115.8 55.6, 117.6 55.7, 119 56.4" stroke-width="0.8"/>
      <!-- Upper eyelid & iris shadow -->
      <path d="M 114.8 57.9 C 115.8 57.5, 117 57.5, 117.8 58" stroke-width="0.7"/>
      <circle cx="116.3" cy="58.1" r="0.42" fill="#3d2b1f" stroke="none"/>
      <!-- Delicate nose ridge & tip -->
      <path d="M 119.2 56.8 C 119.1 58.8, 119 60.6, 118.7 62" stroke-width="0.52" opacity="0.5"/>
      <path d="M 118.2 62.4 C 118.8 62.8, 119.4 62.8, 120 62.5" stroke-width="0.68"/>
      <!-- Composed classical mouth -->
      <path d="M 117.6 65.3 C 118.4 65.1, 119.2 65.2, 120 65.4" stroke-width="0.75"/>
      <path d="M 118.6 66.8 C 119.1 67, 119.6 67, 120 67" stroke-width="0.58" opacity="0.68"/>

      <!-- Horizontal hand finger separations & palm crease -->
      <path d="M 33.4 82.9 L 25.4 82.9" stroke-width="0.68"/>
      <path d="M 33.6 84.4 L 24.6 84.4" stroke-width="0.68"/>
      <path d="M 34 85.9 L 27 85.9" stroke-width="0.68"/>
      <path d="M 38.2 83.2 C 37 84.4, 36.8 85.8, 37.5 86.7" stroke-width="0.58" opacity="0.68"/>

      <!-- Raised hand finger separations & palm crease -->
      <path d="M 34.6 50.6 L 27.6 47.2" stroke-width="0.68"/>
      <path d="M 33.8 52 L 26.8 48.8" stroke-width="0.68"/>
      <path d="M 33.3 53.3 L 28.6 51.1" stroke-width="0.68"/>
      <path d="M 37.6 52.2 C 36.6 53.3, 36.4 54.6, 37 55.5" stroke-width="0.58" opacity="0.68"/>

      <!-- Standing foot toes & ankle malleolus -->
      <path d="M 107.2 238.4 L 106.2 239.6 M 109.2 238.5 L 108.5 239.6 M 111 238.6 L 110.6 239.6" stroke-width="0.62"/>
      <path d="M 110.4 231.5 C 111.4 232.2, 112.4 232.2, 113.2 231.5" stroke-width="0.62" opacity="0.72"/>

      <!-- Spread foot toes -->
      <path d="M 58.4 221.2 L 56.6 221.8 M 59.6 222.4 L 58 223.2" stroke-width="0.62"/>

      <!-- Delicate leg muscle modeling (fine so never dark stripes) -->
      <path d="M 107.6 164 C 108.8 171, 110.2 178, 110.8 183.5" stroke-width="0.68" opacity="0.52"/>
      <path d="M 108.8 202.5 C 110 207.5, 111 212, 111.4 216.5" stroke-width="0.68" opacity="0.52"/>
      <path d="M 76.8 199.5 C 75.8 204.5, 74.4 209, 73 213" stroke-width="0.68" opacity="0.48"/>

      <!-- Abdominal subtle impressions & nipple -->
      <path d="M 117.4 107 C 115.2 107.5, 113.4 107.3, 112 106.7" stroke-width="0.62" opacity="0.52"/>
      <path d="M 117.6 113.2 C 115.6 113.6, 113.8 113.5, 112.4 112.9" stroke-width="0.62" opacity="0.52"/>
      <circle cx="111.5" cy="93.8" r="0.68" fill="#3d2b1f" stroke="none" opacity="0.8"/>

      <!-- Delicate Leonardo engraving hatching in shadow hollows -->
      <g stroke-width="0.48" opacity="0.38">
        <!-- Under pectoral -->
        <path d="M 106.8 95.6 L 105.4 97.4 M 109.6 96.3 L 108.2 98.1 M 112.5 96.6 L 111.1 98.4"/>
        <!-- Rib side shadow -->
        <path d="M 102.4 100.8 L 104.8 102 M 103.1 103.8 L 105.4 105 M 103.9 106.8 L 106.1 108 M 104.7 109.8 L 106.7 110.9"/>
        <!-- Under chin / neck shadow -->
        <path d="M 116.5 70.6 L 117.2 72.2 M 118.4 70.8 L 118.8 72.4"/>
        <!-- Inner groin shadow -->
        <path d="M 115.2 140.5 L 117.2 142 M 114.2 143 L 116.2 144.6"/>
        <!-- Subtle shadow along underside of horizontal arm & inner spread thigh -->
        <path d="M 73 88.2 L 74.5 89.2 M 76.5 88.4 L 78 89.4 M 80 88.6 L 81.5 89.6"/>
        <path d="M 99.6 170.2 L 97.6 169.3 M 97.8 173.4 L 95.8 172.5 M 96 176.6 L 94 175.7 M 94.2 179.8 L 92.2 178.9"/>
      </g>
    </g>
  </defs>

  <!-- 1. Faint gold geometric construction (vanishes small, enriches large) -->
  <g fill="none" stroke="#c9a96e" stroke-linecap="round">
    <g stroke-width="0.65" opacity="0.24">
      <line x1="120" y1="0" x2="120" y2="240"/>
      <line x1="0" y1="120" x2="240" y2="120"/>
    </g>
    <g stroke-width="0.55" opacity="0.16">
      <!-- Eight-head horizontal guides inside square -->
      <line x1="23" y1="70" x2="217" y2="70"/>
      <line x1="23" y1="94.5" x2="217" y2="94.5"/>
      <line x1="23" y1="143" x2="217" y2="143"/>
      <line x1="23" y1="191.5" x2="217" y2="191.5"/>
      <!-- Compass arc centred on navel -->
      <circle cx="120" cy="120" r="97" stroke-dasharray="3 4"/>
    </g>
    <!-- Edge ticks on the square -->
    <g stroke-width="0.8" opacity="0.36">
      <path d="M 23 70 H 27.5 M 23 94.5 H 27.5 M 23 143 H 28.5 M 23 191.5 H 27.5"/>
      <path d="M 217 70 H 212.5 M 217 94.5 H 212.5 M 217 143 H 211.5 M 217 191.5 H 212.5"/>
      <path d="M 71.5 46 V 50.5 M 168.5 46 V 50.5 M 71.5 240 V 235.5 M 168.5 240 V 235.5"/>
    </g>
  </g>

  <!-- 2. Bold solid frame: Circle (120,120) r=120 and Square (23,46) 194x194 -->
  <circle cx="120" cy="120" r="120" fill="none" stroke="#c9a96e" stroke-width="2.7"/>
  <rect x="23" y="46" width="194" height="194" fill="none" stroke="#c9a96e" stroke-width="2.2"/>

  <!-- 3. Bold solid gold figure: background pose first, then foreground pose -->
  <use href="#bg-half"/>
  <use href="#bg-half" transform="translate(240,0) scale(-1,1)"/>

  <use href="#fg-half"/>
  <use href="#fg-half" transform="translate(240,0) scale(-1,1)"/>

  <!-- Head & wavy Renaissance hair (solid gold, crown touches y=46, chin y=70) -->
  <path d="M 120 46
           C 115.2 46, 111.2 48.2, 109.2 51.8
           C 107.6 54, 107.4 56.8, 108.2 58.8
           C 107.2 60.8, 107.6 63.6, 109.2 65.6
           C 110.4 67.2, 112.1 67.4, 113.3 66.2
           C 114.6 68.7, 117 70.2, 120 70.2
           C 123 70.2, 125.4 68.7, 126.7 66.2
           C 127.9 67.4, 129.6 67.2, 130.8 65.6
           C 132.4 63.6, 132.8 60.8, 131.8 58.8
           C 132.6 56.8, 132.4 54, 130.8 51.8
           C 128.8 48.2, 124.8 46, 120 46 Z"
        fill="#c9a96e"/>

  <!-- 4. Tiered aged-ink etch (#3d2b1f) -->
  <use href="#etch-t1-half"/>
  <use href="#etch-t1-half" transform="translate(240,0) scale(-1,1)"/>

  <use href="#etch-t2-half"/>
  <use href="#etch-t2-half" transform="translate(240,0) scale(-1,1)"/>

  <use href="#etch-t3-half"/>
  <use href="#etch-t3-half" transform="translate(240,0) scale(-1,1)"/>

  <!-- Centerline details (navel at 120,120, linea alba, classical groin) -->
  <g fill="none" stroke="#3d2b1f" stroke-linecap="round">
    <path d="M 120 82.5 L 120 94" stroke-width="0.65" opacity="0.5"/>
    <path d="M 120 100.5 L 120 116.5" stroke-width="0.6" opacity="0.42"/>
    <!-- Navel at exact circle center (120,120) -->
    <path d="M 118.9 119.8 C 119.4 118.9, 120.6 118.9, 121.1 119.8 C 120.6 120.7, 119.4 120.7, 118.9 119.8 Z" stroke-width="0.75"/>
    <circle cx="120" cy="120" r="0.38" fill="#3d2b1f" stroke="none"/>
    <!-- Subtle pubic / groin arch at y=143 -->
    <path d="M 117.8 142.3 L 120 143.4 L 122.2 142.3" stroke-width="0.85" opacity="0.75"/>
  </g>
</svg>
