               C 62.8 220, 58.8 219.3, 56 220.2
               C 55 220.6, 55.3 222.3, 57 223.4
               C 60.2 225.3, 64.2 226.8, 68 227.8
               C 69.8 228.2, 71.2 226.8, 71.4 224.6
               C 72.1 221, 74.4 216.2, 78.4 209.6
               C 82.2 203, 86 195.5, 89.2 189
               C 95 178.5, 103 165.5, 111.5 153.5
               L 119.5 143.5 Z"
            fill="#c9a96e"/>
    </g>

    <!-- Left half of foreground pose: horizontal arm + torso + standing leg -->
    <g id="fg-half">
