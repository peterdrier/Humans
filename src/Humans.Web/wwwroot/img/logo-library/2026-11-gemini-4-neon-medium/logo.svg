      <!-- Half torso + standing leg (x <= 120), sculpted thigh & calf -->
      <path d="M 120 69.5
               L 115.2 69.8
               C 114.9 73.2, 114.2 75.8, 112.2 77
               C 109.5 78.2, 105.5 78.8, 101 79.6
               C 97.8 82.8, 98.2 88.2, 99.6 93.2
               C 100.8 99.5, 102.6 105.5, 104.5 112.5
               C 103.5 118.2, 102.6 123.8, 102.3 130.5
               C 101.8 138, 102 147.5, 103.1 158
               C 104.1 168.5, 105.6 179, 106.8 189.5
               C 104.8 197.5, 104.9 206.5, 106.5 214.5
               C 107.8 221.5, 109.4 227, 109.8 231.5
               C 108.5 234.5, 105.8 236.8, 104.6 238.2
               C 104 239.2, 104.8 240, 106.5 240
               L 116.2 240
               C 117.3 240, 117.6 238.8, 117 236.8
               C 116.2 234.2, 115.6 232.2, 115.4 230.5
               C 116.4 223, 118 214.5, 117.8 205.5
               C 117.6 199.2, 116.7 193.5, 116.6 189.5
               C 117.6 184, 118.1 178, 118.3 171
