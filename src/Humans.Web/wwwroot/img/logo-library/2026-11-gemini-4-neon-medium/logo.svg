               C 38.6 82, 36.8 78.6, 35 76.7
               C 33.9 75.6, 32.6 76.5, 33.2 78
               C 33.9 79.5, 34.5 80.8, 33.8 81.3
               C 30.6 81.3, 27.4 81.4, 25.2 81.8
               C 24.4 82, 24.2 82.7, 24.9 83
               L 23.2 83.3
               C 22.7 83.5, 22.8 84.6, 23.9 84.9
               C 23.9 85.8, 25 86.4, 26.4 86.7
               C 27 87.5, 28.5 87.9, 30.5 87.9
               C 33.8 88, 37.4 87.7, 40.8 86.9
               C 49.5 88.3, 58 89, 66 88.6
               C 74 89.3, 83 89.8, 92.5 91
               L 101 93.2 Z"
